<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Sles // Archive</title>

    <link
        rel="icon"
        href="https://shared.fastly.steamstatic.com/community_assets/images/apps/1256670/6aae1f276e95e65de99d6ffea75f010167d5d0c6.jpg"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet"
    >


    <style>

        :root {

            --blue: #59c9f7;
            --blue-bright: #8ce3ff;
            --blue-dark: #369ac7;

            --white: #ffffff;

            --text: #385364;
            --text-soft: #7893a3;

            --mouse-x: 50%;
            --mouse-y: 50%;

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

        }

        body {

            overflow: hidden;

            background: #b9e9ff;

            font-family:
                "Barlow",
                "Noto Sans TC",
                sans-serif;

            color: var(--text);

            user-select: none;

            -webkit-tap-highlight-color: transparent;

        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .background {

            position: fixed;

            /*
             * 永遠大於 1，避免漂移時露出邊界
             */
            inset: -5%;

            z-index: 0;

            background-image:
                linear-gradient(
                    rgba(213,244,255,0.05),
                    rgba(213,244,255,0.18)
                ),
                url("maxresdefault.jpg");

            background-size: cover;

            background-position: center;

            /*
             * 這裡故意留很大的安全區
             */
            transform:
                scale(1.14)
                translate3d(0,0,0);

            will-change: transform;

            transition:
                filter 1.5s ease;

        }


        /* =====================================================
           BACKGROUND VIGNETTE
        ===================================================== */

        .background-vignette {

            position: fixed;

            inset: 0;

            z-index: 1;

            pointer-events: none;

            background:

                radial-gradient(
                    ellipse at center,
                    transparent 30%,
                    rgba(72,131,157,0.10) 70%,
                    rgba(46,105,132,0.22) 100%
                );

        }


        /* =====================================================
           LIGHT WASH
        ===================================================== */

        .light-wash {

            position: fixed;

            inset: 0;

            z-index: 2;

            pointer-events: none;

            opacity: 0.5;

            background:

                radial-gradient(
                    circle 500px at var(--mouse-x) var(--mouse-y),
                    rgba(255,255,255,0.22),
                    transparent 70%
                );

            transition:
                background 0.6s ease;

        }


        /* =====================================================
           GRID
        ===================================================== */

        .grid {

            position: fixed;

            inset: 0;

            z-index: 3;

            pointer-events: none;

            opacity: 0.16;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.22) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.22) 1px,
                    transparent 1px
                );

            background-size:
                72px 72px;

            mask-image:
                radial-gradient(
                    ellipse at center,
                    black 10%,
                    transparent 78%
                );

            -webkit-mask-image:
                radial-gradient(
                    ellipse at center,
                    black 10%,
                    transparent 78%
                );

        }


        /* =====================================================
           VFX CANVAS
        ===================================================== */

        #vfx-canvas {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 4;

            pointer-events: none;

        }


        /* =====================================================
           TOP HUD
        ===================================================== */

        .top-ui {

            position: fixed;

            top: 24px;
            left: 30px;
            right: 30px;

            z-index: 20;

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 11px;

            color:
                rgba(39,92,118,0.70);

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 2.5px;

        }


        .brand-symbol {

            width: 11px;
            height: 11px;

            background: white;

            border:
                2px solid
                var(--blue);

            transform:
                rotate(45deg);

            box-shadow:
                0 0 12px
                rgba(89,201,247,0.8);

            animation:
                symbolPulse 3s ease-in-out infinite;

        }


        @keyframes symbolPulse {

            0%,
            100% {
                box-shadow:
                    0 0 8px
                    rgba(89,201,247,0.45);
            }

            50% {
                box-shadow:
                    0 0 18px
                    rgba(89,201,247,0.9);
            }

        }


        .top-info {

            display: flex;

            flex-direction: column;

            align-items: flex-end;

            gap: 5px;

            color:
                rgba(46,95,118,0.55);

            font-size: 9px;

            font-weight: 600;

            letter-spacing: 2px;

        }


        /* =====================================================
           SIDE HUD
        ===================================================== */

        .side-hud {

            position: fixed;

            left: 27px;
            top: 50%;

            transform:
                translateY(-50%);

            z-index: 15;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 12px;

            opacity: 0.55;

        }


        .side-line {

            width: 1px;

            height: 70px;

            background:

                linear-gradient(
                    to bottom,
                    transparent,
                    var(--blue),
                    transparent
                );

        }


        .side-label {

            writing-mode:
                vertical-rl;

            color:
                #5288a0;

            font-size: 8px;

            letter-spacing: 3px;

        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            position: relative;

            width: 100%;
            height: 100%;

            z-index: 10;

            display: flex;

            align-items: center;
            justify-content: center;

            perspective: 1100px;

        }


        /* =====================================================
           PANEL
        ===================================================== */

        .panel {

            position: relative;

            width:
                min(620px, 88vw);

            min-height: 445px;

            padding:
                48px 52px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.82),
                    rgba(245,252,255,0.64)
                );

            border:
                1px solid
                rgba(255,255,255,0.95);

            box-shadow:

                0 30px 90px
                rgba(49,117,146,0.24),

                0 4px 20px
                rgba(49,117,146,0.12);

            backdrop-filter:
                blur(18px)
                saturate(130%);

            -webkit-backdrop-filter:
                blur(18px)
                saturate(130%);

            overflow: hidden;

            opacity: 0;

            transform:
                translateY(18px)
                scale(0.97);

            transition:

                opacity 0.9s
                cubic-bezier(0.22,1,0.36,1),

                transform 1s
                cubic-bezier(0.22,1,0.36,1);

        }


        /*
         * 開機完成
         */

        body.booted .panel {

            opacity: 1;

            transform:
                translateY(0)
                scale(1);

        }


        /* =====================================================
           PANEL LIGHT
        ===================================================== */

        .panel-light {

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:

                radial-gradient(
                    450px circle at
                    var(--mouse-x)
                    var(--mouse-y),

                    rgba(255,255,255,0.28),

                    transparent 65%
                );

            opacity: 0.8;

        }


        /* =====================================================
           PANEL TOP BAR
        ===================================================== */

        .panel::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 4px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    #69d7ff 18%,
                    #ffffff 50%,
                    #69d7ff 82%,
                    transparent
                );

            animation:
                topLight 5s ease-in-out infinite;

        }


        @keyframes topLight {

            0%,
            100% {
                opacity: 0.65;
            }

            50% {
                opacity: 1;
            }

        }


        /* =====================================================
           CORNERS
        ===================================================== */

        .corner {

            position: absolute;

            width: 23px;
            height: 23px;

            opacity: 0.65;

        }


        .corner::before,
        .corner::after {

            content: "";

            position: absolute;

            background:
                var(--blue);

        }


        .corner::before {

            width: 100%;
            height: 1px;

        }


        .corner::after {

            width: 1px;
            height: 100%;

        }


        .corner-tl {
            top: 17px;
            left: 17px;
        }

        .corner-tr {
            top: 17px;
            right: 17px;
            transform: rotate(90deg);
        }

        .corner-bl {
            bottom: 17px;
            left: 17px;
            transform: rotate(-90deg);
        }

        .corner-br {
            bottom: 17px;
            right: 17px;
            transform: rotate(180deg);
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            position: relative;

            z-index: 5;

            display: flex;

            align-items: center;

            gap: 13px;

        }


        .header-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                var(--blue);

            box-shadow:
                0 0 12px
                rgba(89,201,247,0.8);

            animation:
                headerDot 2s ease-in-out infinite;

        }


        @keyframes headerDot {

            0%,
            100% {
                opacity: 0.55;
            }

            50% {
                opacity: 1;
            }

        }


        .header-line {

            width: 34px;

            height: 1px;

            background:
                var(--blue);

        }


        .header-label {

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 2.5px;

            color:
                var(--blue-dark);

        }


        /* =====================================================
           TITLE
        ===================================================== */

        .title {

            position: relative;

            z-index: 5;

            margin-top: 18px;

            color:
                #ffffff;

            font-size:
                clamp(52px, 9vw, 72px);

            font-weight: 800;

            letter-spacing:
                -2px;

            line-height:
                0.95;

            text-shadow:
                0 3px 16px
                rgba(54,120,149,0.28);

        }


        .subtitle {

            position: relative;

            z-index: 5;

            margin-top: 11px;

            color:
                #627f90;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 2px;

        }


        /* =====================================================
           DATA
        ===================================================== */

        .data-grid {

            position: relative;

            z-index: 5;

            margin-top: 38px;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0,1fr));

            gap: 11px;

        }


        .data-card {

            position: relative;

            min-height: 76px;

            padding:
                14px 16px;

            background:
                rgba(255,255,255,0.56);

            border:
                1px solid
                rgba(255,255,255,0.9);

            overflow: hidden;

            transform:
                translateY(10px);

            opacity: 0;

            transition:

                transform 0.55s
                cubic-bezier(0.22,1,0.36,1),

                opacity 0.55s ease,

                background 0.2s ease,

                border-color 0.2s ease;

        }


        body.booted .data-card {

            transform:
                translateY(0);

            opacity: 1;

        }


        body.booted .data-card:nth-child(1) {
            transition-delay: 0.25s;
        }

        body.booted .data-card:nth-child(2) {
            transition-delay: 0.35s;
        }

        body.booted .data-card:nth-child(3) {
            transition-delay: 0.45s;
        }

        body.booted .data-card:nth-child(4) {
            transition-delay: 0.55s;
        }


        .data-card::before {

            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 3px;
            height: 100%;

            background:
                var(--blue);

            transform:
                scaleY(0);

            transform-origin:
                bottom;

            transition:
                transform 0.25s ease;

        }


        .data-card:hover {

            background:
                rgba(255,255,255,0.82);

            border-color:
                rgba(89,201,247,0.36);

            transform:
                translateY(-3px);

        }


        .data-card:hover::before {

            transform:
                scaleY(1);

        }


        .data-label {

            margin-bottom: 6px;

            color:
                #7895a5;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 1.5px;

        }


        .data-value {

            color:
                #405b6a;

            font-size: 14px;

            font-weight: 600;

            line-height: 1.4;

        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {

            position: absolute;

            right: 27px;
            bottom: 20px;

            z-index: 10;

            color:
                #7895a5;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 2px;

        }


        /* =====================================================
           NAV BUTTON
        ===================================================== */

        .nav {

            position: fixed;

            top: 50%;

            width: 54px;
            height: 54px;

            z-index: 30;

            transform:
                translateY(-50%);

            border:
                1px solid
                rgba(255,255,255,0.92);

            background:
                rgba(255,255,255,0.62);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            box-shadow:
                0 12px 30px
                rgba(48,112,143,0.15);

            cursor: pointer;

            display: flex;

            justify-content: center;
            align-items: center;

            opacity: 0;

            transition:

                opacity 0.8s ease,

                transform 0.2s ease,

                background 0.2s ease,

                box-shadow 0.2s ease;

        }


        body.booted .nav {

            opacity: 1;

        }


        .nav:hover {

            background:
                rgba(255,255,255,0.92);

            box-shadow:
                0 15px 35px
                rgba(48,112,143,0.22);

        }


        .nav:active {

            transform:
                translateY(-50%)
                scale(0.88);

        }


        .nav-left {
            left: 26px;
        }

        .nav-right {
            right: 26px;
        }


        .arrow {

            width: 10px;
            height: 10px;

            border-top:
                2px solid
                var(--blue-dark);

            border-right:
                2px solid
                var(--blue-dark);

        }


        .arrow-left {

            transform:
                rotate(-135deg);

            margin-left: 4px;

        }


        .arrow-right {

            transform:
                rotate(45deg);

            margin-right: 4px;

        }


        /* =====================================================
           MUSIC
        ===================================================== */

        .music {

            position: fixed;

            right: 28px;
            bottom: 25px;

            z-index: 40;

            display: flex;

            align-items: center;

            gap: 9px;

        }


        .music-label {

            padding:
                7px 12px;

            background:
                rgba(255,255,255,0.72);

            border:
                1px solid
                rgba(255,255,255,0.9);

            backdrop-filter:
                blur(10px);

            color:
                #5e7c8d;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1px;

            opacity: 0;

            transform:
                translateX(10px);

            transition:
                all 0.2s ease;

        }


        .music:hover .music-label {

            opacity: 1;

            transform:
                translateX(0);

        }


        .music-button {

            width: 48px;
            height: 48px;

            border:
                1px solid
                rgba(255,255,255,0.95);

            background:
                rgba(255,255,255,0.76);

            color:
                var(--blue-dark);

            font-size: 17px;

            cursor: pointer;

            box-shadow:
                0 10px 28px
                rgba(48,112,143,0.16);

            transition:
                transform 0.2s ease,
                background 0.2s ease;

        }


        .music-button:hover {

            transform:
                translateY(-3px);

            background:
                #ffffff;

        }


        .music-button.playing {

            background:
                var(--blue);

            color:
                #ffffff;

            box-shadow:

                0 0 0 5px
                rgba(89,201,247,0.12),

                0 10px 30px
                rgba(48,112,143,0.22);

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 700px) {

            .top-ui {

                top: 18px;

                left: 16px;
                right: 16px;

            }


            .top-info {

                font-size: 8px;

            }


            .side-hud {

                display: none;

            }


            .panel {

                width: 90vw;

                min-height: 430px;

                padding:
                    40px 23px 48px;

            }


            .title {

                font-size: 48px;

            }


            .data-grid {

                grid-template-columns:
                    1fr;

                margin-top: 27px;

            }


            .nav {

                width: 43px;
                height: 43px;

            }


            .nav-left {

                left: 9px;

            }


            .nav-right {

                right: 9px;

            }


            .music {

                right: 15px;
                bottom: 15px;

            }


            .music-label {

                display: none;

            }

        }

    </style>

</head>


<body>

        const page =
            document.getElementById(
                "page"
            );

        const background =
            document.getElementById(
                "background"
            );

        const lightWash =
            document.getElementById(
                "light-wash"
            );


        let currentPage = 0;

        let changingPage = false;


        /* =================================================
           RENDER
        ================================================= */

        function renderPage(index) {

            const data =
                pages[index];

            headerLabel.textContent =
                data.label;

            title.textContent =
                data.title;

            subtitle.textContent =
                data.subtitle;

            dataGrid.innerHTML = "";


            data.rows.forEach(
                row => {

                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "data-card";

                    item.innerHTML = `

                        <div class="data-label">
                            ${row.label}
                        </div>

                        <div class="data-value">
                            ${row.value}
                        </div>

                    `;

                    dataGrid.appendChild(
                        item
                    );

                }
            );


            page.textContent =
                `${String(index + 1).padStart(2,"0")} / ${String(pages.length).padStart(2,"0")}`;

        }


        /* =================================================
           PAGE SWITCH
        ================================================= */

        function switchPage(direction) {

            if (changingPage)
                return;

            changingPage = true;


            /*
             * 專屬翻頁 SFX
             */
            if (
                window.playInterfaceSfx
            ) {

                window.playInterfaceSfx(
                    "page"
                );

            }


            const offset =
                direction === "next"
                    ? -28
                    : 28;


            panel.style.transition =
                "opacity .22s ease, transform .22s ease, filter .22s ease";


            panel.style.opacity =
                "0";

            panel.style.transform =
                `translateX(${offset}px) scale(.985)`;

            panel.style.filter =
                "blur(4px)";


            setTimeout(
                () => {

                    if (
                        direction === "next"
                    ) {

                        currentPage =
                            (currentPage + 1)
                            % pages.length;

                    } else {

                        currentPage =
                            (currentPage - 1 + pages.length)
                            % pages.length;

                    }


                    renderPage(
                        currentPage
                    );


                    panel.style.transition =
                        "none";

                    panel.style.transform =
                        `translateX(${-offset}px) scale(.985)`;

                    panel.style.opacity =
                        "0";


                    requestAnimationFrame(
                        () => {

                            requestAnimationFrame(
                                () => {

                                    panel.style.transition =
                                        "opacity .45s ease, transform .55s cubic-bezier(.22,1,.36,1), filter .45s ease";

                                    panel.style.opacity =
                                        "1";

                                    panel.style.transform =
                                        "translateX(0) scale(1)";

                                    panel.style.filter =
                                        "blur(0)";

                                }
                            );

                        }
                    );


                    setTimeout(
                        () => {

                            changingPage =
                                false;

                        },
                        550
                    );


                },
                220
            );

        }


        /* =================================================
           BUTTONS
        ================================================= */

        document
            .getElementById("btn-next")
            .addEventListener(
                "click",
                () => {

                    switchPage("next");

                }
            );


        document
            .getElementById("btn-prev")
            .addEventListener(
                "click",
                () => {

                    switchPage("prev");

                }
            );


        /* =================================================
           KEYBOARD
        ================================================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "ArrowRight" ||
                    event.key.toLowerCase() === "d"
                ) {

                    switchPage("next");

                    if (
                        window.startMusic
                    ) {
                        window.startMusic();
                    }

                }


                if (
                    event.key === "ArrowLeft" ||
                    event.key.toLowerCase() === "a"
                ) {

                    switchPage("prev");

                    if (
                        window.startMusic
                    ) {
                        window.startMusic();
                    }

                }

            }
        );


        /* =================================================
           TOUCH
        ================================================= */

        let touchStartX = 0;


        panel.addEventListener(
            "touchstart",
            event => {

                touchStartX =
                    event.changedTouches[0]
                        .screenX;

            },
            {
                passive: true
            }
        );


        panel.addEventListener(
            "touchend",
            event => {

                const endX =
                    event.changedTouches[0]
                        .screenX;

                const distance =
                    endX - touchStartX;


                if (
                    Math.abs(distance) < 50
                )
                    return;


                if (distance < 0) {

                    switchPage("next");

                } else {

                    switchPage("prev");

                }

            },
            {
                passive: true
            }
        );


        /* =================================================
           MOUSE LIGHT
        ================================================= */

        document.addEventListener(
            "mousemove",
            event => {

                const x =
                    (
                        event.clientX /
                        window.innerWidth
                    ) * 100;


                const y =
                    (
                        event.clientY /
                        window.innerHeight
                    ) * 100;


                panel.style.setProperty(
                    "--mouse-x",
                    `${x}%`
                );

                panel.style.setProperty(
                    "--mouse-y",
                    `${y}%`
                );


                lightWash.style.setProperty(
                    "--mouse-x",
                    `${x}%`
                );

                lightWash.style.setProperty(
                    "--mouse-y",
                    `${y}%`
                );

            }
        );


        /* =================================================
           BACKGROUND SLOW RANDOM MOVEMENT
        ================================================= */

        let bgX = 0;
        let bgY = 0;

        let targetBgX = 0;
        let targetBgY = 0;


        function chooseBackgroundTarget() {

            /*
             * 非常小的位移。
             *
             * 因為 background 本身已經
             * scale(1.14)，所以就算移動也不可能露出洞。
             */

            targetBgX =
                (Math.random() - 0.5)
                * 2.2;

            targetBgY =
                (Math.random() - 0.5)
                * 1.5;

        }


        function animateBackground() {

            bgX +=
                (targetBgX - bgX)
                * 0.0022;

            bgY +=
                (targetBgY - bgY)
                * 0.0022;


            background.style.transform =
                `
                    scale(1.14)
                    translate3d(
                        ${bgX}%,
                        ${bgY}%,
                        0
                    )
                `;


            requestAnimationFrame(
                animateBackground
            );

        }


        /*
         * 一開始不要停在 0
         */

        chooseBackgroundTarget();

        animateBackground();


        /*
         * 很久才改一次方向。
         *
         * 不會一直亂晃。
         */

        setInterval(
            chooseBackgroundTarget,
            9000 + Math.random() * 5000
        );


        /* =================================================
           VFX PARTICLES
        ================================================= */

        const canvas =
            document.getElementById(
                "vfx-canvas"
            );

        const ctx =
            canvas.getContext("2d");


        let particles = [];

        let width =
            window.innerWidth;

        let height =
            window.innerHeight;


        function resizeCanvas() {

            width =
                canvas.width =
                window.innerWidth;

            height =
                canvas.height =
                window.innerHeight;

        }


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        resizeCanvas();


        class Particle {

            constructor() {

                this.reset(true);

            }


            reset(initial = false) {

                this.x =
                    Math.random()
                    * width;

                this.y =
                    initial
                        ? Math.random() * height
                        : height + 20;

                this.radius =
                    Math.random()
                    * 1.35
                    + 0.35;

                this.speed =
                    Math.random()
                    * 0.18
                    + 0.05;

                this.drift =
                    (Math.random() - 0.5)
                    * 0.12;

                this.alpha =
                    Math.random()
                    * 0.35
                    + 0.08;

                this.phase =
                    Math.random()
                    * Math.PI
                    * 2;

            }


            update(time) {

                this.y -=
                    this.speed;

                this.x +=
                    this.drift
                    +
                    Math.sin(
                        time * 0.0004
                        + this.phase
                    )
                    * 0.015;


                if (
                    this.y < -20
                ) {

                    this.reset(false);

                }

            }


            draw() {

                ctx.beginPath();

                ctx.arc(
                    this.x,
                    this.y,
                    this.radius,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    `rgba(
                        255,
                        255,
                        255,
                        ${this.alpha}
                    )`;


                ctx.fill();

            }

        }


        for (
            let i = 0;
            i < 42;
            i++
        ) {

            particles.push(
                new Particle()
            );

        }


        function animateVfx(time) {

            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            particles.forEach(
                particle => {

                    particle.update(
                        time
                    );

                    particle.draw();

                }
            );


            requestAnimationFrame(
                animateVfx
            );

        }


        animateVfx(0);


        /* =================================================
           INITIAL PAGE
        ================================================= */

        renderPage(0);


    </script>


    <script src="music_module.js"></script>

</body>

</html>
