<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WND // ARCHIVE</title>
  <style>
    :root {
      --warm-white: rgba(255, 255, 255, 0.92);
      --glass-bg: rgba(25, 20, 30, 0.45);
      --glass-border: rgba(255, 255, 255, 0.2);
      --accent-warm: #ffd1a4;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: url('maxresdefault.jpg') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      color: var(--text-main);
      position: relative;
    }

    /* 溫和的夕陽暗化濾鏡 */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(15, 10, 20, 0.25);
      z-index: 0;
    }

    /* ==========================================
       1. 簡約優雅開機畫面 (Boot Screen)
       ========================================== */
    #boot-screen {
      position: fixed;
      inset: 0;
      background: rgba(15, 12, 20, 0.75);
      backdrop-filter: blur(20px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #boot-screen.fade-out {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .boot-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .boot-title {
      font-size: 36px;
      font-weight: 300;
      letter-spacing: 12px;
      color: var(--text-main);
      text-indent: 12px;
    }

    .boot-subtitle {
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--accent-warm);
      margin-bottom: 24px;
      opacity: 0.8;
    }

    .enter-btn {
      padding: 10px 32px;
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }

    #boot-screen:hover .enter-btn {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    /* ==========================================
       2. 主面板介面 (Main UI)
       ========================================== */
    .top-bar {
      width: 100%;
      height: 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-title {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 3px;
    }

    .main-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 10;
    }

    .glass-card {
      width: 860px;
      max-width: 92vw;
      height: 500px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(120%);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .tab-bar {
      display: flex;
      background: rgba(0, 0, 0, 0.15);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 16px;
    }

    .tab-item {
      padding: 16px 28px;
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      transition: all 0.25s ease;
    }

    .tab-item:hover { color: #ffffff; }

    .tab-item.active {
      color: #ffffff;
      font-weight: 600;
    }

    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 28px; right: 28px;
      height: 2px;
      background: var(--accent-warm);
      border-radius: 2px;
    }

    .content-body {
      flex: 1;
      position: relative;
      padding: 32px;
    }

    .page {
      position: absolute;
      inset: 32px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      display: flex;
      gap: 32px;
    }

    .page.active {
      opacity: 1;
      visibility: visible;
    }

    /* 左側個人簡介面板 */
    .user-profile-box {
      width: 200px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-box {
      width: 68px; height: 68px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex; justify-content: center; align-items: center;
      font-size: 18px; font-weight: 600;
      color: #ffffff;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.08);
    }

    .user-name {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .user-role {
      font-size: 11px;
      color: var(--accent-warm);
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .detail-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .placeholder-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 18px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    /* 簡約音樂按鈕 */
    .audio-btn {
      position: absolute;
      bottom: 20px;
      right: 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      padding: 8px 16px;
      font-size: 11px;
      letter-spacing: 2px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .audio-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    #yt-player-container {
      position: absolute;
      width: 0; height: 0;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="yt-player-container">
    <div id="yt-player"></div>
  </div>

  <!-- 1. 開機動畫 -->
  <div id="boot-screen" onclick="startSystem()">
    <div class="boot-content">
      <div class="boot-title">WND</div>
      <div class="boot-subtitle">PERSONAL ARCHIVE</div>
      <div class="enter-btn">CLICK TO ENTER</div>
    </div>
  </div>

  <!-- 2. 頂部列 -->
  <header class="top-bar">
    <div class="brand-title">WND ARCHIVE</div>
  </header>

  <!-- 3. 主內容卡片 -->
  <main class="main-viewport">
    <div class="glass-card">
      <nav class="tab-bar">
        <div class="tab-item active" onclick="switchTab(0)">PROFILE</div>
        <div class="tab-item" onclick="switchTab(1)">MESSAGES</div>
        <div class="tab-item" onclick="switchTab(2)">ARCHIVE</div>
      </nav>

      <div class="content-body">
        <!-- PAGE 1: Profile -->
        <div class="page active">
          <div class="user-profile-box">
            <div class="avatar-box">WND</div>
            <div class="user-name">WND</div>
            <div class="user-role">CREATOR</div>
          </div>
          <div class="detail-container">
            <div class="placeholder-box">
              <strong style="color: var(--accent-warm);">[ PROFILE ]</strong><br>
              請在此處填寫 WND 的個人介紹...
            </div>
            <div class="placeholder-box">
              <strong style="color: var(--accent-warm);">[ SKILLS ]</strong><br>
              預留技能與簡歷位置...
            </div>
          </div>
        </div>

        <!-- PAGE 2: Messages -->
        <div class="page">
          <div class="detail-container" style="width: 100%;">
            <div class="placeholder-box">
              <strong style="color: var(--accent-warm);">[ MESSAGES ]</strong><br>
              預留對話或留言區塊...
            </div>
          </div>
        </div>

        <!-- PAGE 3: Archive -->
        <div class="page">
          <div class="detail-container" style="width: 100%;">
            <div class="placeholder-box">
              <strong style="color: var(--accent-warm);">[ WORK ARCHIVE ]</strong><br>
              預留作品與專案紀錄位置...
            </div>
          </div>
        </div>
      </div>

      <button class="audio-btn" onclick="toggleBgm()">
        <span id="bgm-icon">♪</span> MUSIC
      </button>
    </div>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
