<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Sles // Archive</title>

    <link
        rel="icon"
        href="https://shared.fastly.steamstatic.com/community_assets/images/apps/1256670/6aae1f276e95e65de99d6ffea75f010167d5d0c6.jpg"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {

            --blue: #59c7f7;
            --blue-light: #bcecff;
            --blue-dark: #328dbb;

            --cyan: #7bddff;

            --white: rgba(255,255,255,0.92);
            --white-soft: rgba(255,255,255,0.72);

            --text: #324958;
            --text-light: #718998;

            --line: rgba(63,168,211,0.28);

            --shadow:
                0 25px 70px rgba(45,107,137,0.22);

            --mouse-x: 50%;
            --mouse-y: 50%;
        }


        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

        }

        body {

            overflow: hidden;

            font-family:
                "Barlow",
                "Noto Sans TC",
                sans-serif;

            color: var(--text);

            background: #dff5ff;

            user-select: none;

            -webkit-tap-highlight-color: transparent;

        }


        /* =========================================
           BACKGROUND
        ========================================= */

        .background {

            position: fixed;

            inset: 0;

            z-index: 0;

            background-image:
                linear-gradient(
                    180deg,
                    rgba(220,245,255,0.18),
                    rgba(215,242,255,0.35)
                ),
                url("maxresdefault.jpg");

            background-size: cover;

            background-position: center;

            transform: scale(1.035);

            animation:
                backgroundFloat 14s ease-in-out infinite alternate;

        }

        @keyframes backgroundFloat {

            from {
                transform: scale(1.035);
            }

            to {
                transform: scale(1.07);
            }

        }


        /* =========================================
           背景白霧
        ========================================= */

        .background::after {

            content: "";

            position: absolute;

            inset: 0;

            background:

                radial-gradient(
                    circle at 50% 50%,
                    rgba(255,255,255,0.04),
                    rgba(255,255,255,0.35)
                );

            pointer-events: none;

        }


        /* =========================================
           GRID
        ========================================= */

        .grid {

            position: absolute;

            inset: 0;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.18) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.18) 1px,
                    transparent 1px
                );

            background-size: 70px 70px;

            opacity: 0.20;

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent,
                    black 15%,
                    black 85%,
                    transparent
                );

            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    transparent,
                    black 15%,
                    black 85%,
                    transparent
                );

        }


        /* =========================================
           TOP HUD
        ========================================= */

        .top-ui {

            position: fixed;

            top: 24px;
            left: 30px;
            right: 30px;

            z-index: 20;

            display: flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            pointer-events: none;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 10px;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 2px;

            color:
                rgba(35,86,112,0.72);

        }


        .brand-mark {

            width: 10px;
            height: 10px;

            background: white;

            border:
                2px solid
                var(--blue);

            transform:
                rotate(45deg);

            box-shadow:
                0 0 12px
                rgba(89,199,247,0.8);

        }


        .top-right {

            display: flex;

            flex-direction: column;

            align-items: flex-end;

            gap: 4px;

            font-size: 10px;

            letter-spacing: 1.5px;

            color:
                rgba(39,96,124,0.55);

        }


        /* =========================================
           SIDE INFORMATION
        ========================================= */

        .side-info {

            position: fixed;

            z-index: 15;

            left: 30px;
            top: 50%;

            transform:
                translateY(-50%);

            display: flex;

            flex-direction: column;

            gap: 8px;

            pointer-events: none;

            opacity: 0.65;

        }


        .side-line {

            width: 1px;

            height: 90px;

            margin-left: 5px;

            background:
                linear-gradient(
                    to bottom,
                    transparent,
                    var(--blue),
                    transparent
                );

        }


        .side-text {

            writing-mode:
                vertical-rl;

            font-size: 9px;

            letter-spacing: 3px;

            color:
                #4c8da9;

        }


        /* =========================================
           MAIN
        ========================================= */

        .main {

            position: relative;

            width: 100%;
            height: 100%;

            z-index: 5;

            display: flex;

            justify-content: center;
            align-items: center;

            perspective: 1000px;

        }


        /* =========================================
           MAIN PANEL
        ========================================= */

        .panel {

            position: relative;

            width:
                min(620px, 88vw);

            min-height: 440px;

            padding:
                48px 52px;

            background:
                rgba(255,255,255,0.70);

            border:
                1px solid
                rgba(255,255,255,0.95);

            box-shadow:
                var(--shadow);

            backdrop-filter:
                blur(18px)
                saturate(120%);

            -webkit-backdrop-filter:
                blur(18px)
                saturate(120%);

            overflow: hidden;

            transform:
                rotateX(
                    calc(
                        (var(--mouse-y) - 50%)
                        * -0.008
                    )
                )
                rotateY(
                    calc(
                        (var(--mouse-x) - 50%)
                        * 0.008
                    )
                );

            transition:
                opacity 0.28s ease,
                transform 0.28s ease,
                filter 0.28s ease;

        }


        .panel::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    transparent 0%,
                    #69d5ff 25%,
                    white 50%,
                    #69d5ff 75%,
                    transparent
                );

        }


        .panel::after {

            content: "";

            position: absolute;

            width: 280px;
            height: 280px;

            right: -150px;
            bottom: -170px;

            border-radius: 50%;

            border:
                1px solid
                rgba(89,199,247,0.25);

            box-shadow:
                0 0 0 20px
                rgba(89,199,247,0.04),
                0 0 0 40px
                rgba(89,199,247,0.03);

            pointer-events: none;

        }


        /* =========================================
           CORNER HUD
        ========================================= */

        .corner {

            position: absolute;

            width: 23px;
            height: 23px;

            opacity: 0.7;

        }

        .corner::before,
        .corner::after {

            content: "";

            position: absolute;

            background:
                var(--blue);

        }


        .corner::before {

            width: 100%;
            height: 1px;

        }


        .corner::after {

            width: 1px;
            height: 100%;

        }


        .corner-tl {
            top: 18px;
            left: 18px;
        }

        .corner-tr {
            top: 18px;
            right: 18px;
            transform: rotate(90deg);
        }

        .corner-bl {
            bottom: 18px;
            left: 18px;
            transform: rotate(-90deg);
        }

        .corner-br {
            bottom: 18px;
            right: 18px;
            transform: rotate(180deg);
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            position: relative;

            z-index: 2;

            display: flex;

            align-items:
                center;

            gap: 13px;

        }


        .header-line {

            width: 42px;

            height: 2px;

            background:
                var(--blue);

            box-shadow:
                0 0 10px
                rgba(89,199,247,0.5);

        }


        .header-label {

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 2.5px;

            color:
                var(--blue-dark);

        }


        /* =========================================
           TITLE
        ========================================= */

        .title {

            position: relative;

            z-index: 2;

            margin-top: 18px;

            font-size:
                clamp(52px, 9vw, 72px);

            line-height: 0.95;

            font-weight: 800;

            letter-spacing: -2px;

            color:
                #ffffff;

            text-shadow:
                0 2px 12px
                rgba(61,119,146,0.28);

        }


        .subtitle {

            position: relative;

            z-index: 2;

            margin-top: 10px;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 2px;

            color:
                #5d7888;

        }


        /* =========================================
           DATA
        ========================================= */

        .data-grid {

            position: relative;

            z-index: 2;

            margin-top: 38px;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0,1fr));

            gap: 12px;

        }


        .data-card {

            position: relative;

            min-height: 78px;

            padding: 15px 16px;

            background:
                rgba(255,255,255,0.66);

            border:
                1px solid
                rgba(255,255,255,0.9);

            transition:
                transform 0.22s ease,
                background 0.22s ease,
                border-color 0.22s ease;

        }


        .data-card::before {

            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 3px;
            height: 100%;

            background:
                var(--blue);

            transform:
                scaleY(0);

            transition:
                transform 0.22s ease;

        }


        .data-card:hover {

            transform:
                translateY(-3px);

            background:
                rgba(255,255,255,0.88);

            border-color:
                rgba(89,199,247,0.35);

        }


        .data-card:hover::before {

            transform:
                scaleY(1);

        }


        .data-label {

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1.5px;

            color:
                #7993a2;

            margin-bottom: 6px;

        }


        .data-value {

            font-size: 14px;

            font-weight: 600;

            line-height: 1.35;

            color:
                #3b5666;

        }


        /* =========================================
           PAGE
        ========================================= */

        .page {

            position: absolute;

            right: 28px;
            bottom: 20px;

            z-index: 4;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 2px;

            color:
                #7191a2;

        }


        /* =========================================
           NAVIGATION
        ========================================= */

        .nav {

            position: fixed;

            top: 50%;

            z-index: 30;

            transform:
                translateY(-50%);

            width: 54px;
            height: 54px;

            border:
                1px solid
                rgba(255,255,255,0.9);

            background:
                rgba(255,255,255,0.65);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            box-shadow:
                0 10px 30px
                rgba(60,125,155,0.12);

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;

        }


        .nav:hover {

            background:
                rgba(255,255,255,0.92);

            box-shadow:
                0 12px 30px
                rgba(60,125,155,0.22);

        }


        .nav:active {

            transform:
                translateY(-50%)
                scale(0.9);

        }


        .nav-left {
            left: 26px;
        }

        .nav-right {
            right: 26px;
        }


        .arrow {

            width: 10px;
            height: 10px;

            border-top:
                2px solid
                var(--blue-dark);

            border-right:
                2px solid
                var(--blue-dark);

        }


        .arrow-left {

            transform:
                rotate(-135deg);

            margin-left: 5px;

        }


        .arrow-right {

            transform:
                rotate(45deg);

            margin-right: 5px;

        }


        /* =========================================
           MUSIC
        ========================================= */

        .music {

            position: fixed;

            z-index: 40;

            right: 28px;
            bottom: 25px;

            display: flex;

            align-items: center;

            gap: 9px;

        }


        .music-label {

            padding:
                7px 12px;

            background:
                rgba(255,255,255,0.68);

            border:
                1px solid
                rgba(255,255,255,0.9);

            backdrop-filter:
                blur(10px);

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1px;

            color:
                #5f7e8f;

            opacity: 0;

            transform:
                translateX(10px);

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;

            pointer-events: none;

        }


        .music:hover .music-label {

            opacity: 1;

            transform:
                translateX(0);

        }


        .music-button {

            width: 48px;
            height: 48px;

            border:
                1px solid
                rgba(255,255,255,0.95);

            background:
                rgba(255,255,255,0.78);

            color:
                var(--blue-dark);

            box-shadow:
                0 10px 30px
                rgba(60,125,155,0.17);

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;

        }


        .music-button:hover {

            transform:
                translateY(-3px);

            background:
                white;

        }


        .music-button.playing {

            color:
                #ffffff;

            background:
                var(--blue);

            box-shadow:
                0 0 0 5px
                rgba(89,199,247,0.13),
                0 10px 30px
                rgba(60,125,155,0.20);

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .top-ui {

                top: 18px;

                left: 16px;
                right: 16px;

            }


            .side-info {

                display: none;

            }


            .panel {

                width: 90vw;

                min-height: 430px;

                padding:
                    38px 24px 46px;

            }


            .title {

                font-size: 48px;

            }


            .data-grid {

                grid-template-columns:
                    1fr;

                margin-top: 28px;

            }


            .nav {

                width: 42px;
                height: 42px;

            }


            .nav-left {

                left: 9px;

            }


            .nav-right {

                right: 9px;

            }


            .music {

                right: 15px;
                bottom: 15px;

            }


            .music-label {

                display: none;

            }

        }

    </style>

</head>


<body>


    <!-- Background -->

    <div class="background">

        <div class="grid"></div>

    </div>


    <!-- Top UI -->

    <header class="top-ui">

        <div class="brand">

            <span class="brand-mark"></span>

            <span>SLES ARCHIVE</span>

        </div>

        <div class="top-right">

            <span>PERSONAL DATABASE</span>

            <span>ARCHIVE // 01</span>

        </div>

    </header>


    <!-- Side -->

    <aside class="side-info">

        <div class="side-line"></div>

        <div class="side-text">
            BLUE ARCHIVE
        </div>

        <div class="side-line"></div>

    </aside>


    <!-- Navigation -->

    <button
        class="nav nav-left"
        id="btn-prev"
        aria-label="Previous"
    >

        <span class="arrow arrow-left"></span>

    </button>


    <button
        class="nav nav-right"
        id="btn-next"
        aria-label="Next"
    >

        <span class="arrow arrow-right"></span>

    </button>


    <!-- Main -->

    <main class="main">

        <section class="panel" id="panel">

            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>


            <div class="header">

                <span class="header-line"></span>

                <span
                    class="header-label"
                    id="header-label"
                >
                    RECORD OF LIBRARIAN
                </span>

            </div>


            <div
                class="title"
                id="title"
            >
                Sles
            </div>


            <div
                class="subtitle"
                id="subtitle"
            >
                PERSONAL ARCHIVE
            </div>


            <div
                class="data-grid"
                id="data-grid"
            ></div>


            <div
                class="page"
                id="page"
            >
                01 / 03
            </div>

        </section>

    </main>


    <!-- Music -->

    <div class="music">

        <div
            class="music-label"
            id="music-label"
        >
            MUSIC OFF
        </div>

        <button
            class="music-button"
            id="music-button"
            aria-label="Toggle Music"
        >
            ♫
        </button>

    </div>


    <!-- Hidden YouTube -->

    <div
        id="youtube-player"
        style="
            position:fixed;
            width:1px;
            height:1px;
            left:-9999px;
            top:-9999px;
            pointer-events:none;
        "
    ></div>


    <script>

        /* =========================================
           PAGE DATA
        ========================================= */

        const pages = [

            {

                label:
                    "RECORD OF LIBRARIAN",

                title:
                    "Sles",

                subtitle:
                    "PERSONAL ARCHIVE",

                rows: [

                    {
                        label:
                            "IDENTITY",

                        value:
                            "Human / Developer"
                    },

                    {
                        label:
                            "LIKES",

                        value:
                            "Develop / Novel"
                    },

                    {
                        label:
                            "BIRTHDAY",

                        value:
                            "09 / 21"
                    },

                    {
                        label:
                            "STATUS",

                        value:
                            "Active"
                    }

                ]

            },


            {

                label:
                    "ARCHIVE DATABASE",

                title:
                    "Favorites",

                subtitle:
                    "PREFERENCES / ARCHIVE",

                rows: [

                    {
                        label:
                            "GAME",

                        value:
                            "Project Moon"
                    },

                    {
                        label:
                            "MUSIC",

                        value:
                            "Mili / Gone Angels"
                    },

                    {
                        label:
                            "UNIVERSE",

                        value:
                            "Library of Ruina"
                    },

                    {
                        label:
                            "INTEREST",

                        value:
                            "Games / Novels / Art"
                    }

                ]

            },


            {

                label:
                    "CREATIVE WORKS",

                title:
                    "Works",

                subtitle:
                    "CREATIVE / DEVELOPMENT",

                rows: [

                    {
                        label:
                            "ENGINE",

                        value:
                            "Roblox Luau"
                    },

                    {
                        label:
                            "WEB",

                        value:
                            "Front-end Development"
                    },

                    {
                        label:
                            "FOCUS",

                        value:
                            "Game / Story / Art / Music"
                    },

                    {
                        label:
                            "STATUS",

                        value:
                            "Active Development"
                    }

                ]

            }

        ];


        /* =========================================
           DOM
        ========================================= */

        const panel =
            document.getElementById(
                "panel"
            );

        const headerLabel =
            document.getElementById(
                "header-label"
            );

        const title =
            document.getElementById(
                "title"
            );

        const subtitle =
            document.getElementById(
                "subtitle"
            );

        const dataGrid =
            document.getElementById(
                "data-grid"
            );

        const page =
            document.getElementById(
                "page"
            );

        const btnPrev =
            document.getElementById(
                "btn-prev"
            );

        const btnNext =
            document.getElementById(
                "btn-next"
            );


        let currentPage = 0;

        let changingPage = false;


        /* =========================================
           RENDER
        ========================================= */

        function renderPage(index) {

            const data =
                pages[index];

            headerLabel.textContent =
                data.label;

            title.textContent =
                data.title;

            subtitle.textContent =
                data.subtitle;

            dataGrid.innerHTML = "";


            data.rows.forEach(
                row => {

                    const element =
                        document.createElement(
                            "div"
                        );

                    element.className =
                        "data-card";

                    element.innerHTML = `

                        <div class="data-label">
                            ${row.label}
                        </div>

                        <div class="data-value">
                            ${row.value}
                        </div>

                    `;

                    dataGrid.appendChild(
                        element
                    );

                }
            );


            page.textContent =
                `${String(index + 1).padStart(2,"0")} / ${String(pages.length).padStart(2,"0")}`;

        }


        /* =========================================
           PAGE SWITCH
        ========================================= */

        function switchPage(direction) {

            if (changingPage)
                return;

            changingPage = true;


            const className =
                direction === "next"
                    ? "page-next"
                    : "page-prev";


            panel.style.opacity = "0";

            panel.style.transform =
                direction === "next"
                    ? "translateX(-25px)"
                    : "translateX(25px)";


            setTimeout(
                () => {

                    if (direction === "next") {

                        currentPage =
                            (currentPage + 1)
                            % pages.length;

                    } else {

                        currentPage =
                            (currentPage - 1 + pages.length)
                            % pages.length;

                    }


                    renderPage(
                        currentPage
                    );


                    panel.style.transform =
                        direction === "next"
                            ? "translateX(25px)"
                            : "translateX(-25px)";


                    requestAnimationFrame(
                        () => {

                            panel.style.opacity =
                                "1";

                            panel.style.transform =
                                "translateX(0)";

                        }
                    );


                    setTimeout(
                        () => {
                            changingPage =
                                false;
                        },
                        300
                    );

                },
                240
            );

        }


        /* =========================================
           BUTTONS
        ========================================= */

        btnNext.addEventListener(
            "click",
            () => {

                switchPage("next");

                startMusic();

            }
        );


        btnPrev.addEventListener(
            "click",
            () => {

                switchPage("prev");

                startMusic();

            }
        );


        /* =========================================
           KEYBOARD
        ========================================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "ArrowRight" ||
                    event.key.toLowerCase()
                    === "d"
                ) {

                    switchPage("next");

                    startMusic();

                }


                if (
                    event.key ===
                    "ArrowLeft" ||
                    event.key.toLowerCase()
                    === "a"
                ) {

                    switchPage("prev");

                    startMusic();

                }

            }
        );


        /* =========================================
           TOUCH SWIPE
        ========================================= */

        let touchStartX = 0;


        panel.addEventListener(
            "touchstart",
            event => {

                touchStartX =
                    event.changedTouches[0]
                        .screenX;

            },
            {
                passive: true
            }
        );


        panel.addEventListener(
            "touchend",
            event => {

                const endX =
                    event.changedTouches[0]
                        .screenX;

                const distance =
                    endX - touchStartX;


                if (
                    Math.abs(distance) < 50
                )
                    return;


                startMusic();


                if (distance < 0) {

                    switchPage("next");

                } else {

                    switchPage("prev");

                }

            },
            {
                passive: true
            }
        );


        /* =========================================
           MOUSE PARALLAX
        ========================================= */

        document.addEventListener(
            "mousemove",
            event => {

                const x =
                    event.clientX /
                    window.innerWidth *
                    100;

                const y =
                    event.clientY /
                    window.innerHeight *
                    100;


                panel.style.setProperty(
                    "--mouse-x",
                    `${x}%`
                );

                panel.style.setProperty(
                    "--mouse-y",
                    `${y}%`
                );

            }
        );


        /* =========================================
           INITIAL
        ========================================= */

        renderPage(0);

    </script>


    <script src="music_module.js"></script>

</body>
</html>
