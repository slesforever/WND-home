<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCHALE // ARCHIVE SYSTEM</title>
  <style>
    :root {
      --ba-blue: #00a3ff;
      --ba-navy: #12213f;
      --ba-light-bg: rgba(240, 246, 255, 0.82);
      --ba-glass-border: rgba(255, 255, 255, 0.8);
      --text-dark: #1e293b;
      --text-sub: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: url('maxresdefault.jpg') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      color: var(--text-dark);
      position: relative;
    }

    /* 蔚藍檔案風格：清透明亮的薄霧覆蓋 */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(235, 243, 255, 0.25);
      backdrop-filter: blur(4px);
      z-index: 0;
    }

    /* ==========================================
       1. 蔚藍檔案風格開機動畫 (Boot Screen)
       ========================================== */
    #boot-screen {
      position: fixed;
      inset: 0;
      background: rgba(245, 249, 255, 0.88);
      backdrop-filter: blur(25px) saturate(130%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #boot-screen.fade-out {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    /* BA 標誌性光環與極簡中心 */
    .ba-halo-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .ba-halo {
      position: absolute;
      width: 90px;
      height: 90px;
      border: 2px solid var(--ba-blue);
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0, 163, 255, 0.3);
      animation: haloPulse 3s ease-in-out infinite alternate;
    }

    .ba-halo-inner {
      position: absolute;
      width: 45px;
      height: 45px;
      border: 1px dashed var(--ba-blue);
      border-radius: 50%;
      animation: spin 12s linear infinite;
    }

    .ba-cross {
      position: absolute;
      width: 14px;
      height: 14px;
      background: var(--ba-blue);
      clip-path: polygon(35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0% 65%, 0% 35%, 35% 35%);
    }

    @keyframes haloPulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      100% { transform: scale(1.05); opacity: 1; }
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .boot-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 6px;
      color: var(--ba-navy);
      margin-bottom: 6px;
    }

    .boot-subtitle {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--ba-blue);
      margin-bottom: 32px;
    }

    .connect-btn {
      padding: 12px 48px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #ffffff;
      background: var(--ba-blue);
      border: none;
      border-radius: 30px;
      box-shadow: 0 8px 20px rgba(0, 163, 255, 0.35);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .connect-btn:hover {
      background: #008ee6;
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(0, 163, 255, 0.45);
    }

    /* ==========================================
       2. 主 UI 介面 (BA 白藍透光風格)
       ========================================== */
    .top-bar {
      width: 100%;
      height: 50px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px;
      z-index: 10;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--ba-navy);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title::before {
      content: '';
      width: 8px; height: 8px;
      background: var(--ba-blue);
      border-radius: 50%;
    }

    .main-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 10;
    }

    .glass-card {
      width: 880px;
      max-width: 92vw;
      height: 520px;
      background: var(--ba-light-bg);
      backdrop-filter: blur(20px) saturate(120%);
      border: 1px solid var(--ba-glass-border);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(18, 33, 63, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .tab-bar {
      display: flex;
      background: rgba(255, 255, 255, 0.5);
      border-bottom: 1px solid rgba(220, 230, 245, 0.8);
      padding: 0 20px;
    }

    .tab-item {
      padding: 16px 28px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-sub);
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .tab-item:hover { color: var(--ba-navy); }

    .tab-item.active {
      color: var(--ba-blue);
    }

    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 20px; right: 20px;
      height: 3px;
      background: var(--ba-blue);
      border-radius: 3px 3px 0 0;
    }

    .content-body {
      flex: 1;
      position: relative;
      padding: 32px;
    }

    .page {
      position: absolute;
      inset: 32px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      display: flex;
      gap: 28px;
    }

    .page.active {
      opacity: 1;
      visibility: visible;
    }

    /* 左側角色卡 */
    .user-profile-box {
      width: 210px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid #ffffff;
      border-radius: 14px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .avatar-box {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: #eaf4ff;
      border: 2px solid var(--ba-blue);
      display: flex; justify-content: center; align-items: center;
      font-size: 18px; font-weight: 800;
      color: var(--ba-blue);
      margin-bottom: 14px;
    }

    .user-name {
      font-size: 18px;
      font-weight: 800;
      color: var(--ba-navy);
      letter-spacing: 1px;
    }

    .user-role {
      font-size: 11px;
      font-weight: 700;
      color: var(--ba-blue);
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .detail-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .placeholder-box {
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(220, 230, 245, 0.9);
      border-radius: 12px;
      padding: 20px;
      color: var(--text-dark);
      font-size: 13px;
      line-height: 1.6;
    }

    /* 音樂按鈕 */
    .audio-btn {
      position: absolute;
      bottom: 20px;
      right: 24px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--ba-blue);
      color: var(--ba-blue);
      padding: 8px 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 163, 255, 0.15);
    }

    .audio-btn:hover {
      background: var(--ba-blue);
      color: #ffffff;
    }

    #yt-player-container {
      position: absolute;
      width: 0; height: 0;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="yt-player-container">
    <div id="yt-player"></div>
  </div>

  <!-- 1. 蔚藍檔案風格開機畫面 -->
  <div id="boot-screen">
    <div class="ba-halo-container">
      <div class="ba-halo"></div>
      <div class="ba-halo-inner"></div>
      <div class="ba-cross"></div>
    </div>
    <div class="boot-title">SCHALE ARCHIVE</div>
    <div class="boot-subtitle">SYSTEM READY TO CONNECT</div>
    <button class="connect-btn" onclick="startSystem()">TOUCH TO START</button>
  </div>

  <!-- 2. 頂部列 -->
  <header class="top-bar">
    <div class="brand-title">SCHALE OS // WND</div>
  </header>

  <!-- 3. 主面板 -->
  <main class="main-viewport">
    <div class="glass-card">
      <nav class="tab-bar">
        <div class="tab-item active" onclick="switchTab(0)">PROFILE</div>
        <div class="tab-item" onclick="switchTab(1)">MESSAGES</div>
        <div class="tab-item" onclick="switchTab(2)">ARCHIVE</div>
      </nav>

      <div class="content-body">
        <!-- PAGE 1: Profile -->
        <div class="page active">
          <div class="user-profile-box">
            <div class="avatar-box">WND</div>
            <div class="user-name">WND</div>
            <div class="user-role">STUDENT</div>
          </div>
          <div class="detail-container">
            <div class="placeholder-box">
              <strong style="color: var(--ba-blue);">[ 個人檔案 / PROFILE ]</strong><br>
              在此填寫 WND 的個人簡介...
            </div>
            <div class="placeholder-box">
              <strong style="color: var(--ba-blue);">[ 專長領域 / SKILLS ]</strong><br>
              預留技能與專案簡歷位置...
            </div>
          </div>
        </div>

        <!-- PAGE 2: Messages -->
        <div class="page">
          <div class="detail-container" style="width: 100%;">
            <div class="placeholder-box">
              <strong style="color: var(--ba-blue);">[ 訊息紀錄 / MESSAGES ]</strong><br>
              預留對話紀錄區塊...
            </div>
          </div>
        </div>

        <!-- PAGE 3: Archive -->
        <div class="page">
          <div class="detail-container" style="width: 100%;">
            <div class="placeholder-box">
              <strong style="color: var(--ba-blue);">[ 作品歸檔 / WORK ARCHIVE ]</strong><br>
              預留作品與檔案紀錄位置...
            </div>
          </div>
        </div>
      </div>

      <button class="audio-btn" onclick="toggleBgm()">
        <span id="bgm-icon">♪</span> BGM CONTROL
      </button>
    </div>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="music_module.js"></script>
</body>
</html>
