<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#bcecff">

    <title>WND</title>

    <link
        rel="icon"
        href="https://shared.fastly.steamstatic.com/community_assets/images/apps/1256670/6aae1f276e95e65de99d6ffea75f010167d5d0c6.jpg"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================================================
           ROOT
        ========================================================= */

        :root {

            --blue: #64d3fa;
            --blue-bright: #bff2ff;
            --blue-dark: #3d8eaa;

            --text: #435f6f;
            --muted: #8099a7;

            --mouse-x: 50%;
            --mouse-y: 50%;

            --bg-x: 0px;
            --bg-y: 0px;

        }


        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

        }


        body {

            overflow: hidden;

            position: relative;

            background: #bcecff;

            color: var(--text);

            font-family:
                "Barlow",
                "Noto Sans TC",
                sans-serif;

            user-select: none;

            -webkit-tap-highlight-color: transparent;

        }


        button,
        input {

            font-family: inherit;

        }


        /* =========================================================
           BACKGROUND IMAGE
        ========================================================= */

        .background {

            position: fixed;

            inset: -15%;

            z-index: 0;

            background-image:
                linear-gradient(
                    rgba(218,247,255,0.02),
                    rgba(186,230,247,0.10)
                ),
                url("maxresdefault.jpg");

            background-size: cover;

            background-position: center center;

            transform:
                translate3d(
                    var(--bg-x),
                    var(--bg-y),
                    0
                )
                scale(1.17);

            will-change: transform;

        }


        /* =========================================================
           BACKGROUND LIGHT
        ========================================================= */

        .background-light {

            position: fixed;

            inset: 0;

            z-index: 1;

            pointer-events: none;

            background:

                radial-gradient(
                    circle 430px at var(--mouse-x) var(--mouse-y),
                    rgba(255,255,255,0.18),
                    transparent 72%
                );

        }


        /* =========================================================
           SOFT WHITE OVERLAY
        ========================================================= */

        .background-soft {

            position: fixed;

            inset: 0;

            z-index: 2;

            pointer-events: none;

            background:

                linear-gradient(
                    180deg,
                    rgba(239,251,255,0.06),
                    rgba(194,234,249,0.08)
                );

        }


        /* =========================================================
           VIGNETTE
        ========================================================= */

        .vignette {

            position: fixed;

            inset: 0;

            z-index: 3;

            pointer-events: none;

            background:

                radial-gradient(
                    ellipse at center,
                    transparent 15%,
                    rgba(45,97,119,0.12) 100%
                );

        }


        /* =========================================================
           GRID
        ========================================================= */

        .grid {

            position: fixed;

            inset: 0;

            z-index: 4;

            pointer-events: none;

            opacity: 0.055;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.55) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.55) 1px,
                    transparent 1px
                );

            background-size: 70px 70px;

            mask-image:
                radial-gradient(
                    ellipse at center,
                    #000,
                    transparent 85%
                );

            -webkit-mask-image:
                radial-gradient(
                    ellipse at center,
                    #000,
                    transparent 85%
                );

        }


        /* =========================================================
           PARTICLES
        ========================================================= */

        #particles-back,
        #particles-front {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

        }


        #particles-back {

            z-index: 5;

        }


        #particles-front {

            z-index: 60;

        }


        /* =========================================================
           TOP HUD
        ========================================================= */

        .top-ui {

            position: fixed;

            top: 22px;
            left: 28px;
            right: 28px;

            z-index: 25;

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            pointer-events: none;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 10px;

            color: rgba(44,91,110,0.72);

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 3px;

        }


        .brand-dot {

            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: white;

            border: 2px solid var(--blue);

            box-shadow:
                0 0 13px
                rgba(100,211,250,0.9);

            animation:
                brandPulse
                2.6s
                ease-in-out
                infinite;

        }


        @keyframes brandPulse {

            0%,
            100% {
                transform: scale(.82);
                opacity: .68;
            }

            50% {
                transform: scale(1.16);
                opacity: 1;
            }

        }


        .top-info {

            display: flex;

            flex-direction: column;

            align-items: flex-end;

            gap: 4px;

            color: rgba(48,96,113,0.50);

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 2px;

        }


        /* =========================================================
           SIDE HUD
        ========================================================= */

        .side-hud {

            position: fixed;

            left: 27px;

            top: 50%;

            transform:
                translateY(-50%);

            z-index: 20;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 10px;

            opacity: .42;

            pointer-events: none;

        }


        .side-line {

            width: 1px;
            height: 65px;

            background:
                linear-gradient(
                    to bottom,
                    transparent,
                    var(--blue),
                    transparent
                );

        }


        .side-text {

            writing-mode: vertical-rl;

            color: #548ca4;

            font-size: 8px;

            letter-spacing: 3px;

        }


        /* =========================================================
           MAIN
        ========================================================= */

        .main {

            position: relative;

            z-index: 10;

            width: 100%;
            height: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 70px 24px;

        }


        /* =========================================================
           PROFILE
        ========================================================= */

        .profile {

            position: relative;

            width: min(700px, 88vw);

            min-height: 455px;

            padding: 41px 45px 47px;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.84),
                    rgba(247,253,255,.62)
                );

            border:
                1px solid
                rgba(255,255,255,.96);

            box-shadow:

                0 30px 90px
                rgba(46,110,140,.24),

                0 5px 20px
                rgba(46,110,140,.11);

            backdrop-filter:
                blur(19px)
                saturate(125%);

            -webkit-backdrop-filter:
                blur(19px)
                saturate(125%);

            opacity: 0;

            transform:
                translateY(18px)
                scale(.975);

            transition:
                opacity .85s
                cubic-bezier(.22,1,.36,1),
                transform .85s
                cubic-bezier(.22,1,.36,1);

        }


        body.entered .profile {

            opacity: 1;

            transform:
                translateY(0)
                scale(1);

        }


        /* =========================================================
           PROFILE LIGHT
        ========================================================= */

        .profile-light {

            position: absolute;

            inset: 0;

            z-index: 1;

            pointer-events: none;

            background:

                radial-gradient(
                    circle 350px at
                    var(--mouse-x)
                    var(--mouse-y),
                    rgba(255,255,255,.20),
                    transparent 72%
                );

        }


        /* =========================================================
           TOP SHINE
        ========================================================= */

        .profile::before {

            content: "";

            position: absolute;

            left: -10%;

            top: 0;

            width: 120%;

            height: 3px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    #8be3ff 20%,
                    white 50%,
                    #8be3ff 80%,
                    transparent
                );

            opacity: .65;

            animation:
                panelShine
                4.5s
                ease-in-out
                infinite;

            pointer-events: none;

        }


        @keyframes panelShine {

            0%,
            100% {
                transform: translateX(-10%);
                opacity: .45;
            }

            50% {
                transform: translateX(10%);
                opacity: 1;
            }

        }


        /* =========================================================
           CORNERS
        ========================================================= */

        .corner {

            position: absolute;

            width: 24px;
            height: 24px;

            z-index: 15;

            opacity: .62;

            pointer-events: none;

        }


        .corner::before,
        .corner::after {

            content: "";

            position: absolute;

            background: var(--blue);

        }


        .corner::before {

            width: 100%;
            height: 1px;

        }


        .corner::after {

            width: 1px;
            height: 100%;

        }


        .corner-tl {
            top: 16px;
            left: 16px;
        }


        .corner-tr {

            top: 16px;
            right: 16px;

            transform: rotate(90deg);

        }


        .corner-bl {

            bottom: 16px;
            left: 16px;

            transform: rotate(-90deg);

        }


        .corner-br {

            bottom: 16px;
            right: 16px;

            transform: rotate(180deg);

        }


        /* =========================================================
           CONTENT
        ========================================================= */

        .page-content {

            position: relative;

            z-index: 5;

        }


        /* =========================================================
           HEADER
        ========================================================= */

        .section-header {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .section-dot {

            width: 7px;
            height: 7px;

            flex-shrink: 0;

            border-radius: 50%;

            background: var(--blue);

            box-shadow:
                0 0 12px
                rgba(100,211,250,.82);

            animation:
                sectionDot
                2.4s
                ease-in-out
                infinite;

        }


        @keyframes sectionDot {

            0%,
            100% {
                opacity: .52;
            }

            50% {
                opacity: 1;
            }

        }


        .section-line {

            width: 35px;
            height: 1px;

            background: var(--blue);

        }


        .section-label {

            color: var(--blue-dark);

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 2.5px;

        }


        /* =========================================================
           TITLE
        ========================================================= */

        .title-row {

            display: flex;

            justify-content: space-between;

            align-items: flex-end;

            margin-top: 16px;

        }


        .title {

            color: #fff;

            font-size:
                clamp(
                    53px,
                    9vw,
                    77px
                );

            line-height: .88;

            font-weight: 800;

            letter-spacing: -3px;

            text-shadow:
                0 4px 18px
                rgba(48,113,142,.30);

        }


        .page-tag {

            margin-bottom: 5px;

            padding:
                7px 11px;

            color: #74919f;

            background:
                rgba(255,255,255,.44);

            border:
                1px solid
                rgba(99,210,250,.29);

            font-size: 8px;

            font-weight: 800;

            letter-spacing: 1.5px;

        }


        /* =========================================================
           PERSONAL PAGE
        ========================================================= */

        .personal-layout {

            margin-top: 30px;

        }


        .personal-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;

        }


        .personal-item {

            position: relative;

            min-height: 73px;

            padding: 13px 15px;

            background:
                rgba(255,255,255,.55);

            border:
                1px solid
                rgba(255,255,255,.92);

            transition:
                transform .2s ease,
                background .2s ease,
                border-color .2s ease;

        }


        .personal-item:hover {

            transform:
                translateY(-3px);

            background:
                rgba(255,255,255,.78);

            border-color:
                rgba(99,210,250,.35);

        }


        .personal-item::before {

            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 3px;
            height: 100%;

            background:
                var(--blue);

            transform:
                scaleY(.20);

            transition:
                transform .2s ease;

        }


        .personal-item:hover::before {

            transform:
                scaleY(1);

        }


        .item-label {

            margin-bottom: 6px;

            color: #819ba8;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 1.5px;

        }


        .item-value {

            color: #425d6c;

            font-size: 14px;

            font-weight: 600;

        }


        .description {

            min-height: 88px;

            margin-top: 10px;

            padding: 14px 16px;

            background:
                rgba(255,255,255,.47);

            border:
                1px solid
                rgba(255,255,255,.90);

        }


        /* =========================================================
           FAVORITES PAGE
        ========================================================= */

        .favorites-layout {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0,1fr));

            gap: 10px;

            margin-top: 29px;

        }


        .favorite {

            min-height: 108px;

            padding: 16px;

            background:
                rgba(255,255,255,.55);

            border:
                1px solid
                rgba(255,255,255,.92);

            transition:
                transform .2s ease,
                background .2s ease;

        }


        .favorite:hover {

            transform:
                translateY(-3px);

            background:
                rgba(255,255,255,.80);

        }


        .favorite.wide {

            grid-column:
                1 / -1;

            min-height: 73px;

        }


        .favorite-symbol {

            width: 28px;
            height: 28px;

            display: flex;

            justify-content: center;
            align-items: center;

            margin-bottom: 10px;

            color: var(--blue-dark);

            background:
                rgba(255,255,255,.45);

            border:
                1px solid
                rgba(99,210,250,.30);

            font-size: 12px;

        }


        .favorite.wide
        .favorite-symbol {

            float: left;

            margin-right: 12px;

            margin-bottom: 0;

        }


        .favorite-label {

            color: #819aa8;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 1.5px;

        }


        .favorite-value {

            margin-top: 6px;

            color: #425d6c;

            font-size: 14px;

            font-weight: 700;

        }


        .favorite-sub {

            margin-top: 4px;

            color: #8ba0ac;

            font-size: 9px;

        }


        /* =========================================================
           WORKS PAGE
        ========================================================= */

        .works-layout {

            display: flex;

            flex-direction: column;

            gap: 8px;

            margin-top: 29px;

        }


        .work {

            display: grid;

            grid-template-columns:
                38px minmax(0,1fr) auto;

            align-items: center;

            min-height: 63px;

            padding:
                9px 13px;

            background:
                rgba(255,255,255,.54);

            border:
                1px solid
                rgba(255,255,255,.91);

            transition:
                transform .2s ease,
                background .2s ease;

        }


        .work:hover {

            transform:
                translateX(5px);

            background:
                rgba(255,255,255,.80);

        }


        .work-index {

            color: var(--blue-dark);

            font-size: 9px;

            font-weight: 800;

        }


        .work-name {

            color: #435e6d;

            font-size: 13px;

            font-weight: 700;

        }


        .work-description {

            margin-top: 3px;

            color: #8ba1ad;

            font-size: 9px;

        }


        .work-state {

            padding:
                5px 8px;

            color: #6194a8;

            background:
                rgba(99,210,250,.10);

            border:
                1px solid
                rgba(99,210,250,.22);

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 1px;

        }


        /* =========================================================
           PAGE NUMBER
        ========================================================= */

        .page-number {

            position: absolute;

            right: 28px;
            bottom: 19px;

            z-index: 15;

            color: #7895a4;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 2px;

        }


        /* =========================================================
           PAGE SCAN
        ========================================================= */

        .page-scan {

            position: absolute;

            top: 0;
            left: -5%;

            width: 2px;
            height: 100%;

            z-index: 20;

            opacity: 0;

            background:

                linear-gradient(
                    to bottom,
                    transparent,
                    rgba(106,220,255,.95),
                    transparent
                );

            pointer-events: none;

        }


        .page-scan.active {

            animation:
                pageScan
                .58s
                ease-out
                forwards;

        }


        @keyframes pageScan {

            0% {
                left: -5%;
                opacity: 0;
            }

            15% {
                opacity: .9;
            }

            100% {
                left: 105%;
                opacity: 0;
            }

        }


        /* =========================================================
           NAV
        ========================================================= */

        .nav {

            position: fixed;

            top: 50%;

            z-index: 70;

            width: 53px;
            height: 53px;

            transform:
                translateY(-50%);

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid
                rgba(255,255,255,.95);

            background:
                rgba(255,255,255,.64);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            box-shadow:
                0 12px 32px
                rgba(50,114,143,.18);

            color: var(--blue-dark);

            cursor: pointer;

            opacity: 0;

            transition:
                opacity .8s ease,
                transform .2s ease,
                background .2s ease;

        }


        body.entered .nav {

            opacity: 1;

        }


        .nav:hover {

            background:
                rgba(255,255,255,.94);

        }


        .nav:active {

            transform:
                translateY(-50%)
                scale(.88);

        }


        .nav-left {
            left: 24px;
        }


        .nav-right {
            right: 24px;
        }


        .arrow {

            width: 10px;
            height: 10px;

            border-top:
                2px solid
                currentColor;

            border-right:
                2px solid
                currentColor;

        }


        .arrow-left {

            transform:
                rotate(-135deg);

            margin-left: 4px;

        }


        .arrow-right {

            transform:
                rotate(45deg);

            margin-right: 4px;

        }


        /* =========================================================
           BOOT
        ========================================================= */

        #boot {

            position: fixed;

            inset: 0;

            z-index: 10000;

            display: flex;

            align-items: center;

            justify-content: center;

            background:

                radial-gradient(
                    circle at center,
                    #f3fdff 0%,
                    #cff0ff 47%,
                    #a6def5 100%
                );

            cursor: pointer;

            pointer-events: auto;

            touch-action: manipulation;

            transition:
                opacity 1s ease;

        }


        #boot.hide {

            opacity: 0;

            pointer-events: none;

        }


        #boot * {

            pointer-events: none;

        }


        .boot-system {

            position: relative;

            width: 320px;
            height: 320px;

            display: flex;

            align-items: center;
            justify-content: center;

        }


        /* =========================================================
           BOOT HALOS
        ========================================================= */

        .boot-halo {

            position: absolute;

            border-radius: 50%;

            pointer-events: none;

            opacity: 0;

        }


        .boot-halo-1 {

            width: 130px;
            height: 130px;

            border:
                1px solid
                rgba(255,255,255,.88);

            animation:
                haloAppear1
                1s
                .05s
                forwards,

                haloRotate1
                10s
                1.1s
                linear
                infinite;

        }


        .boot-halo-2 {

            width: 196px;
            height: 196px;

            border:
                1px dashed
                rgba(255,255,255,.68);

            animation:
                haloAppear2
                1.2s
                .18s
                forwards,

                haloRotate2
                14s
                1.35s
                linear
                infinite;

        }


        .boot-halo-3 {

            width: 275px;
            height: 275px;

            border:
                1px solid
                rgba(255,255,255,.34);

            animation:
                haloAppear3
                1.4s
                .33s
                forwards,

                haloRotate1
                22s
                1.6s
                linear
                infinite;

        }


        @keyframes haloAppear1 {

            from {
                opacity: 0;
                transform: scale(.3);
            }

            to {
                opacity: .76;
                transform: scale(1);
            }

        }


        @keyframes haloAppear2 {

            from {
                opacity: 0;
                transform: scale(.2);
            }

            to {
                opacity: .65;
                transform: scale(1);
            }

        }


        @keyframes haloAppear3 {

            from {
                opacity: 0;
                transform: scale(.15);
            }

            to {
                opacity: .4;
                transform: scale(1);
            }

        }


        @keyframes haloRotate1 {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        @keyframes haloRotate2 {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(-360deg);
            }

        }


        /* =========================================================
           BOOT CORE
        ========================================================= */

        .boot-core {

            position: relative;

            z-index: 100;

            width: 74px;
            height: 74px;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle at 32% 28%,
                    white 0%,
                    white 44%,
                    #c1efff 100%
                );

            box-shadow:

                0 0 24px
                white,

                0 0 60px
                rgba(255,255,255,.92),

                0 0 110px
                rgba(99,210,250,.72);

            transform:
                scale(0);

            animation:

                coreAppear
                1s
                .15s
                cubic-bezier(.22,1,.36,1)
                forwards,

                coreGlow
                2.6s
                1.15s
                ease-in-out
                infinite;

            pointer-events: none;

        }


        /*
         * 非常重要：
         *
         * coreGlow 不碰 transform。
         *
         * 所以滑鼠靠近不會讓它縮小。
         */

        @keyframes coreAppear {

            0% {

                transform:
                    scale(0);

            }

            72% {

                transform:
                    scale(1.15);

            }

            100% {

                transform:
                    scale(1);

            }

        }


        @keyframes coreGlow {

            0%,
            100% {

                box-shadow:

            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.innerHTML = `

                <div class="section-header">

                    <span
                        class="section-dot"
                    ></span>

                    <span
                        class="section-line"
                    ></span>

                    <span
                        class="section-label"
                    >
                        ${data.header}
                    </span>

                </div>


                <div class="title-row">

                    <div class="title">
                        ${data.title}
                    </div>

                    <div class="page-tag">
                        ${data.tag}
                    </div>

                </div>

            `;


            return wrapper;

        }


        /* =========================================================
           RENDER PAGE
        ========================================================= */

        function renderPage(
            index
        ) {

            const data =
                pages[index];


            if (
                !data
            )
                return;


            content.innerHTML =
                "";


            content.appendChild(
                createHeader(
                    data
                )
            );


            /* =====================================================
               PERSONAL
            ===================================================== */

            if (
                data.type ===
                "personal"
            ) {

                const layout =
                    document.createElement(
                        "div"
                    );


                layout.className =
                    "personal-layout";


                const grid =
                    document.createElement(
                        "div"
                    );


                grid.className =
                    "personal-grid";


                data.rows.forEach(
                    row => {

                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "personal-item";


                        item.innerHTML = `

                            <div
                                class="item-label"
                            >
                                ${row.label}
                            </div>

                            <div
                                class="item-value"
                            >
                                ${row.value}
                            </div>

                        `;


                        grid.appendChild(
                            item
                        );

                    }
                );


                const description =
                    document.createElement(
                        "div"
                    );


                description.className =
                    "description";


                description.innerHTML = `

                    <div
                        class="item-label"
                    >
                        DESCRIPTION
                    </div>

                    <div
                        class="item-value"
                    >
                        ${data.description}
                    </div>

                `;


                layout.appendChild(
                    grid
                );


                layout.appendChild(
                    description
                );


                content.appendChild(
                    layout
                );

            }


            /* =====================================================
               FAVORITES
            ===================================================== */

            if (
                data.type ===
                "favorites"
            ) {

                const layout =
                    document.createElement(
                        "div"
                    );


                layout.className =
                    "favorites-layout";


                data.rows.forEach(
                    row => {

                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "favorite";


                        if (
                            row.wide
                        ) {

                            item.classList.add(
                                "wide"
                            );

                        }


                        item.innerHTML = `

                            <div
                                class="favorite-symbol"
                            >
                                ${row.symbol}
                            </div>

                            <div
                                class="favorite-label"
                            >
                                ${row.label}
                            </div>

                            <div
                                class="favorite-value"
                            >
                                ${row.value}
                            </div>

                            <div
                                class="favorite-sub"
                            >
                                ${row.sub}
                            </div>

                        `;


                        layout.appendChild(
                            item
                        );

                    }
                );


                content.appendChild(
                    layout
                );

            }


            /* =====================================================
               WORKS
            ===================================================== */

            if (
                data.type ===
                "works"
            ) {

                const layout =
                    document.createElement(
                        "div"
                    );


                layout.className =
                    "works-layout";


                data.rows.forEach(
                    row => {

                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "work";


                        item.innerHTML = `

                            <div
                                class="work-index"
                            >
                                ${row.index}
                            </div>

                            <div>

                                <div
                                    class="work-name"
                                >
                                    ${row.title}
                                </div>

                                <div
                                    class="work-description"
                                >
                                    ${row.description}
                                </div>

                            </div>

                            <div
                                class="work-state"
                            >
                                ${row.state}
                            </div>

                        `;


                        layout.appendChild(
                            item
                        );

                    }
                );


                content.appendChild(
                    layout
                );

            }


            pageNumber.textContent =
                `${String(index + 1).padStart(2,"0")} / ${String(pages.length).padStart(2,"0")}`;

        }


        /* =========================================================
           PAGE SWITCH
        ========================================================= */

        function switchPage(
            direction
        ) {

            if (
                pageChanging
            )
                return;


            pageChanging =
                true;


            if (
                window.playInterfaceSfx
            ) {

                window.playInterfaceSfx(
                    "page"
                );

            }


            pageScan.classList.remove(
                "active"
            );


            void pageScan.offsetWidth;


            pageScan.classList.add(
                "active"
            );


            const outgoing =
                direction === "next"
                    ? -72
                    : 72;


            const incoming =
                direction === "next"
                    ? 72
                    : -72;


            profile.style.transition =
                `
                    opacity .22s ease,
                    transform .34s cubic-bezier(.22,1,.36,1),
                    filter .22s ease
                `;


            profile.style.opacity =
                "0";


            profile.style.filter =
                "blur(6px)";


            profile.style.transform =
                `
                    translateX(${outgoing}px)
                    scale(.965)
                `;


            setTimeout(
                () => {

                    if (
                        direction ===
                        "next"
                    ) {

                        currentPage =
                            (
                                currentPage +
                                1
                            ) %
                            pages.length;

                    } else {

                        currentPage =
                            (
                                currentPage -
                                1 +
                                pages.length
                            ) %
                            pages.length;

                    }


                    renderPage(
                        currentPage
                    );


                    profile.style.transition =
                        "none";


                    profile.style.opacity =
                        "0";


                    profile.style.filter =
                        "blur(6px)";


                    profile.style.transform =
                        `
                            translateX(${incoming}px)
                            scale(.965)
                        `;


                    requestAnimationFrame(
                        () => {

                            requestAnimationFrame(
                                () => {

                                    profile.style.transition =
                                        `
                                            opacity .46s ease,
                                            transform .58s cubic-bezier(.22,1,.36,1),
                                            filter .46s ease
                                        `;


                                    profile.style.opacity =
                                        "1";


                                    profile.style.filter =
                                        "blur(0)";


                                    profile.style.transform =
                                        `
                                            translateX(0)
                                            scale(1)
                                        `;

                                }
                            );

                        }
                    );


                    setTimeout(
                        () => {

                            pageChanging =
                                false;

                        },
                        600
                    );

                },
                220
            );

        }


        /* =========================================================
           NAV BUTTONS
        ========================================================= */

        document
            .getElementById(
                "btn-next"
            )
            .addEventListener(
                "click",
                () => {

                    switchPage(
                        "next"
                    );

                }
            );


        document
            .getElementById(
                "btn-prev"
            )
            .addEventListener(
                "click",
                () => {

                    switchPage(
                        "prev"
                    );

                }
            );


        /* =========================================================
           KEYBOARD
        ========================================================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "ArrowRight" ||
                    event.key.toLowerCase() === "d"
                ) {

                    switchPage(
                        "next"
                    );

                }


                if (
                    event.key ===
                    "ArrowLeft" ||
                    event.key.toLowerCase() === "a"
                ) {

                    switchPage(
                        "prev"
                    );

                }

            }
        );


        /* =========================================================
           TOUCH
        ========================================================= */

        let touchStartX =
            0;


        profile.addEventListener(
            "touchstart",
            event => {

                touchStartX =
                    event.changedTouches[0]
                        .screenX;

            },
            {
                passive: true
            }
        );


        profile.addEventListener(
            "touchend",
            event => {

                const endX =
                    event.changedTouches[0]
                        .screenX;


                const distance =
                    endX -
                    touchStartX;


                if (
                    Math.abs(distance) <
                    50
                )
                    return;


                if (
                    distance < 0
                ) {

                    switchPage(
                        "next"
                    );

                } else {

                    switchPage(
                        "prev"
                    );

                }

            },
            {
                passive: true
            }
        );


        /* =========================================================
           MOUSE PARALLAX
        ========================================================= */

        let mouseX =
            0;


        let mouseY =
            0;


        let smoothX =
            0;


        let smoothY =
            0;


        document.addEventListener(
            "mousemove",
            event => {

                mouseX =
                    event.clientX /
                    window.innerWidth
                    -
                    .5;


                mouseY =
                    event.clientY /
                    window.innerHeight
                    -
                    .5;


                document.documentElement.style
                    .setProperty(
                        "--mouse-x",
                        `${event.clientX /
                            window.innerWidth *
                            100}%`
                    );


                document.documentElement.style
                    .setProperty(
                        "--mouse-y",
                        `${event.clientY /
                            window.innerHeight *
                            100}%`
                    );

            }
        );


        function animateParallax() {

            smoothX +=
                (
                    mouseX -
                    smoothX
                ) * .023;


            smoothY +=
                (
                    mouseY -
                    smoothY
                ) * .023;


            /*
             * 背景只移非常小的距離，
             * 外面有大型安全區，
             * 因此永遠不會露白。
             */

            document.documentElement.style
                .setProperty(
                    "--bg-x",
                    `${smoothX * 34}px`
                );


            document.documentElement.style
                .setProperty(
                    "--bg-y",
                    `${smoothY * 27}px`
                );


            requestAnimationFrame(
                animateParallax
            );

        }


        animateParallax();


        /* =========================================================
           CLICK FX
        ========================================================= */

        document.addEventListener(
            "pointerdown",
            event => {

                /*
                 * 不在 Boot 重複製造
                 * 太大的點擊效果。
                 */

                if (
                    event.target.closest(
                        "#boot"
                    )
                ) {

                    return;

                }


                const ring =
                    document.createElement(
                        "div"
                    );


                ring.className =
                    "click-ring";


                ring.style.left =
                    `${event.clientX}px`;


                ring.style.top =
                    `${event.clientY}px`;


                document.body.appendChild(
                    ring
                );


                setTimeout(
                    () => {

                        ring.remove();

                    },
                    700
                );


                if (
                    window.playInterfaceSfx
                ) {

                    window.playInterfaceSfx(
                        "click"
                    );

                }

            }
        );


        /* =========================================================
           PARTICLES
        ========================================================= */

        const backCanvas =
            document.getElementById(
                "particles-back"
            );


        const frontCanvas =
            document.getElementById(
                "particles-front"
            );


        const backCtx =
            backCanvas.getContext(
                "2d"
            );


        const frontCtx =
            frontCanvas.getContext(
                "2d"
            );


        let width =
            window.innerWidth;


        let height =
            window.innerHeight;


        function resizeParticles() {

            width =
                window.innerWidth;


            height =
                window.innerHeight;


            backCanvas.width =
                width;


            backCanvas.height =
                height;


            frontCanvas.width =
                width;


            frontCanvas.height =
                height;

        }


        resizeParticles();


        window.addEventListener(
            "resize",
            resizeParticles
        );


        class Particle {

            constructor(
                layer
            ) {

                this.layer =
                    layer;


                this.reset(
                    true
                );

            }


            reset(
                initial = false
            ) {

                this.x =
                    Math.random() *
                    width;


                this.y =
                    initial
                        ? Math.random() *
                          height
                        : height + 35;


                this.depth =
                    this.layer ===
                    "back"

                        ? .08 +
                          Math.random() *
                          .32

                        : .65 +
                          Math.random() *
                          .35;


                this.radius =
                    this.layer ===
                    "back"

                        ? .25 +
                          Math.random() *
                          .85

                        : .35 +
                          Math.random() *
                          1.65;


                this.speed =
                    this.layer ===
                    "back"

                        ? .025 +
                          Math.random() *
                          .12

                        : .055 +
                          Math.random() *
                          .23;


                this.opacity =
                    this.layer ===
                    "back"

                        ? .035 +
                          Math.random() *
                          .15

                        : .08 +
                          Math.random() *
                          .28;


                this.drift =
                    (
                        Math.random() -
                        .5
                    ) * .14;


                this.phase =
                    Math.random() *
                    Math.PI *
                    2;


                this.wave =
                    .0002 +
                    Math.random() *
                    .0008;


                this.star =
                    Math.random() <
                    (
                        this.layer ===
                        "front"
                            ? .075
                            : .025
                    );


                this.bright =
                    Math.random() <
                    (
                        this.layer ===
                        "front"
                            ? .035
                            : .012
                    );

            }


            update(
                time
            ) {

                /*
                 * 上飄
                 */

                this.y -=
                    this.speed;


                /*
                 * 基礎左右
                 */

                this.x +=
                    this.drift;


                /*
                 * 自然波動
                 */

                this.x +=
                    Math.sin(
                        time *
                        this.wave
                        +
                        this.phase
                    )
                    *
                    (
                        .035 *
                        this.depth
                    );


                /*
                 * 輕微受滑鼠影響
                 */

                const cursorX =
                    width / 2 +
                    mouseX *
                    width;


                const cursorY =
                    height / 2 +
                    mouseY *
                    height;


                const dx =
                    cursorX -
                    this.x;


                const dy =
                    cursorY -
                    this.y;


                const dist =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (
                    dist <
                    190
                ) {

                    const amount =
                        (
                            1 -
                            dist / 190
                        )
                        *
                        .0012
                        *
                        this.depth;


                    this.x -=
                        dx *
                        amount;


                    this.y -=
                        dy *
                        amount;

                }


                /*
                 * 左右循環
                 */

                if (
                    this.x <
                    -40
                ) {

                    this.x =
                        width + 40;

                }


                if (
                    this.x >
                    width + 40
                ) {

                    this.x =
                        -40;

                }


                /*
                 * 上方重生
                 */

                if (
                    this.y <
                    -40
                ) {

                    this.reset(
                        false
                    );

                }

            }


            draw(
                ctx,
                time
            ) {

                const pulse =
                    1 +
                    Math.sin(
                        time *
                        .0011 +
                        this.phase
                    ) *
                    .15;


                let alpha =
                    this.opacity *
                    pulse;


                if (
                    this.bright
                ) {

                    alpha *=
                        1.45;

                }


                if (
                    !this.star
                ) {

                    ctx.beginPath();


                    ctx.arc(
                        this.x,
                        this.y,
                        this.radius,
                        0,
                        Math.PI * 2
                    );


                    if (
                        this.bright
                    ) {

                        ctx.shadowBlur =
                            8 *
                            this.depth;


                        ctx.shadowColor =
                            "rgba(255,255,255,.65)";

                    } else {

                        ctx.shadowBlur =
                            0;

                    }


                    ctx.fillStyle =
                        `
                            rgba(
                                255,
                                255,
                                255,
                                ${alpha}
                            )
                        `;


                    ctx.fill();


                    ctx.shadowBlur =
                        0;


                    return;

                }


                /*
                 * 少量星芒
                 */

                const length =
                    this.radius *
                    4.5;


                ctx.save();


                ctx.translate(
                    this.x,
                    this.y
                );


                ctx.globalAlpha =
                    alpha;


                ctx.shadowBlur =
                    10 *
                    this.depth;


                ctx.shadowColor =
                    "rgba(255,255,255,.8)";


                ctx.fillStyle =
                    "rgba(255,255,255,.9)";


                ctx.beginPath();


                ctx.moveTo(
                    0,
                    -length
                );


                ctx.lineTo(
                    this.radius * .35,
                    0
                );


                ctx.lineTo(
                    0,
                    length
                );


                ctx.lineTo(
                    -this.radius * .35,
                    0
                );


                ctx.closePath();


                ctx.fill();


                ctx.restore();

            }

        }


        const backParticles =
            [];


        const frontParticles =
            [];


        for (
            let i = 0;
            i < 72;
            i++
        ) {

            backParticles.push(
                new Particle(
                    "back"
                )
            );

        }


        for (
            let i = 0;
            i < 32;
            i++
        ) {

            frontParticles.push(
                new Particle(
                    "front"
                )
            );

        }


        /* =========================================================
           PARTICLE LOOP
        ========================================================= */

        function animateParticles(
            time
        ) {

            backCtx.clearRect(
                0,
                0,
                width,
                height
            );


            frontCtx.clearRect(
                0,
                0,
                width,
                height
            );


            backParticles.forEach(
                particle => {

                    particle.update(
                        time
                    );


                    particle.draw(
                        backCtx,
                        time
                    );

                }
            );


            frontParticles.forEach(
                particle => {

                    particle.update(
                        time
                    );


                    particle.draw(
                        frontCtx,
                        time
                    );

                }
            );


            requestAnimationFrame(
                animateParticles
            );

        }


        requestAnimationFrame(
            animateParticles
        );


        /* =========================================================
           INITIAL PAGE
        ========================================================= */

        renderPage(
            0
        );


        /* =========================================================
           BOOT INPUT
        ========================================================= */

        const boot =
            document.getElementById(
                "boot"
            );


        const enterPrompt =
            document.getElementById(
                "enter-prompt"
            );


        let entered =
            false;


        /*
         * 讓使用者即使還沒看到提示，
         * 也可以直接點整個開機畫面。
         */

        setTimeout(
            () => {

                if (
                    !entered
                ) {

                    enterPrompt.classList.add(
                        "show"
                    );

                }

            },
            1800
        );


        /* =========================================================
           ENTER
        ========================================================= */

        function enterSite() {

            if (
                entered
            )
                return;


            entered =
                true;


            /*
             * =====================================================
             * 先記錄播放要求。
             *
             * music_module.js 不論現在是否 Ready，
             * 都能吃到這個 flag。
             * =====================================================
             */

            window.__WND_START_MUSIC_REQUESTED =
                true;


            /*
             * AudioContext
             */

            if (
                window.resumeInterfaceAudio
            ) {

                try {

                    window.resumeInterfaceAudio();

                } catch (
                    error
                ) {}

            }


            /*
             * 音樂
             */

            if (
                window.startMusic
            ) {

                try {

                    window.startMusic();

                } catch (
                    error
                ) {}

            }


            /*
             * Boot SFX
             */

            if (
                window.playInterfaceSfx
            ) {

                try {

                    window.playInterfaceSfx(
                        "boot"
                    );

                } catch (
                    error
                ) {}

            }


            /*
             * Core 爆發
             */

            boot.classList.add(
                "complete"
            );


            enterPrompt.classList.remove(
                "show"
            );


            /*
             * 主介面進場
             */

            setTimeout(
                () => {

                    boot.classList.add(
                        "hide"
                    );


                    document.body.classList.add(
                        "entered"
                    );

                },
                600
            );


            /*
             * 完全移除
             */

            setTimeout(
                () => {

                    if (
                        boot &&
                        boot.parentNode
                    ) {

                        boot.remove();

                    }

                },
                1700
            );

        }


        /*
         * =====================================================
         * 核心修復：
         *
         * 不只球能點。
         * 整個 Boot 都能點。
         *
         * 所以不存在「點到 Halo 才不算」
         * 或「球的子元素把事件吃掉」。
         * =====================================================
         */

        boot.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();

                event.stopPropagation();


                if (
                    !entered
                ) {

                    enterSite();

                }

            },
            {
                passive:
                    false
            }
        );


        /*
         * click fallback
         */

        boot.addEventListener(
            "click",
            event => {

                event.preventDefault();

                event.stopPropagation();


                if (
                    !entered
                ) {

                    enterSite();

                }

            }
        );


        /*
         * Enter / Space
         */

        boot.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter" ||
                    event.key ===
                    " "
                ) {

                    event.preventDefault();


                    if (
                        !entered
                    ) {

                        enterSite();

                    }

                }

            }
        );

    </script>


    <!-- =========================================================
         MUSIC MODULE
    ========================================================= -->

    <script src="music_module.js"></script>

</body>
