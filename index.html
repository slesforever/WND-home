<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>WND // Archive</title>

    <link
        rel="icon"
        href="https://shared.fastly.steamstatic.com/community_assets/images/apps/1256670/6aae1f276e95e65de99d6ffea75f010167d5d0c6.jpg"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet"
    >


    <style>

        :root {

            --blue: #63cdf7;
            --blue-bright: #a8ecff;
            --blue-dark: #398eb8;

            --white: #ffffff;

            --text: #38596b;
            --text-soft: #7b98a8;

            --line: rgba(86, 196, 235, 0.35);

            --mx: 50%;
            --my: 50%;

        }


        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;

            overflow: hidden;

        }


        body {

            font-family:
                "Barlow",
                "Noto Sans TC",
                sans-serif;

            background: #bdeeff;

            color: var(--text);

            user-select: none;

            -webkit-tap-highlight-color: transparent;

        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .bg {

            position: fixed;

            inset: -8%;

            z-index: 0;

            background-image:
                linear-gradient(
                    rgba(210, 242, 255, 0.06),
                    rgba(210, 242, 255, 0.20)
                ),
                url("maxresdefault.jpg");

            background-size: cover;

            background-position: center;

            transform:
                scale(1.16)
                translate3d(0, 0, 0);

            will-change: transform;

        }


        .bg-overlay {

            position: fixed;

            inset: 0;

            z-index: 1;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at center,
                    transparent 15%,
                    rgba(63, 123, 150, 0.13) 100%
                );

        }


        .bg-light {

            position: fixed;

            inset: 0;

            z-index: 2;

            pointer-events: none;

            background:
                radial-gradient(
                    circle 420px at var(--mx) var(--my),
                    rgba(255,255,255,0.20),
                    transparent 70%
                );

        }


        .grid {

            position: fixed;

            inset: 0;

            z-index: 3;

            pointer-events: none;

            opacity: 0.10;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.20) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.20) 1px,
                    transparent 1px
                );

            background-size: 65px 65px;

        }


        /* =====================================================
           VFX CANVAS
        ===================================================== */

        #vfx {

            position: fixed;

            inset: 0;

            z-index: 4;

            width: 100%;
            height: 100%;

            pointer-events: none;

        }


        /* =====================================================
           TOP HUD
        ===================================================== */

        .top-ui {

            position: fixed;

            left: 30px;
            right: 30px;

            top: 24px;

            z-index: 20;

            display: flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            pointer-events: none;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 10px;

            color:
                rgba(42, 88, 111, 0.75);

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 3px;

        }


        .brand-dot {

            width: 10px;
            height: 10px;

            border-radius: 50%;

            border:
                2px solid
                var(--blue);

            background:
                rgba(255,255,255,0.9);

            box-shadow:
                0 0 14px
                rgba(89,204,247,0.9);

            animation:
                brandPulse 2.8s ease-in-out infinite;

        }


        @keyframes brandPulse {

            0%,
            100% {
                transform: scale(.85);
            }

            50% {
                transform: scale(1.15);
            }

        }


        .top-info {

            display: flex;

            flex-direction: column;

            gap: 5px;

            align-items: flex-end;

            color:
                rgba(42, 88, 111, 0.52);

            font-size: 9px;

            font-weight: 600;

            letter-spacing: 2px;

        }


        /* =====================================================
           SIDE
        ===================================================== */

        .side-hud {

            position: fixed;

            left: 28px;

            top: 50%;

            transform:
                translateY(-50%);

            z-index: 18;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 12px;

            opacity: .55;

        }


        .side-line {

            width: 1px;

            height: 70px;

            background:
                linear-gradient(
                    to bottom,
                    transparent,
                    var(--blue),
                    transparent
                );

        }


        .side-text {

            writing-mode:
                vertical-rl;

            font-size: 8px;

            letter-spacing: 3px;

            color:
                #4d91ad;

        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            position: relative;

            z-index: 10;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            perspective: 1200px;

        }


        /* =====================================================
           PROFILE PANEL
        ===================================================== */

        .profile {

            position: relative;

            width:
                min(680px, 88vw);

            min-height: 450px;

            padding:
                42px 45px 48px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.83),
                    rgba(246,252,255,0.66)
                );

            border:
                1px solid
                rgba(255,255,255,0.95);

            box-shadow:

                0 30px 90px
                rgba(50,111,143,0.26),

                0 4px 18px
                rgba(50,111,143,0.12);

            backdrop-filter:
                blur(18px)
                saturate(125%);

            -webkit-backdrop-filter:
                blur(18px)
                saturate(125%);

            overflow: hidden;

            transform:
                translateY(15px)
                scale(.975);

            opacity: 0;

            transition:

                opacity .9s
                cubic-bezier(.22,1,.36,1),

                transform .9s
                cubic-bezier(.22,1,.36,1);

        }


        body.entered .profile {

            opacity: 1;

            transform:
                translateY(0)
                scale(1);

        }


        /* =====================================================
           PANEL DECORATION
        ===================================================== */

        .profile::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 4px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    #74dcff 25%,
                    white 50%,
                    #74dcff 75%,
                    transparent
                );

            animation:
                topShine 4s ease-in-out infinite;

        }


        @keyframes topShine {

            0%,
            100% {
                opacity: .55;
            }

            50% {
                opacity: 1;
            }

        }


        .corner {

            position: absolute;

            width: 22px;
            height: 22px;

            opacity: .65;

        }


        .corner::before,
        .corner::after {

            content: "";

            position: absolute;

            background:
                var(--blue);

        }


        .corner::before {

            width: 100%;
            height: 1px;

        }


        .corner::after {

            width: 1px;
            height: 100%;

        }


        .tl {
            top: 16px;
            left: 16px;
        }

        .tr {
            top: 16px;
            right: 16px;
            transform: rotate(90deg);
        }

        .bl {
            bottom: 16px;
            left: 16px;
            transform: rotate(-90deg);
        }

        .br {
            bottom: 16px;
            right: 16px;
            transform: rotate(180deg);
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .section-header {

            position: relative;

            z-index: 2;

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .header-point {

            width: 7px;
            height: 7px;

            background:
                var(--blue);

            border-radius: 50%;

            box-shadow:
                0 0 12px
                rgba(89,204,247,.8);

        }


        .header-line {

            width: 34px;

            height: 1px;

            background:
                var(--blue);

        }


        .header-text {

            color:
                var(--blue-dark);

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 2.4px;

        }


        /* =====================================================
           NAME
        ===================================================== */

        .name {

            position: relative;

            z-index: 2;

            margin-top: 15px;

            color: #ffffff;

            font-size:
                clamp(54px, 9vw, 76px);

            font-weight: 800;

            line-height: .9;

            letter-spacing:
                -2px;

            text-shadow:
                0 4px 17px
                rgba(52,115,145,.30);

        }


        .codename {

            position: relative;

            z-index: 2;

            margin-top: 11px;

            color:
                #678594;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 2.5px;

        }


        /* =====================================================
           PROFILE GRID
        ===================================================== */

        .profile-grid {

            position: relative;

            z-index: 2;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-top: 34px;

        }


        .info {

            position: relative;

            min-height: 76px;

            padding:
                14px 16px;

            background:
                rgba(255,255,255,.58);

            border:
                1px solid
                rgba(255,255,255,.92);

            overflow: hidden;

            transform:
                translateY(8px);

            opacity: 0;

            transition:

                opacity .5s ease,

                transform .5s
                cubic-bezier(.22,1,.36,1),

                background .2s ease;

        }


        body.entered .info {

            transform:
                translateY(0);

            opacity: 1;

        }


        body.entered .info:nth-child(1) {
            transition-delay: .2s;
        }

        body.entered .info:nth-child(2) {
            transition-delay: .3s;
        }

        body.entered .info:nth-child(3) {
            transition-delay: .4s;
        }

        body.entered .info:nth-child(4) {
            transition-delay: .5s;
        }


        .info::after {

            content: "";

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    var(--blue),
                    transparent
                );

            transform:
                scaleX(0);

            transform-origin:
                left;

            transition:
                transform .25s ease;

        }


        .info:hover {

            background:
                rgba(255,255,255,.83);

        }


        .info:hover::after {

            transform:
                scaleX(1);

        }


        .info-label {

            margin-bottom: 7px;

            color:
                #7d9aa9;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 1.6px;

        }


        .info-value {

            color:
                #405d6e;

            font-size: 14px;

            font-weight: 600;

            line-height: 1.35;

        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page-number {

            position: absolute;

            right: 28px;
            bottom: 20px;

            color:
                #7693a3;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 2px;

        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .nav {

            position: fixed;

            top: 50%;

            width: 54px;
            height: 54px;

            z-index: 30;

            transform:
                translateY(-50%);

            border:
                1px solid
                rgba(255,255,255,.94);

            background:
                rgba(255,255,255,.63);

            backdrop-filter:
                blur(11px);

            -webkit-backdrop-filter:
                blur(11px);

            box-shadow:
                0 12px 32px
                rgba(49,113,145,.17);

            cursor: pointer;

            display: flex;

            justify-content: center;
            align-items: center;

            opacity: 0;

            transition:

                opacity .8s ease,

                transform .2s ease,

                background .2s ease,

                box-shadow .2s ease;

        }


        body.entered .nav {

            opacity: 1;

        }


        .nav:hover {

            background:
                rgba(255,255,255,.92);

            box-shadow:
                0 15px 35px
                rgba(49,113,145,.25);

        }


        .nav:active {

            transform:
                translateY(-50%)
                scale(.88);

        }


        .nav-left {
            left: 25px;
        }

        .nav-right {
            right: 25px;
        }


        .arrow {

            width: 10px;
            height: 10px;

            border-top:
                2px solid
                var(--blue-dark);

            border-right:
                2px solid
                var(--blue-dark);

        }


        .arrow-left {

            transform:
                rotate(-135deg);

            margin-left: 4px;

        }


        .arrow-right {

            transform:
                rotate(45deg);

            margin-right: 4px;

        }


        /* =====================================================
           MUSIC
        ===================================================== */

        .music {

            position: fixed;

            right: 27px;
            bottom: 24px;

            z-index: 40;

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .music-button {

            width: 48px;
            height: 48px;

            border:
                1px solid
                rgba(255,255,255,.95);

            background:
                rgba(255,255,255,.78);

            color:
                var(--blue-dark);

            box-shadow:
                0 10px 30px
                rgba(49,113,145,.16);

            cursor: pointer;

            font-size: 17px;

            transition:
                all .2s ease;

        }


        .music-button:hover {

            transform:
                translateY(-3px);

            background:
                white;

        }


        .music-button.playing {

            color: white;

            background:
                var(--blue);

            box-shadow:

                0 0 0 5px
                rgba(89,204,247,.12),

                0 10px 30px
                rgba(49,113,145,.22);

        }


        .music-open-label {

            padding:
                7px 11px;

            background:
                rgba(255,255,255,.70);

            border:
                1px solid
                rgba(255,255,255,.9);

            color:
                #5f7f90;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1px;

            opacity: 0;

            transform:
                translateX(7px);

            transition:
                all .2s ease;

            pointer-events:
                none;

        }


        .music:hover
        .music-open-label {

            opacity: 1;

            transform:
                translateX(0);

        }


        /* =====================================================
           PLAYLIST
        ===================================================== */

        .playlist {

            position: fixed;

            right: 27px;
            bottom: 82px;

            z-index: 39;

            width: 350px;

            max-width:
                calc(100vw - 30px);

            background:
                rgba(248,253,255,.94);

            border:
                1px solid
                rgba(255,255,255,.96);

            box-shadow:
                0 20px 55px
                rgba(47,109,140,.22);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            display: none;

            overflow: hidden;

        }


        .playlist.open {

            display: block;

            animation:
                playlistIn .25s ease;

        }


        @keyframes playlistIn {

            from {

                opacity: 0;

                transform:
                    translateY(8px)
                    scale(.98);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        .playlist-title {

            padding:
                13px 15px;

            border-bottom:
                1px solid
                rgba(89,204,247,.18);

            color:
                var(--blue-dark);

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 1.8px;

        }


        .playlist-list {

            max-height: 250px;

            overflow-y: auto;

        }


        .playlist-list::-webkit-scrollbar {

            width: 5px;

        }


        .playlist-list::-webkit-scrollbar-thumb {

            background:
                rgba(89,204,247,.30);

        }


        .track {

            min-height: 46px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 10px;

            padding:
                9px 12px;

            border-bottom:
                1px solid
                rgba(80,130,150,.08);

            cursor: pointer;

            transition:
                background .2s ease;

        }


        .track:hover {

            background:
                rgba(89,204,247,.08);

        }


        .track.active {

            background:
                rgba(89,204,247,.14);

        }


        .track-name {

            min-width: 0;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;

            color:
                #5c7686;

            font-size: 11px;

            font-weight: 600;

        }


        .track.active
        .track-name {

            color:
                var(--blue-dark);

        }


        .track-remove {

            flex-shrink: 0;

            width: 25px;
            height: 25px;

            border: 0;

            background: transparent;

            color:
                rgba(110,140,155,.50);

            cursor: pointer;

        }


        .track-remove:hover {

            color:
                #e76868;

        }


        .playlist-add {

            display: flex;

            gap: 7px;

            padding:
                10px;

            border-top:
                1px solid
                rgba(89,204,247,.18);

        }


        .playlist-add input {

            flex: 1;

            min-width: 0;

            padding:
                8px 10px;

            outline: none;

            border:
                1px solid
                rgba(89,204,247,.25);

            background:
                rgba(255,255,255,.80);

            color:
                #466474;

            font-family: inherit;

            font-size: 10px;

        }


        .playlist-add input:focus {

            border-color:
                rgba(89,204,247,.65);

        }


        .playlist-add button {

            padding:
                8px 13px;

            border:
                1px solid
                var(--blue);

            background:
                rgba(89,204,247,.12);

            color:
                var(--blue-dark);

            font-family: inherit;

            font-size: 10px;

            font-weight: 700;

            cursor: pointer;

        }


        .playlist-add button:hover {

            background:
                var(--blue);

            color:
                white;

        }


        /* =====================================================
           BOOT
        ===================================================== */

        #boot {

            position: fixed;

            inset: 0;

            z-index: 10000;

            display: flex;

            justify-content: center;

            align-items: center;

            background:

                radial-gradient(
                    circle at center,
                    #edfaff,
                    #c9efff 55%,
                    #a9def5
                );

            transition:
                opacity 1s ease;

        }


        #boot.hide {

            opacity: 0;

            pointer-events: none;

        }


        .boot-system {

            position: relative;

            width: 320px;
            height: 320px;

            display: flex;

            align-items: center;
            justify-content: center;

        }


        /* halo rings */

        .halo {

            position: absolute;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,.78);

            opacity: 0;

        }


        .halo-1 {

            width: 130px;
            height: 130px;

            animation:
                haloAppear
                1.2s
                .15s
                forwards,

                spin
                13s
                1.35s
                linear
                infinite;

        }


        .halo-2 {

            width: 200px;
            height: 200px;

            border-style:
                dashed;

            animation:
                haloAppear
                1.3s
                .30s
                forwards,

                spinReverse
                18s
                1.6s
                linear
                infinite;

        }


        .halo-3 {

            width: 275px;
            height: 275px;

            border-color:
                rgba(255,255,255,.38);

            animation:
                haloAppear
                1.5s
                .45s
                forwards,

                spin
                26s
                1.8s
                linear
                infinite;

        }


        @keyframes haloAppear {

            from {

                opacity: 0;

                transform:
                    scale(.25);

            }

            to {

                opacity: .7;

                transform:
                    scale(1);

            }

        }


        @keyframes spin {

            from {
                transform: rotate(0);
            }

            to {
                transform: rotate(360deg);
            }

        }


        @keyframes spinReverse {

            from {
                transform: rotate(0);
            }

            to {
                transform: rotate(-360deg);
            }

        }


        /* core */

        .core {

            position: relative;

            width: 72px;
            height: 72px;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle at 32% 28%,
                    #ffffff,
                    #faffff 42%,
                    #bceeff
                );

            box-shadow:

                0 0 25px
                white,

                0 0 60px
                rgba(255,255,255,.95),

                0 0 110px
                rgba(89,204,247,.78);

            transform:
                scale(0);

            animation:
                coreAppear
                1.1s
                .2s
                cubic-bezier(.22,1,.36,1)
                forwards,

                corePulse
                2.6s
                1.25s
                ease-in-out
                infinite;

            z-index: 5;

        }


        @keyframes coreAppear {

            0% {

                transform:
                    scale(0)
                    rotate(-30deg);

            }

            70% {

                transform:
                    scale(1.18)
                    rotate(6deg);

            }

            100% {

                transform:
                    scale(1)
                    rotate(0);

            }

        }


        @keyframes corePulse {

            0%,
            100% {

                box-shadow:

                    0 0 22px white,

                    0 0 55px
                    rgba(255,255,255,.9),

                    0 0 95px
                    rgba(89,204,247,.58);

            }

            50% {

                box-shadow:

                    0 0 36px white,

                    0 0 80px
                    rgba(255,255,255,1),

                    0 0 140px
                    rgba(89,204,247,.85);

            }

        }


        .core::after {

            content: "";

            position: absolute;

            left: 50%;
            top: 50%;

            width: 18px;
            height: 18px;

            transform:
                translate(-50%,-50%);

            border-radius: 50%;

            background:
                white;

            box-shadow:
                0 0 22px white;

        }


        .boot-text {

            position: absolute;

            bottom: 14%;

            color:
                rgba(53,105,127,.72);

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 4px;

            opacity: 0;

            animation:
                textAppear
                1s
                .7s
                forwards;

        }


        @keyframes textAppear {

            from {

                opacity: 0;

                transform:
                    translateY(8px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        #boot.complete .core {

            animation:
                bootBurst
                .8s
                cubic-bezier(.22,1,.36,1)
                forwards;

        }


        @keyframes bootBurst {

            0% {
                transform: scale(1);
            }

            35% {
                transform: scale(1.8);
            }

            100% {
                transform: scale(26);
            }

        }


        /* =====================================================
           TOUCH PROMPT
        ===================================================== */

        #enter-prompt {

            position: fixed;

            inset: 0;

            z-index: 9000;

            display: flex;

            align-items: flex-end;

            justify-content: center;

            padding-bottom: 12vh;

            pointer-events: none;

            opacity: 0;

            transition:
                opacity .8s ease;

        }


        #enter-prompt.show {

            opacity: 1;

        }


        .enter-button {

            position: relative;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 10px;

            color:
                rgba(52,104,127,.72);

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 3px;

            animation:
                enterPulse
                2.8s
                ease-in-out
                infinite;

        }


        @keyframes enterPulse {

            0%,
            100% {
                transform: translateY(0);
                opacity: .55;
            }

            50% {
                transform: translateY(-4px);
                opacity: 1;
            }

        }


        .enter-ring {

            width: 48px;
            height: 48px;

            border-radius: 50%;

            border:
                1px solid
                rgba(89,204,247,.55);

            box-shadow:
                0 0 22px
                rgba(89,204,247,.28);

            position: relative;

        }


        .enter-ring::after {

            content: "";

            position: absolute;

            width: 9px;
            height: 9px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%,-50%)
                rotate(45deg);

            border:
                1px solid
                var(--blue-dark);

        }


        @media (max-width: 700px) {

            .top-ui {

                left: 15px;
                right: 15px;

                top: 17px;

            }


            .side-hud {

                display: none;

            }


            .profile {

                width: 90vw;

                min-height: 440px;

                padding:
                    40px 22px 46px;

            }


            .profile-grid {

                grid-template-columns:
                    1fr;

                gap: 9px;

                margin-top: 28px;

            }


            .name {

                font-size: 50px;

            }


            .nav {

                width: 43px;
                height: 43px;

            }


            .nav-left {
                left: 8px;
            }

            .nav-right {
                right: 8px;
            }


            .music {

                right: 14px;
                bottom: 14px;

            }


            .playlist {

                right: 15px;
                bottom: 72px;

                width:
                    calc(100vw - 30px);

            }


            .music-open-label {

                display: none;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ===================================================== -->

    <div
        class="bg"
        id="background"
    ></div>

    <div
        class="bg-overlay"
    ></div>

    <div
        class="bg-light"
        id="bg-light"
    ></div>

    <div
        class="grid"
    ></div>


    <!-- VFX -->

    <canvas
        id="vfx"
    ></canvas>


    <!-- =====================================================
         TOP
    ===================================================== -->

    <header class="top-ui">

        <div class="brand">

            <span
                class="brand-dot"
            ></span>

            <span>
                WND
            </span>

        </div>


        <div class="top-info">

            <span>
                PERSONAL ARCHIVE
            </span>

            <span>
                SYSTEM // 01
            </span>

        </div>

    </header>


    <!-- =====================================================
         SIDE
    ===================================================== -->

    <aside class="side-hud">

        <div class="side-line"></div>

        <div class="side-text">
            ARCHIVE INTERFACE
        </div>

        <div class="side-line"></div>

    </aside>


    <!-- =====================================================
         NAV
    ===================================================== -->

    <button
        class="nav nav-left"
        id="btn-prev"
    >
        <span
            class="arrow arrow-left"
        ></span>
    </button>


    <button
        class="nav nav-right"
        id="btn-next"
    >
        <span
            class="arrow arrow-right"
        ></span>
    </button>


    <!-- =====================================================
         MAIN
    ===================================================== -->

    <main class="main">

        <section
            class="profile"
            id="profile"
        >

            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>


            <div class="section-header">

                <span
                    class="header-point"
                ></span>

                <span
                    class="header-line"
                ></span>

                <span
                    class="header-text"
                    id="header-text"
                >
                    PERSONAL RECORD
                </span>

            </div>


            <div
                class="name"
                id="name"
            >
                WND
            </div>


            <div
                class="codename"
                id="codename"
            >
                —
            </div>


            <div
                class="profile-grid"
                id="profile-grid"
            ></div>


            <div
                class="page-number"
                id="page-number"
            >
                01 / 03
            </div>

        </section>

    </main>


    <!-- =====================================================
         MUSIC
    ===================================================== -->

    <div class="music">

        <div class="music-open-label">
            SOUNDTRACK
        </div>

        <button
            class="music-button"
            id="music-button"
        >
            ♫
        </button>

    </div>


    <div
        class="playlist"
        id="playlist"
    >

        <div class="playlist-title">
            SOUNDTRACK // PLAYLIST
        </div>

        <div
            class="playlist-list"
            id="playlist-list"
        ></div>

        <div class="playlist-add">

            <input
                id="youtube-input"
                type="text"
                placeholder="Paste YouTube link or ID..."
            >

            <button
                id="youtube-add"
            >
                ADD
            </button>

        </div>

    </div>


    <!-- =====================================================
         YOUTUBE
    ===================================================== -->

    <div
        id="youtube-player"
        style="
            position:fixed;
            width:1px;
            height:1px;
            left:-9999px;
            top:-9999px;
        "
    ></div>


    <!-- =====================================================
         BOOT
    ===================================================== -->

    <div id="boot">

        <div class="boot-system">

            <div class="halo halo-1"></div>

            <div class="halo halo-2"></div>

            <div class="halo halo-3"></div>

            <div class="core"></div>

            <div class="boot-text">
                INITIALIZING
            </div>

        </div>

    </div>


    <!-- =====================================================
         ENTER
    ===================================================== -->

    <div id="enter-prompt">

        <div class="enter-button">

            <div class="enter-ring"></div>

            <span>
                TOUCH / CLICK TO ENTER
            </span>

        </div>

    </div>


    <script>

        /* =====================================================
           PAGE DATA
        ===================================================== */

        const pages = [

            {
                header:
                    "PERSONAL RECORD",

                name:
                    "WND",

                codename:
                    "—",

                rows: [

                    {
                        label:
                            "NAME",

                        value:
                            "—"
                    },

                    {
                        label:
                            "ROLE",

                        value:
                            "—"
                    },

                    {
                        label:
                            "INTEREST",

                        value:
                            "—"
                    },

                    {
                        label:
                            "STATUS",

                        value:
                            "—"
                    }

                ]

            },


            {

                header:
                    "PREFERENCES",

                name:
                    "Favorites",

                codename:
                    "—",

                rows: [

                    {
                        label:
                            "GAME",

                        value:
                            "—"
                    },

                    {
                        label:
                            "MUSIC",

                        value:
                            "—"
                    },

                    {
                        label:
                            "NOVEL",

                        value:
                            "—"
                    },

                    {
                        label:
                            "OTHER",

                        value:
                            "—"
                    }

                ]

            },


            {

                header:
                    "CREATIVE LOG",

                name:
                    "Works",

                codename:
                    "—",

                rows: [

                    {
                        label:
                            "PROJECT",

                        value:
                            "—"
                    },

                    {
                        label:
                            "ENGINE",

                        value:
                            "—"
                    },

                    {
                        label:
                            "FOCUS",

                        value:
                            "—"
                    },

                    {
                        label:
                            "CURRENT",

                        value:
                            "—"
                    }

                ]

            }

        ];


        /* =====================================================
           DOM
        ===================================================== */

        const profile =
            document.getElementById(
                "profile"
            );

        const headerText =
            document.getElementById(
                "header-text"
            );

        const name =
            document.getElementById(
                "name"
            );

        const codename =
            document.getElementById(
                "codename"
            );

        const profileGrid =
            document.getElementById(
                "profile-grid"
            );

        const pageNumber =
            document.getElementById(
                "page-number"
            );


        let currentPage = 0;

        let pageChanging = false;


        /* =====================================================
           RENDER
        ===================================================== */

        function renderPage(index) {

            const data =
                pages[index];


            headerText.textContent =
                data.header;


            name.textContent =
                data.name;


            codename.textContent =
                data.codename;


            profileGrid.innerHTML =
                "";


            data.rows.forEach(
                row => {

                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "info";


                    item.innerHTML = `

                        <div class="info-label">
                            ${row.label}
                        </div>

                        <div class="info-value">
                            ${row.value}
                        </div>

                    `;


                    profileGrid.appendChild(
                        item
                    );

                }
            );


            pageNumber.textContent =
                `${String(index + 1).padStart(2,"0")} / ${String(pages.length).padStart(2,"0")}`;

        }


        /* =====================================================
           PAGE SWITCH
        ===================================================== */

        function switchPage(direction) {

            if (pageChanging)
                return;


            pageChanging = true;


            if (
                window.playInterfaceSfx
            ) {

                window.playInterfaceSfx(
                    "page"
                );

            }


            const outX =
                direction === "next"
                    ? -52
                    : 52;


            const inX =
                direction === "next"
                    ? 52
                    : -52;


            profile.style.transition =
                "opacity .22s ease, transform .35s cubic-bezier(.22,1,.36,1), filter .22s ease";


            profile.style.opacity =
                "0";


            profile.style.filter =
                "blur(6px)";


            profile.style.transform =
                `translateX(${outX}px) scale(.965)`;


            setTimeout(
                () => {

                    if (
                        direction === "next"
                    ) {

                        currentPage =
                            (
                                currentPage + 1
                            )
                            % pages.length;

                    } else {

                        currentPage =
                            (
                                currentPage - 1 + pages.length
                            )
                            % pages.length;

                    }


                    renderPage(
                        currentPage
                    );


                    profile.style.transition =
                        "none";


                    profile.style.transform =
                        `translateX(${inX}px) scale(.965)`;


                    profile.style.opacity =
                        "0";


                    requestAnimationFrame(
                        () => {

                            requestAnimationFrame(
                                () => {

                                    profile.style.transition =
                                        "opacity .42s ease, transform .55s cubic-bezier(.22,1,.36,1), filter .42s ease";

                                    profile.style.opacity =
                                        "1";

                                    profile.style.filter =
                                        "blur(0)";

                                    profile.style.transform =
                                        "translateX(0) scale(1)";

                                }
                            );

                        }
                    );


                    setTimeout(
                        () => {

                            pageChanging =
                                false;

                        },
                        550
                    );


                },
                220
            );

        }


        /* =====================================================
           NAV
        ===================================================== */

        document
            .getElementById("btn-next")
            .addEventListener(
                "click",
                () => {

                    switchPage("next");

                }
            );


        document
            .getElementById("btn-prev")
            .addEventListener(
                "click",
                () => {

                    switchPage("prev");

                }
            );


        /* =====================================================
           KEYBOARD
        ===================================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "ArrowRight" ||
                    event.key.toLowerCase() === "d"
                ) {

                    switchPage("next");

                }


                if (
                    event.key === "ArrowLeft" ||
                    event.key.toLowerCase() === "a"
                ) {

                    switchPage("prev");

                }

            }
        );


        /* =====================================================
           TOUCH
        ===================================================== */

        let touchStartX = 0;


        profile.addEventListener(
            "touchstart",
            event => {

                touchStartX =
                    event.changedTouches[0]
                        .screenX;

            },
            {
                passive: true
            }
        );


        profile.addEventListener(
            "touchend",
            event => {

                const endX =
                    event.changedTouches[0]
                        .screenX;

                const distance =
                    endX - touchStartX;


                if (
                    Math.abs(distance) < 50
                )
                    return;


                if (distance < 0) {

                    switchPage("next");

                } else {

                    switchPage("prev");

                }

            },
            {
                passive: true
            }
        );


        /* =====================================================
           MOUSE LIGHT
        ===================================================== */

        document.addEventListener(
            "mousemove",
            event => {

                const x =
                    (
                        event.clientX /
                        window.innerWidth
                    ) * 100;


                const y =
                    (
                        event.clientY /
                        window.innerHeight
                    ) * 100;


                document.documentElement
                    .style.setProperty(
                        "--mx",
                        `${x}%`
                    );


                document.documentElement
                    .style.setProperty(
                        "--my",
                        `${y}%`
                    );

            }
        );


        /* =====================================================
           BACKGROUND RANDOM DRIFT
        ===================================================== */

        let bgX = 0;
        let bgY = 0;

        let targetX = 0;
        let targetY = 0;


        function chooseBackgroundTarget() {

            targetX =
                (
                    Math.random() - .5
                ) * 2.4;


            targetY =
                (
                    Math.random() - .5
                ) * 1.8;

        }


        function animateBackground() {

            bgX +=
                (targetX - bgX)
                * .0019;


            bgY +=
                (targetY - bgY)
                * .0019;


            document
                .getElementById("background")
                .style.transform =
                    `
                    scale(1.16)
                    translate3d(
                        ${bgX}%,
                        ${bgY}%,
                        0
                    )
                    `;


            requestAnimationFrame(
                animateBackground
            );

        }


        chooseBackgroundTarget();

        animateBackground();


        setInterval(
            chooseBackgroundTarget,
            8500 + Math.random() * 5000
        );


        /* =====================================================
           VFX PARTICLES
        ===================================================== */

        const canvas =
            document.getElementById(
                "vfx"
            );

        const ctx =
            canvas.getContext(
                "2d"
            );


        let width =
            window.innerWidth;

        let height =
            window.innerHeight;


        function resizeVFX() {

            width =
                canvas.width =
                window.innerWidth;


            height =
                canvas.height =
                window.innerHeight;

        }


        window.addEventListener(
            "resize",
            resizeVFX
        );


        resizeVFX();


        const particles = [];


        class Particle {

            constructor() {

                this.reset(
                    true
                );

            }


            reset(initial = false) {

                this.x =
                    Math.random()
                    * width;


                this.y =
                    initial
                        ? Math.random()
                            * height
                        : height + 20;


                this.size =
                    Math.random()
                    * 1.5
                    + .3;


                this.speed =
                    Math.random()
                    * .17
                    + .035;


                this.alpha =
                    Math.random()
                    * .32
                    + .07;


                this.phase =
                    Math.random()
                    * Math.PI
                    * 2;


                this.drift =
                    (
                        Math.random()
                        - .5
                    ) * .12;

            }


            update(time) {

                this.y -=
                    this.speed;


                this.x +=
                    this.drift;


                this.x +=
                    Math.sin(
                        time * .0003 +
                        this.phase
                    ) * .018;


                if (
                    this.y <
                    -30
                ) {

                    this.reset();

                }

            }


            draw() {

                ctx.beginPath();


                ctx.arc(
                    this.x,
                    this.y,
                    this.size,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    `
                    rgba(
                        255,
                        255,
                        255,
                        ${this.alpha}
                    )
                    `;


                ctx.fill();

            }

        }


        for (
            let i = 0;
            i < 45;
            i++
        ) {

            particles.push(
                new Particle()
            );

        }


        function particleLoop(time) {

            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            particles.forEach(
                particle => {

                    particle.update(
                        time
                    );

                    particle.draw();

                }
            );


            requestAnimationFrame(
                particleLoop
            );

        }


        requestAnimationFrame(
            particleLoop
        );


        /* =====================================================
           CLICK VFX
        ===================================================== */

        const clickBursts = [];


        document.addEventListener(
            "pointerdown",
            event => {

                const burst = {

                    x:
                        event.clientX,

                    y:
                        event.clientY,

                    time:
                        performance.now(),

                    life:
                        700

                };


                clickBursts.push(
                    burst
                );


                if (
                    window.playInterfaceSfx
                ) {

                    window.playInterfaceSfx(
                        "click"
                    );

                }

            }
        );


        function drawClickBursts() {

            const now =
                performance.now();


            for (
                let i =
                    clickBursts.length - 1;
                i >= 0;
                i--
            ) {

                const burst =
                    clickBursts[i];


                const progress =
                    (
                        now -
                        burst.time
                    )
                    / burst.life;


                if (
                    progress >= 1
                ) {

                    clickBursts.splice(
                        i,
                        1
                    );

                    continue;

                }


                const radius =
                    12 +
                    progress * 90;


                const alpha =
                    1 - progress;


                ctx.beginPath();


                ctx.arc(
                    burst.x,
                    burst.y,
                    radius,
                    0,
                    Math.PI * 2
                );


                ctx.strokeStyle =
                    `
                    rgba(
                        255,
                        255,
                        255,
                        ${alpha * .65}
                    )
                    `;


                ctx.lineWidth =
                    1.5;


                ctx.stroke();


                ctx.beginPath();


                ctx.arc(
                    burst.x,
                    burst.y,
                    radius * .6,
                    0,
                    Math.PI * 2
                );


                ctx.strokeStyle =
                    `
                    rgba(
                        89,
                        204,
                        247,
                        ${alpha * .55}
                    )
                    `;


                ctx.lineWidth =
                    1;


                ctx.stroke();

            }

        }


        function clickLoop() {

            drawClickBursts();

            requestAnimationFrame(
                clickLoop
            );

        }


        clickLoop();


        /* =====================================================
           RENDER INITIAL
        ===================================================== */

        renderPage(0);


        /* =====================================================
           BOOT
        ===================================================== */

        const boot =
            document.getElementById(
                "boot"
            );

        const enterPrompt =
            document.getElementById(
                "enter-prompt"
            );


        let entered =
            false;


        function enterSite() {

            if (entered)
                return;


            entered = true;


            if (
                window.startMusic
            ) {

                window.startMusic();

            }


            if (
                window.resumeInterfaceAudio
            ) {

                window.resumeInterfaceAudio();

            }


            boot.classList.add(
                "complete"
            );


            if (
                window.playInterfaceSfx
            ) {

                window.playInterfaceSfx(
                    "boot"
                );

            }


            enterPrompt.classList.remove(
                "show"
            );


            setTimeout(
                () => {

                    boot.classList.add(
                        "hide"
                    );

                    document.body.classList.add(
                        "entered"
                    );

                },
                650
            );


            setTimeout(
                () => {

                    boot.remove();

                },
                1700
            );

        }


        /*
         * 先展示開機核心
         */

        setTimeout(
            () => {

                enterPrompt.classList.add(
                    "show"
                );

            },
            2300
        );


        /*
         * 點任意地方開始
         */

        document.addEventListener(
            "pointerdown",
            event => {

                /*
                 * 開機層還在時
                 * 第一次點擊才進入
                 */

                if (
                    !entered
                ) {

                    enterSite();

                }

            },
            {
                passive: true
            }
        );


    </script>


    <script src="music_module.js"></script>

</body>

</html>
