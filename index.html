<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>WND</title>

    <link
        rel="icon"
        href="https://shared.fastly.steamstatic.com/community_assets/images/apps/1256670/6aae1f276e95e65de99d6ffea75f010167d5d0c6.jpg"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================================================
           ROOT
        ========================================================= */

        :root {

            --blue:
                #64d3fa;

            --blue-bright:
                #b9efff;

            --blue-dark:
                #3b92b5;

            --text:
                #3e5b6b;

            --muted:
                #7c98a8;

            --mx:
                50%;

            --my:
                50%;

        }


        /* =========================================================
           RESET
        ========================================================= */

        * {

            box-sizing:
                border-box;

        }


        html,
        body {

            width:
                100%;

            height:
                100%;

            margin:
                0;

            padding:
                0;

        }


        body {

            overflow:
                hidden;

            position:
                relative;

            font-family:
                "Barlow",
                "Noto Sans TC",
                sans-serif;

            color:
                var(--text);

            background:
                #bcecff;

            user-select:
                none;

            -webkit-tap-highlight-color:
                transparent;

        }


        /* =========================================================
           BACKGROUND
        ========================================================= */

        .background {

            position:
                fixed;

            /*
             * 超大安全區。
             * 背景怎麼移都不會露出白邊。
             */

            inset:
                -14%;

            z-index:
                0;

            background-image:

                linear-gradient(
                    rgba(218,246,255,.035),
                    rgba(211,243,255,.15)
                ),

                url("maxresdefault.jpg");

            background-size:
                cover;

            background-position:
                center center;

            transform:
                scale(1.18);

            will-change:
                transform;

        }


        /* =========================================================
           BACKGROUND LIGHT
        ========================================================= */

        .background-light {

            position:
                fixed;

            inset:
                0;

            z-index:
                1;

            pointer-events:
                none;

            background:

                radial-gradient(
                    circle 460px at var(--mx) var(--my),
                    rgba(255,255,255,.18),
                    transparent 72%
                );

        }


        /* =========================================================
           VIGNETTE
        ========================================================= */

        .vignette {

            position:
                fixed;

            inset:
                0;

            z-index:
                2;

            pointer-events:
                none;

            background:

                radial-gradient(
                    ellipse at center,
                    transparent 15%,
                    rgba(53,112,137,.13) 100%
                );

        }


        /* =========================================================
           GRID
        ========================================================= */

        .grid {

            position:
                fixed;

            inset:
                0;

            z-index:
                3;

            pointer-events:
                none;

            opacity:
                .085;

            background-image:

                linear-gradient(
                    rgba(255,255,255,.24) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,.24) 1px,
                    transparent 1px
                );

            background-size:
                68px 68px;

            mask-image:
                radial-gradient(
                    ellipse at center,
                    black,
                    transparent 82%
                );

            -webkit-mask-image:
                radial-gradient(
                    ellipse at center,
                    black,
                    transparent 82%
                );

        }


        /* =========================================================
           BACK PARTICLES
        ========================================================= */

        #particles-back {

            position:
                fixed;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            z-index:
                4;

            pointer-events:
                none;

        }


        /* =========================================================
           TOP UI
        ========================================================= */

        .top-ui {

            position:
                fixed;

            top:
                23px;

            left:
                30px;

            right:
                30px;

            z-index:
                25;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            pointer-events:
                none;

        }


        .brand {

            display:
                flex;

            align-items:
                center;

            gap:
                11px;

            color:
                rgba(40,88,111,.74);

            font-size:
                11px;

            font-weight:
                800;

            letter-spacing:
                3px;

        }


        .brand-dot {

            width:
                9px;

            height:
                9px;

            border-radius:
                50%;

            background:
                white;

            border:
                2px solid
                var(--blue);

            box-shadow:
                0 0 14px
                rgba(100,211,250,.9);

            animation:
                brandPulse
                2.7s
                ease-in-out
                infinite;

        }


        @keyframes brandPulse {

            0%,
            100% {

                transform:
                    scale(.82);

                opacity:
                    .68;

            }

            50% {

                transform:
                    scale(1.15);

                opacity:
                    1;

            }

        }


        .top-info {

            display:
                flex;

            flex-direction:
                column;

            align-items:
                flex-end;

            gap:
                4px;

            color:
                rgba(40,88,111,.50);

            font-size:
                9px;

            font-weight:
                600;

            letter-spacing:
                2px;

        }


        /* =========================================================
           SIDE HUD
        ========================================================= */

        .side-hud {

            position:
                fixed;

            left:
                27px;

            top:
                50%;

            transform:
                translateY(-50%);

            z-index:
                20;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            gap:
                11px;

            opacity:
                .48;

            pointer-events:
                none;

        }


        .side-line {

            width:
                1px;

            height:
                68px;

            background:

                linear-gradient(
                    to bottom,
                    transparent,
                    var(--blue),
                    transparent
                );

        }


        .side-text {

            writing-mode:
                vertical-rl;

            color:
                #528da6;

            font-size:
                8px;

            letter-spacing:
                3px;

        }


        /* =========================================================
           MAIN
        ========================================================= */

        .main {

            position:
                relative;

            z-index:
                10;

            width:
                100%;

            height:
                100%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                70px 24px;

        }


        /* =========================================================
           MAIN PANEL
        ========================================================= */

        .profile {

            position:
                relative;

            width:
                min(700px,88vw);

            min-height:
                455px;

            padding:
                41px 45px 47px;

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,.84),
                    rgba(247,253,255,.63)
                );

            border:
                1px solid
                rgba(255,255,255,.96);

            box-shadow:

                0 30px 90px
                rgba(46,110,140,.24),

                0 5px 20px
                rgba(46,110,140,.11);

            backdrop-filter:
                blur(19px)
                saturate(125%);

            -webkit-backdrop-filter:
                blur(19px)
                saturate(125%);

            overflow:
                hidden;

            opacity:
                0;

            transform:
                translateY(18px)
                scale(.975);

            transition:

                opacity
                .85s
                cubic-bezier(.22,1,.36,1),

                transform
                .85s
                cubic-bezier(.22,1,.36,1);

        }


        body.entered .profile {

            opacity:
                1;

            transform:
                translateY(0)
                scale(1);

        }


        /* =========================================================
           PANEL LIGHT
        ========================================================= */

        .profile-light {

            position:
                absolute;

            inset:
                0;

            z-index:
                1;

            pointer-events:
                none;

            background:

                radial-gradient(
                    circle 370px at var(--mx) var(--my),
                    rgba(255,255,255,.20),
                    transparent 70%
                );

        }


        /* =========================================================
           PANEL SHINE
        ========================================================= */

        .profile::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            left:
                0;

            width:
                100%;

            height:
                4px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    #73ddff 20%,
                    white 50%,
                    #73ddff 80%,
                    transparent
                );

            animation:
                panelShine
                4.5s
                ease-in-out
                infinite;

            pointer-events:
                none;

        }


        @keyframes panelShine {

            0%,
            100% {

                opacity:
                    .52;

            }

            50% {

                opacity:
                    1;

            }

        }


        /* =========================================================
           CORNERS
        ========================================================= */

        .corner {

            position:
                absolute;

            width:
                23px;

            height:
                23px;

            z-index:
                15;

            opacity:
                .60;

            pointer-events:
                none;

        }


        .corner::before,
        .corner::after {

            content:
                "";

            position:
                absolute;

            background:
                var(--blue);

        }


        .corner::before {

            width:
                100%;

            height:
                1px;

        }


        .corner::after {

            width:
                1px;

            height:
                100%;

        }


        .corner-tl {

            top:
                16px;

            left:
                16px;

        }


        .corner-tr {

            top:
                16px;

            right:
                16px;

            transform:
                rotate(90deg);

        }


        .corner-bl {

            bottom:
                16px;

            left:
                16px;

            transform:
                rotate(-90deg);

        }


        .corner-br {

            bottom:
                16px;

            right:
                16px;

            transform:
                rotate(180deg);

        }


        /* =========================================================
           PAGE CONTENT
        ========================================================= */

        .page-content {

            position:
                relative;

            z-index:
                5;

        }


        /* =========================================================
           HEADER
        ========================================================= */

        .section-header {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

        }


        .section-dot {

            width:
                7px;

            height:
                7px;

            border-radius:
                50%;

            background:
                var(--blue);

            box-shadow:
                0 0 12px
                rgba(100,211,250,.85);

            animation:
                sectionDot
                2.4s
                ease-in-out
                infinite;

        }


        @keyframes sectionDot {

            0%,
            100% {

                opacity:
                    .55;

            }

            50% {

                opacity:
                    1;

            }

        }


        .section-line {

            width:
                35px;

            height:
                1px;

            background:
                var(--blue);

        }


        .section-label {

            color:
                var(--blue-dark);

            font-size:
                10px;

            font-weight:
                800;

            letter-spacing:
                2.5px;

        }


        /* =========================================================
           TITLE
        ========================================================= */

        .title-row {

            margin-top:
                16px;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                flex-end;

        }


        .title {

            color:
                white;

            font-size:
                clamp(
                    53px,
                    9vw,
                    77px
                );

            font-weight:
                800;

            line-height:
                .88;

            letter-spacing:
                -3px;

            text-shadow:
                0 4px 18px
                rgba(48,113,142,.30);

        }


        .page-tag {

            margin-bottom:
                5px;

            padding:
                7px 11px;

            color:
                #74919f;

            border:
                1px solid
                rgba(99,210,250,.29);

            background:
                rgba(255,255,255,.44);

            font-size:
                8px;

            font-weight:
                800;

            letter-spacing:
                1.5px;

        }


        /* =========================================================
           PAGE 1
        ========================================================= */

        .personal-layout {

            margin-top:
                30px;

        }


        .personal-grid {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                10px;

        }


        .personal-item {

            position:
                relative;

            min-height:
                73px;

            padding:
                13px 15px;

            background:
                rgba(255,255,255,.55);

            border:
                1px solid
                rgba(255,255,255,.92);

            overflow:
                hidden;

            transition:
                transform .2s ease,
                background .2s ease,
                border-color .2s ease;

        }


        .personal-item:hover {

            transform:
                translateY(-3px);

            background:
                rgba(255,255,255,.78);

            border-color:
                rgba(99,210,250,.35);

        }


        .personal-item::before {

            content:
                "";

            position:
                absolute;

            left:
                0;

            top:
                0;

            width:
                3px;

            height:
                100%;

            background:
                var(--blue);

            transform:
                scaleY(.20);

            transition:
                transform .2s ease;

        }


        .personal-item:hover::before {

            transform:
                scaleY(1);

        }


        .item-label {

            margin-bottom:
                6px;

            color:
                #819ba8;

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1.5px;

        }


        .item-value {

            color:
                #425d6c;

            font-size:
                14px;

            font-weight:
                600;

        }


        .description {

            margin-top:
                10px;

            min-height:
                88px;

            padding:
                14px 16px;

            background:
                rgba(255,255,255,.47);

            border:
                1px solid
                rgba(255,255,255,.90);

        }


        /* =========================================================
           PAGE 2
        ========================================================= */

        .favorites-layout {

            margin-top:
                29px;

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                10px;

        }


        .favorite {

            min-height:
                108px;

            padding:
                16px;

            background:
                rgba(255,255,255,.55);

            border:
                1px solid
                rgba(255,255,255,.92);

            transition:
                transform .2s ease,
                background .2s ease;

        }


        .favorite:hover {

            transform:
                translateY(-3px);

            background:
                rgba(255,255,255,.80);

        }


        .favorite.wide {

            grid-column:
                1 / -1;

            min-height:
                73px;

        }


        .favorite-symbol {

            width:
                28px;

            height:
                28px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            margin-bottom:
                10px;

            color:
                var(--blue-dark);

            border:
                1px solid
                rgba(99,210,250,.30);

            background:
                rgba(255,255,255,.45);

            font-size:
                12px;

        }


        .favorite.wide .favorite-symbol {

            float:
                left;

            margin-right:
                12px;

            margin-bottom:
                0;

        }


        .favorite-label {

            color:
                #819aa8;

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1.5px;

        }


        .favorite-value {

            margin-top:
                6px;

            color:
                #425d6c;

            font-size:
                14px;

            font-weight:
                700;

        }


        .favorite-sub {

            margin-top:
                4px;

            color:
                #8ba0ac;

            font-size:
                9px;

        }


        /* =========================================================
           PAGE 3
        ========================================================= */

        .works-layout {

            margin-top:
                29px;

            display:
                flex;

            flex-direction:
                column;

            gap:
                8px;

        }


        .work {

            display:
                grid;

            grid-template-columns:
                38px 1fr auto;

            align-items:
                center;

            min-height:
                63px;

            padding:
                9px 13px;

            background:
                rgba(255,255,255,.54);

            border:
                1px solid
                rgba(255,255,255,.91);

            transition:
                transform .2s ease,
                background .2s ease;

        }


        .work:hover {

            transform:
                translateX(5px);

            background:
                rgba(255,255,255,.80);

        }


        .work-index {

            color:
                var(--blue-dark);

            font-size:
                9px;

            font-weight:
                800;

        }


        .work-name {

            color:
                #435e6d;

            font-size:
                13px;

            font-weight:
                700;

        }


        .work-description {

            margin-top:
                3px;

            color:
                #8ba1ad;

            font-size:
                9px;

        }


        .work-state {

            padding:
                5px 8px;

            color:
                #6194a8;

            background:
                rgba(99,210,250,.10);

            border:
                1px solid
                rgba(99,210,250,.22);

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1px;

        }


        /* =========================================================
           PAGE NUMBER
        ========================================================= */

        .page-number {

            position:
                absolute;

            right:
                28px;

            bottom:
                19px;

            z-index:
                15;

            color:
                #7895a4;

            font-size:
                9px;

            font-weight:
                700;

            letter-spacing:
                2px;

        }


        /* =========================================================
           PAGE SCAN
        ========================================================= */

        .page-scan {

            position:
                absolute;

            top:
                0;

            left:
                -5%;

            width:
                2px;

            height:
                100%;

            opacity:
                0;

            z-index:
                20;

            pointer-events:
                none;

            background:

                linear-gradient(
                    to bottom,
                    transparent,
                    rgba(106,220,255,.95),
                    transparent
                );

        }


        .page-scan.active {

            animation:
                pageScan
                .55s
                ease-out
                forwards;

        }


        @keyframes pageScan {

            0% {

                left:
                    -5%;

                opacity:
                    0;

            }

            15% {

                opacity:
                    .85;

            }

            100% {

                left:
                    105%;

                opacity:
                    0;

            }

        }


        /* =========================================================
           FRONT PARTICLES
        ========================================================= */

        #particles-front {

            position:
                fixed;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            z-index:
                60;

            pointer-events:
                none;

        }


        /* =========================================================
           NAV BUTTONS
        ========================================================= */

        .nav {

            position:
                fixed;

            top:
                50%;

            z-index:
                70;

            width:
                53px;

            height:
                53px;

            transform:
                translateY(-50%);

            border:
                1px solid
                rgba(255,255,255,.95);

            background:
                rgba(255,255,255,.64);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            box-shadow:
                0 12px 32px
                rgba(50,114,143,.18);

            color:
                var(--blue-dark);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            cursor:
                pointer;

            opacity:
                0;

            transition:
                opacity .8s ease,
                transform .2s ease,
                background .2s ease;

        }


        body.entered .nav {

            opacity:
                1;

        }


        .nav:hover {

            background:
                rgba(255,255,255,.94);

        }


        .nav:active {

            transform:
                translateY(-50%)
                scale(.88);

        }


        .nav-left {

            left:
                24px;

        }


        .nav-right {

            right:
                24px;

        }


        .arrow {

            width:
                10px;

            height:
                10px;

            border-top:
                2px solid
                currentColor;

            border-right:
                2px solid
                currentColor;

        }


        .arrow-left {

            transform:
                rotate(-135deg);

            margin-left:
                4px;

        }


        .arrow-right {

            transform:
                rotate(45deg);

            margin-right:
                4px;

        }


        /* =========================================================
           MUSIC BUTTON
        ========================================================= */

        .music-button {

            position:
                fixed;

            right:
                27px;

            bottom:
                24px;

            width:
                48px;

            height:
                48px;

            z-index:
                130;

            border:
                1px solid
                rgba(255,255,255,.96);

            background:
                rgba(255,255,255,.80);

            color:
                var(--blue-dark);

            box-shadow:
                0 10px 30px
                rgba(50,114,143,.18);

            cursor:
                pointer;

            font-size:
                17px;

            transition:
                all .2s ease;

        }


        .music-button:hover {

            transform:
                translateY(-3px);

            background:
                white;

        }


        .music-button.playing {

            color:
                white;

            background:
                var(--blue);

            box-shadow:

                0 0 0 5px
                rgba(99,210,250,.12),

                0 10px 30px
                rgba(50,114,143,.22);

        }


        /* =========================================================
           MUSIC PANEL
        ========================================================= */

        .music-panel {

            position:
                fixed;

            right:
                27px;

            bottom:
                82px;

            z-index:
                129;

            width:
                375px;

            max-width:
                calc(100vw - 30px);

            background:

                linear-gradient(
                    145deg,
                    rgba(247,253,255,.96),
                    rgba(225,246,254,.91)
                );

            border:
                1px solid
                rgba(255,255,255,.98);

            box-shadow:

                0 25px 70px
                rgba(47,108,137,.25),

                0 4px 20px
                rgba(47,108,137,.10);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            overflow:
                hidden;

            display:
                none;

        }


        .music-panel.open {

            display:
                block;

            animation:
                musicPanelOpen
                .25s
                cubic-bezier(.22,1,.36,1);

        }


        @keyframes musicPanelOpen {

            from {

                opacity:
                    0;

                transform:
                    translateY(12px)
                    scale(.97);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        .music-header {

            padding:
                15px 16px 13px;

            border-bottom:
                1px solid
                rgba(84,190,225,.16);

        }


        .music-header-row {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

        }


        .music-title {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            color:
                var(--blue-dark);

            font-size:
                10px;

            font-weight:
                800;

            letter-spacing:
                2px;

        }


        .music-title-dot {

            width:
                6px;

            height:
                6px;

            border-radius:
                50%;

            background:
                var(--blue);

            box-shadow:
                0 0 9px
                rgba(99,210,250,.75);

        }


        .music-player-state {

            display:
                flex;

            align-items:
                center;

            gap:
                5px;

            color:
                #7d96a2;

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1px;

        }


        .state-dot {

            width:
                6px;

            height:
                6px;

            border-radius:
                50%;

            background:
                #a3b6bf;

        }


        .music-panel.playing .state-dot {

            background:
                var(--blue);

            box-shadow:
                0 0 8px
                rgba(99,210,250,.80);

        }


        .now-label {

            margin-top:
                12px;

            color:
                #8ca1ad;

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1.5px;

        }


        .now-playing {

            margin-top:
                4px;

            color:
                #486474;

            font-size:
                13px;

            font-weight:
                700;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        /* =========================================================
           EQUALIZER
        ========================================================= */

        .equalizer {

            height:
                24px;

            margin-top:
                8px;

            display:
                flex;

            align-items:
                flex-end;

            gap:
                3px;

        }


        .equalizer span {

            width:
                3px;

            height:
                4px;

            border-radius:
                3px;

            background:
                var(--blue);

            opacity:
                .72;

            animation:
                equalizer
                .95s
                ease-in-out
                infinite;

            animation-play-state:
                paused;

        }


        .music-panel.playing
        .equalizer span {

            animation-play-state:
                running;

        }


        .equalizer span:nth-child(2) {
            animation-delay:
                .12s;
        }

        .equalizer span:nth-child(3) {
            animation-delay:
                .24s;
        }

        .equalizer span:nth-child(4) {
            animation-delay:
                .36s;
        }

        .equalizer span:nth-child(5) {
            animation-delay:
                .48s;
        }

        .equalizer span:nth-child(6) {
            animation-delay:
                .60s;
        }

        .equalizer span:nth-child(7) {
            animation-delay:
                .72s;
        }


        @keyframes equalizer {

            0%,
            100% {

                height:
                    4px;

            }

            50% {

                height:
                    20px;

            }

        }


        /* =========================================================
           MUSIC CONTROLS
        ========================================================= */

        .music-controls {

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                12px;

            margin-top:
                5px;

        }


        .music-control {

            width:
                34px;

            height:
                34px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border:
                1px solid
                rgba(99,210,250,.28);

            background:
                rgba(255,255,255,.55);

            color:
                #4d839a;

            cursor:
                pointer;

            font-family:
                inherit;

            font-size:
                16px;

            transition:
                all .18s ease;

        }


        .music-control:hover {

            transform:
                translateY(-2px);

            background:
                rgba(99,210,250,.16);

        }


        .music-control.main {

            width:
                43px;

            height:
                43px;

            border:
                none;

            border-radius:
                50%;

            background:
                var(--blue);

            color:
                white;

            box-shadow:
                0 0 18px
                rgba(99,210,250,.25);

        }


        /* =========================================================
           TRACK LIST
        ========================================================= */

        .music-list {

            max-height:
                215px;

            overflow-y:
                auto;

        }


        .music-list::-webkit-scrollbar {

            width:
                5px;

        }


        .music-list::-webkit-scrollbar-thumb {

            background:
                rgba(99,210,250,.27);

            border-radius:
                5px;

        }


        .track {

            display:
                grid;

            grid-template-columns:
                29px 1fr 25px;

            align-items:
                center;

            gap:
                8px;

            min-height:
                49px;

            padding:
                8px 12px;

            border-bottom:
                1px solid
                rgba(65,122,145,.07);

            cursor:
                pointer;

            transition:
                background .18s ease;

        }


        .track:hover {

            background:
                rgba(255,255,255,.48);

        }


        .track.active {

            background:
                rgba(99,210,250,.12);

        }


        .track-number {

            color:
                #91a6b1;

            font-size:
                8px;

            font-weight:
                800;

        }


        .track.active .track-number {

            color:
                var(--blue-dark);

        }


        .track-name {

            min-width:
                0;

            overflow:
                hidden;

            white-space:
                nowrap;

            text-overflow:
                ellipsis;

            color:
                #617b89;

            font-size:
                11px;

            font-weight:
                600;

        }


        .track.active .track-name {

            color:
                var(--blue-dark);

        }


        .track-remove {

            width:
                24px;

            height:
                24px;

            border:
                none;

            background:
                transparent;

            color:
                rgba(88,123,139,.38);

            cursor:
                pointer;

            opacity:
                0;

            transition:
                all .18s ease;

        }


        .track:hover
        .track-remove {

            opacity:
                1;

        }


        .track-remove:hover {

            color:
                #dc6b6b;

        }


        /* =========================================================
           MUSIC ADD
        ========================================================= */

        .music-add {

            display:
                flex;

            gap:
                7px;

            padding:
                10px;

            border-top:
                1px solid
                rgba(83,187,224,.15);

        }


        .music-add input {

            flex:
                1;

            min-width:
                0;

            height:
                34px;

            padding:
                0 10px;

            border:
                1px solid
                rgba(99,210,250,.24);

            outline:
                none;

            background:
                rgba(255,255,255,.68);

            color:
                #4a6675;

            font-family:
                inherit;

            font-size:
                10px;

        }


        .music-add input:focus {

            border-color:
                rgba(99,210,250,.70);

        }


        .music-add button {

            width:
                46px;

            border:
                1px solid
                var(--blue);

            background:
                rgba(99,210,250,.11);

            color:
                var(--blue-dark);

            cursor:
                pointer;

            font-family:
                inherit;

            font-size:
                10px;

            font-weight:
                800;

        }


        .music-add button:hover {

            background:
                var(--blue);

            color:
                white;

        }


        /* =========================================================
           BOOT SCREEN
        ========================================================= */

        #boot {

            position:
                fixed;

            inset:
                0;

            z-index:
                10000;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:

                radial-gradient(
                    circle at center,
                    #f1fcff 0%,
                    #ccefff 48%,
                    #a5def6 100%
                );

            opacity:
                1;

            pointer-events:
                auto;

            cursor:
                pointer;

            transition:
                opacity
                1s
                ease;

        }


        /*
         * 注意：
         *
         * Boot 裡面全部可以接受 pointer。
         * 不會再有「球不能點」的問題。
         */

        #boot,
        #boot *,
        #boot .boot-system,
        #boot .boot-core {

            pointer-events:
                auto;

        }


        #boot.hide {

            opacity:
                0;

            pointer-events:
                none;

        }


        /* =========================================================
           BOOT SYSTEM
        ========================================================= */

        .boot-system {

            position:
                relative;

            width:
                320px;

            height:
                320px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            cursor:
                pointer;

            touch-action:
                manipulation;

        }


        /* =========================================================
           BOOT HALOS
        ========================================================= */

        .boot-halo {

            position:
                absolute;

            border-radius:
                50%;

            border:
                1px solid
                rgba(255,255,255,.78);

            opacity:
                0;

            pointer-events:
                none;

            /*
             * Halo 永遠不吃 pointer。
             * 事件直接由 #boot 接。
             */

        }


        .boot-halo-1 {

            width:
                130px;

            height:
                130px;

            animation:

                bootHaloIn
                1.1s
                .10s
                forwards,

                bootHaloRotateA
                12s
                1.2s
                linear
                infinite;

        }


        .boot-halo-2 {

            width:
                198px;

            height:
                198px;

            border-style:
                dashed;

            animation:

                bootHaloIn
                1.2s
                .25s
                forwards,

                bootHaloRotateB
                17s
                1.4s
                linear
                infinite;

        }


        .boot-halo-3 {

            width:
                280px;

            height:
                280px;

            border-color:
                rgba(255,255,255,.36);

            animation:

                bootHaloIn
                1.4s
                .40s
                forwards,

                bootHaloRotateA
                25s
                1.65s
                linear
                infinite;

        }


        @keyframes bootHaloIn {

            from {

                opacity:
                    0;

                transform:
                    scale(.20);

            }

            to {

                opacity:
                    .68;

                transform:
                    scale(1);

            }

        }


        /*
         * 這裡不能用同一個
         * transform 動畫去控制
         * hover 的縮放。
         *
         * 所以旋轉和縮放完全分開。
         */

        @keyframes bootHaloRotateA {

            from {

                transform:
                    rotate(0deg);

            }

            to {

                transform:
                    rotate(360deg);

            }

        }


        @keyframes bootHaloRotateB {

            from {

                transform:
                    rotate(0deg);

            }

            to {

                transform:
                    rotate(-360deg);

            }

        }


        /* =========================================================
           BOOT CORE
        ========================================================= */

        .boot-core {

            position:
                relative;

            z-index:
                100;

            width:
                72px;

            height:
                72px;

            flex-shrink:
                0;

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle at 32% 28%,
                    #ffffff 0%,
                    #ffffff 40%,
                    #bceeff 100%
                );

            /*
             * 初始只做一次出場 scale。
             */

            transform:
                scale(0);

            /*
             * 注意：
             *
             * Pulse 不再改 transform。
             *
             * 所以滑鼠靠近不會讓球縮小。
             */

            animation:

                bootCoreIn
                1s
                .18s
                cubic-bezier(.22,1,.36,1)
                forwards,

                bootCorePulse
                2.7s
                1.18s
                ease-in-out
                infinite;

            box-shadow:

                0 0 25px
                white,

                0 0 62px
                rgba(255,255,255,.95),

                0 0 115px
                rgba(99,210,250,.80);

            cursor:
                pointer;

            pointer-events:
                auto;

            /*
             * 防止某些瀏覽器
             * 將 pointer gesture 當成選取。
             */

            touch-action:
                manipulation;

        }


        /*
         * Core 裡面的 hover
         * 不再改大小。
         */

        .boot-core:hover {

            transform:
                scale(1) !important;

        }


        .boot-core:active {

            transform:
                scale(.96) !important;

        }


        @keyframes bootCoreIn {

            0% {

                transform:
                    scale(0)
                    rotate(-25deg);

            }

            75% {

                transform:
                    scale(1.17)
                    rotate(5deg);

            }

            100% {

                transform:
                    scale(1)
                    rotate(0deg);

            }

        }


        /*
         * 非常重要：
         *
         * 這個 animation 完全不改 transform。
         */

        @keyframes bootCorePulse {

            0%,
            100% {

                box-shadow:

                    0 0 22px
                    white,

                    0 0 55px
                    rgba(255,255,255,.88),

                    0 0 95px
                    rgba(99,210,250,.58);

            }

            50% {

                box-shadow:

                    0 0 34px
                    white,

                    0 0 78px
                    rgba(255,255,255,1),

                    0 0 135px
                    rgba(99,210,250,.82);

            }

        }


        /*
         * 點擊爆發時：
         * 不使用 hover。
         */

        #boot.complete .boot-core {

            animation:
                bootCoreBurst
                .80s
                cubic-bezier(.22,1,.36,1)
                forwards;

        }


        @keyframes bootCoreBurst {

            0% {

                transform:
                    scale(1);

                opacity:
                    1;

            }

            30% {

                transform:
                    scale(1.55);

                opacity:
                    1;

            }

            100% {

                transform:
                    scale(28);

                opacity:
                    1;

            }

        }


        /* =========================================================
           BOOT LABEL
        ========================================================= */

        .boot-label {

            position:
                absolute;

            bottom:
                14%;

            color:
                rgba(50,104,127,.70);

            font-size:
                9px;

            font-weight:
                700;

            letter-spacing:
                4px;

            opacity:
                0;

            pointer-events:
                none;

            animation:
                bootText
                1s
                .65s
                forwards;

        }


        @keyframes bootText {

            from {

                opacity:
                    0;

                transform:
                    translateY(7px);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);

            }

        }


        /* =========================================================
           ENTER PROMPT
        ========================================================= */

        #enter-prompt {

            position:
                fixed;

            inset:
                0;

            z-index:
                9700;

            display:
                flex;

            justify-content:
                center;

            align-items:
                flex-end;

            padding-bottom:
                11vh;

            pointer-events:
                none;

            opacity:
                0;

            transition:
                opacity
                .8s
                ease;

        }


        #enter-prompt.show {

            opacity:
                1;

        }


        .enter {

            display:
                flex;

            align-items:
                center;

            gap:
                11px;

            color:
                rgba(49,101,122,.76);

            font-size:
                10px;

            font-weight:
                700;

            letter-spacing:
                3px;

            animation:
                enterFloat
                2.8s
                ease-in-out
                infinite;

        }


        @keyframes enterFloat {

            0%,
            100% {

                transform:
                    translateY(0);

                opacity:
                    .55;

            }

            50% {

                transform:
                    translateY(-4px);

                opacity:
                    1;

            }

        }


        .enter-ring {

            width:
                40px;

            height:
                40px;

            border-radius:
                50%;

            border:
                1px solid
                rgba(99,210,250,.62);

            box-shadow:
                0 0 24px
                rgba(99,210,250,.23);

            position:
                relative;

        }


        .enter-ring::after {

            content:
                "";

            position:
                absolute;

            width:
                9px;

            height:
                9px;

            left:
                50%;

            top:
                50%;

            transform:
                translate(-50%,-50%)
                rotate(45deg);

            border:
                1px solid
                var(--blue-dark);

        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width:700px) {

            .top-ui {

                top:
                    17px;

                left:
                    15px;

                right:
                    15px;

            }


            .system-info {

                font-size:
                    8px;

            }


            .side-hud {

                display:
                    none;

            }


            .main {

                padding:
                    70px 18px 90px;

            }


            .profile {

                width:
                    90vw;

                min-height:
                    455px;

                padding:
                    39px 21px 47px;

            }


            .title-row {

                margin-top:
                    14px;

            }


            .page-tag {

                display:
                    none;

            }


            .title {

                font-size:
                    51px;

            }


            .personal-grid {

                grid-template-columns:
                    1fr;

                gap:
                    8px;

            }


            .personal-item {

                min-height:
                    62px;

            }


            .description {

                min-height:
                    78px;

            }


            .favorites-layout {

                grid-template-columns:
                    1fr;

            }


            .favorite.wide {

                grid-column:
                    auto;

            }


            .nav {

                width:
                    43px;

                height:
                    43px;

            }


            .nav-left {

                left:
                    7px;

            }


            .nav-right {

                right:
                    7px;

            }


            .music-button {

                right:
                    14px;

                bottom:
                    14px;

            }


            .music-panel {

                right:
                    15px;

                bottom:
                    72px;

                width:
                    calc(100vw - 30px);

            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         BACKGROUND
    ========================================================= -->

    <div
        class="background"
        id="background"
    ></div>


    <div
        class="background-light"
    ></div>


    <div
        class="vignette"
    ></div>


    <div
        class="grid"
    ></div>


    <!-- =========================================================
         BACK PARTICLES
    ========================================================= -->

    <canvas
        id="particles-back"
    ></canvas>


    <!-- =========================================================
         TOP UI
    ========================================================= -->

    <header
        class="top-ui"
    >

        <div
            class="brand"
        >

            <span
                class="brand-dot"
            ></span>

            <span>
                WND
            </span>

        </div>


        <div
            class="top-info"
        >

            <span>
                PERSONAL PROFILE
            </span>

            <span>
                SYSTEM // 01
            </span>

        </div>

    </header>


    <!-- =========================================================
         SIDE HUD
    ========================================================= -->

    <aside
        class="side-hud"
    >

        <div
            class="side-line"
        ></div>


        <div
            class="side-text"
        >
            PROFILE INTERFACE
        </div>


        <div
            class="side-line"
        ></div>

    </aside>


    <!-- =========================================================
         NAVIGATION
    ========================================================= -->

    <button
        class="nav nav-left"
        id="btn-prev"
        aria-label="Previous page"
    >

        <span
            class="arrow arrow-left"
        ></span>

    </button>


    <button
        class="nav nav-right"
        id="btn-next"
        aria-label="Next page"
    >

        <span
            class="arrow arrow-right"
        ></span>

    </button>


    <!-- =========================================================
         MAIN
    ========================================================= -->

    <main
        class="main"
    >

        <section
            class="profile"
            id="profile"
        >

            <div
                class="profile-light"
            ></div>


            <div
                class="corner corner-tl"
            ></div>

            <div
                class="corner corner-tr"
            ></div>

            <div
                class="corner corner-bl"
            ></div>

            <div
                class="corner corner-br"
            ></div>


            <div
                class="page-scan"
                id="page-scan"
            ></div>


            <div
                class="page-content"
                id="page-content"
            ></div>


            <div
                class="page-number"
                id="page-number"
            >
                01 / 03
            </div>

        </section>

    </main>


    <!-- =========================================================
         FRONT PARTICLES
    ========================================================= -->

    <canvas
        id="particles-front"
    ></canvas>


    <!-- =========================================================
         MUSIC BUTTON
    ========================================================= -->

    <button
        class="music-button"
        id="music-button"
        aria-label="Open music player"
    >
        ♫
    </button>


    <!-- =========================================================
         MUSIC PANEL
    ========================================================= -->

    <section
        class="music-panel"
        id="music-panel"
    >

        <div
            class="music-header"
        >

            <div
                class="music-header-row"
            >

                <div
                    class="music-title"
                >

                    <span
                        class="music-title-dot"
                    ></span>

                    SOUND SYSTEM

                </div>


                <div
                    class="music-player-state"
                >

                    <span
                        class="state-dot"
                    ></span>

                    PLAYER

                </div>

            </div>


            <div
                class="now-label"
            >
                NOW PLAYING
            </div>


            <div
                class="now-playing"
                id="now-playing"
            >
                —
            </div>


            <div
                class="equalizer"
            >

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <div
                class="music-controls"
            >

                <button
                    class="music-control"
                    id="prev-track"
                    aria-label="Previous track"
                >
                    ‹
                </button>


                <button
                    class="music-control main"
                    id="play-track"
                    aria-label="Play or pause"
                >
                    ▶
                </button>


                <button
                    class="music-control"
                    id="next-track"
                    aria-label="Next track"
                >
                    ›
                </button>

            </div>

        </div>


        <div
            class="music-list"
            id="music-list"
        ></div>


        <div
            class="music-add"
        >

            <input
                id="youtube-input"
                type="text"
                autocomplete="off"
                placeholder="Paste YouTube URL or ID..."
            >


            <button
                id="youtube-add"
                type="button"
            >
                ADD
            </button>

        </div>

    </section>


    <!-- =========================================================
         YOUTUBE PLAYER
    ========================================================= -->

    <div
        id="youtube-player"
        style="
            position:fixed;
            width:1px;

    <!-- =========================================================

    <script>

        /* =========================================================

                    },

                    }

            /* =====================================================

            ===================================================== */

            {

            /* =====================================================

            {

                type:
                    "works",

                title:

                tag:

                rows: [

                    {

        /* =========================================================

        let currentPage =

        /* =========================================================
           PAGE HEADER
        ========================================================= */

        function createHeader(
            data
        ) {

            const header =
                document.createElement(

                );


            header.innerHTML = `

                <div
                    class="section-header"
                >

                    <span
                        class="section-dot"

                    <span
                        class="section-line"
                    ></span>

                        class="section-label"

                <div
                    class="title-row"
                >

                    <div
                        class="title"
                    >
                        ${data.title}
                    </div>

                    <div
                        class="page-tag"
                    >
                        ${data.tag}
                    </div>

                </div>

            `;


            return header;

        }


        /* =========================================================
           RENDER PAGE
        ========================================================= */

        function renderPage(
            index
        ) {

            const data =
                pages[index];


            content.innerHTML =
                "";


            content.appendChild(
                createHeader(
                    data

            );


            /* =====================================================
               PERSONAL
            ===================================================== */

            if (
                data.type ===

                const layout =

                layout.className =

                const grid =
                    document.createElement(
                        "div"
                    );


                grid.className =
                    "personal-grid";


                data.rows.forEach(
                    row => {

                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "personal-item";


                        item.innerHTML = `

                                class="item-label"

                            >

                            </div>

                        `;


                        grid.appendChild(
                            item
                        );

                    }
                );


                const description =
                    document.createElement(
                        "div"

                description.className =
                    "description";


                description.innerHTML = `

                    <div
                        class="item-label"
                    >
                        DESCRIPTION
                    </div>

                    <div
                        class="item-value"
                    >
                        ${data.description}
                    </div>

                layout.appendChild(
                    grid
                );


                layout.appendChild(
                    description

                content.appendChild(
                    layout
                );

            }


            /* =====================================================

            if (

            ) {

                const layout =
                    document.createElement(
                        "div"

                layout.className =
                    "favorites-layout";


                data.rows.forEach(
                    row => {

                        const item =
                            document.createElement(

                        item.className =

                        if (

                        ) {

                            item.classList.add(

                        item.innerHTML = `

                            <div

                            >
                                ${row.label}
                            </div>

                            <div
                                class="favorite-value"
                            >
                                ${row.value}
                            </div>

                            <div
                                class="favorite-sub"
                            >
                                ${row.sub}
                            </div>

                        `;


                        layout.appendChild(
                            item
                        );

                    }
                );


                content.appendChild(
                    layout
                );

            }


            /* =====================================================
               WORKS
            ===================================================== */

            if (
                data.type ===
                "works"
            ) {

                const layout =
                    document.createElement(
                        "div"
                    );


                layout.className =
                    "works-layout";


                data.rows.forEach(
                    row => {

                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "work";


                        item.innerHTML = `

                            <div
                                class="work-index"
                            >
                                ${row.index}
                            </div>

                            <div>

                                <div
                                    class="work-name"
                                >

                                </div>

                                <div
                                    class="work-description"
                                >
                                    ${row.description}
                                </div>

                            <div
