                            >
                                ${row.state}
                            </div>

                        `;


                        layout.appendChild(
                            item
                        );

                    }
                );


                content.appendChild(
                    layout
                );

            }


            pageNumber.textContent =
                `${String(index + 1).padStart(2,"0")} / ${String(pages.length).padStart(2,"0")}`;

        }


        /* =========================================================
           PAGE SWITCH
        ========================================================= */

        function switchPage(
            direction
        ) {

            if (
                changingPage
            )
                return;


            changingPage =
                true;


            if (
                window.playInterfaceSfx
            ) {

                window.playInterfaceSfx(
                    "page"
                );

            }


            pageScan.classList.remove(
                "active"
            );


            void pageScan.offsetWidth;


            pageScan.classList.add(
                "active"
            );


            const outgoing =
                direction ===
                "next"
                    ? -72
                    : 72;


            const incoming =
                direction ===
                "next"
                    ? 72
                    : -72;


            profile.style.transition =
                `
                    opacity .24s ease,
                    transform .35s cubic-bezier(.22,1,.36,1),
                    filter .24s ease
                `;


            profile.style.opacity =
                "0";


            profile.style.filter =
                "blur(6px)";


            profile.style.transform =
                `
                    translateX(${outgoing}px)
                    scale(.965)
                `;


            setTimeout(
                () => {

                    if (
                        direction ===
                        "next"
                    ) {

                        currentPage =
                            (
                                currentPage +
                                1
                            )
                            %
                            pages.length;

                    } else {

                        currentPage =
                            (
                                currentPage -
                                1 +
                                pages.length
                            )
                            %
                            pages.length;

                    }


                    renderPage(
                        currentPage
                    );


                    profile.style.transition =
                        "none";


                    profile.style.opacity =
                        "0";


                    profile.style.filter =
                        "blur(6px)";


                    profile.style.transform =
                        `
                            translateX(${incoming}px)
                            scale(.965)
                        `;


                    requestAnimationFrame(
                        () => {

                            requestAnimationFrame(
                                () => {

                                    profile.style.transition =
                                        `
                                            opacity .45s ease,
                                            transform .58s cubic-bezier(.22,1,.36,1),
                                            filter .45s ease
                                        `;


                                    profile.style.opacity =
                                        "1";


                                    profile.style.filter =
                                        "blur(0)";


                                    profile.style.transform =
                                        `
                                            translateX(0)
                                            scale(1)
                                        `;

                                }
                            );

                        }
                    );


                    setTimeout(
                        () => {

                            changingPage =
                                false;

                        },
                        600
                    );

                },
                230
            );

        }


        /* =========================================================
           NAV
        ========================================================= */

        document
            .getElementById(
                "btn-next"
            )
            .addEventListener(
                "click",
                () => {

                    switchPage(
                        "next"
                    );

                }
            );


        document
            .getElementById(
                "btn-prev"
            )
            .addEventListener(
                "click",
                () => {

                    switchPage(
                        "prev"
                    );

                }
            );


        /* =========================================================
           KEYBOARD
        ========================================================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "ArrowRight" ||
                    event.key.toLowerCase() ===
                    "d"
                ) {

                    switchPage(
                        "next"
                    );

                }


                if (
                    event.key ===
                    "ArrowLeft" ||
                    event.key.toLowerCase() ===
                    "a"
                ) {

                    switchPage(
                        "prev"
                    );

                }

            }
        );


        /* =========================================================
           TOUCH SWIPE
        ========================================================= */

        let touchStartX =
            0;


        profile.addEventListener(
            "touchstart",
            event => {

                touchStartX =
                    event.changedTouches[0]
                        .screenX;

            },
            {
                passive:
                    true
            }
        );


        profile.addEventListener(
            "touchend",
            event => {

                const touchEndX =
                    event.changedTouches[0]
                        .screenX;


                const distance =
                    touchEndX -
                    touchStartX;


                if (
                    Math.abs(distance) <
                    50
                )
                    return;


                if (
                    distance < 0
                ) {

                    switchPage(
                        "next"
                    );

                } else {

                    switchPage(
                        "prev"
                    );

                }

            },
            {
                passive:
                    true
            }
        );


        /* =========================================================
           MOUSE PARALLAX
        ========================================================= */

        const background =
            document.getElementById(
                "background"
            );


        let mouseX =
            0;


        let mouseY =
            0;


        let smoothMouseX =
            0;


        let smoothMouseY =
            0;


        document.addEventListener(
            "mousemove",
            event => {

                mouseX =
                    event.clientX /
                    window.innerWidth
                    -
                    .5;


                mouseY =
                    event.clientY /
                    window.innerHeight
                    -
                    .5;


                document.documentElement
                    .style.setProperty(
                        "--mx",
                        `${event.clientX / window.innerWidth * 100}%`
                    );


                document.documentElement
                    .style.setProperty(
                        "--my",
                        `${event.clientY / window.innerHeight * 100}%`
                    );

            }
        );


        function animateBackground() {

            smoothMouseX +=
                (
                    mouseX -
                    smoothMouseX
                )
                *
                .024;


            smoothMouseY +=
                (
                    mouseY -
                    smoothMouseY
                )
                *
                .024;


            background.style.transform =
                `
                    scale(1.18)
                    translate3d(
                        ${smoothMouseX * 3.2}%,
                        ${smoothMouseY * 2.5}%,
                        0
                    )
                `;


            requestAnimationFrame(
                animateBackground
            );

        }


        animateBackground();


        /* =========================================================
           PARTICLE ENGINE
        ========================================================= */

        const backCanvas =
            document.getElementById(
                "particles-back"
            );


        const frontCanvas =
            document.getElementById(
                "particles-front"
            );


        const backCtx =
            backCanvas.getContext(
                "2d"
            );


        const frontCtx =
            frontCanvas.getContext(
                "2d"
            );


        let width =
            window.innerWidth;


        let height =
            window.innerHeight;


        function resizeParticles() {

            width =
                window.innerWidth;


            height =
                window.innerHeight;


            backCanvas.width =
                width;


            backCanvas.height =
                height;


            frontCanvas.width =
                width;


            frontCanvas.height =
                height;

        }


        resizeParticles();


        window.addEventListener(
            "resize",
            resizeParticles
        );


        /* =========================================================
           PARTICLE
        ========================================================= */

        class Particle {

            constructor(
                layer
            ) {

                this.layer =
                    layer;


                this.reset(
                    true
                );

            }


            reset(
                initial = false
            ) {

                this.x =
                    Math.random()
                    *
                    width;


                this.y =
                    initial
                        ? Math.random()
                            * height
                        : height + 30;


                /*
                 * 深度
                 */

                if (
                    this.layer ===
                    "back"
                ) {

                    this.depth =
                        Math.random()
                        *
                        .32
                        +
                        .08;

                } else {

                    this.depth =
                        Math.random()
                        *
                        .35
                        +
                        .65;

                }


                /*
                 * 大小
                 */

                this.radius =
                    this.layer ===
                    "back"

                        ? Math.random()
                            * .90
                            +
                            .20

                        : Math.random()
                            * 1.75
                            +
                            .35;


                /*
                 * 向上速度
                 */

                this.speed =
                    this.layer ===
                    "back"

                        ? Math.random()
                            * .12
                            +
                            .025

                        : Math.random()
                            * .23
                            +
                            .055;


                /*
                 * 透明度
                 */

                this.opacity =
                    this.layer ===
                    "back"

                        ? Math.random()
                            * .15
                            +
                            .035

                        : Math.random()
                            * .28
                            +
                            .08;


                /*
                 * 左右微漂移
                 */

                this.horizontal =
                    (
                        Math.random()
                        -
                        .5
                    )
                    *
                    .14;


                /*
                 * 波形
                 */

                this.phase =
                    Math.random()
                    *
                    Math.PI
                    *
                    2;


                this.wave =
                    Math.random()
                    *
                    .0008
                    +
                    .0002;


                /*
                 * 少量星芒
                 */

                this.star =
                    Math.random()
                    <
                    (
                        this.layer ===
                        "front"
                            ? .075
                            : .025
                    );


                /*
                 * 極少數亮粒
                 */

                this.bright =
                    Math.random()
                    <
                    (
                        this.layer ===
                        "front"
                            ? .035
                            : .012
                    );

            }


            update(
                time
            ) {

                /*
                 * 向上
                 */

                this.y -=
                    this.speed;


                /*
                 * 基礎左右
                 */

                this.x +=
                    this.horizontal;


                /*
                 * 自然波動
                 */

                this.x +=
                    Math.sin(
                        time *
                        this.wave
                        +
                        this.phase
                    )
                    *
                    (
                        .035 *
                        this.depth
                    );


                /*
                 * 滑鼠極輕微干涉
                 */

                const cursorX =
                    (
                        mouseX *
                        width
                    )
                    +
                    width / 2;


                const cursorY =
                    (
                        mouseY *
                        height
                    )
                    +
                    height / 2;


                const dx =
                    cursorX -
                    this.x;


                const dy =
                    cursorY -
                    this.y;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (
                    distance <
                    180
                ) {

                    const influence =
                        (
                            1 -
                            distance /
                            180
                        )
                        *
                        .0015
                        *
                        this.depth;


                    this.x -=
                        dx *
                        influence;


                    this.y -=
                        dy *
                        influence;

                }


                /*
                 * 水平循環
                 */

                if (
                    this.x <
                    -40
                ) {

                    this.x =
                        width + 40;

                }


                if (
                    this.x >
                    width + 40
                ) {

                    this.x =
                        -40;

                }


                /*
                 * 上方出去
                 */

                if (
                    this.y <
                    -35
                ) {

                    this.reset(
                        false
                    );

                }

            }


            draw(
                ctx,
                time
            ) {

                const breathing =
                    1 +
                    Math.sin(
                        time *
                        .0012
                        +
                        this.phase
                    )
                    *
                    .16;


                let alpha =
                    this.opacity *
                    breathing;


                if (
                    this.bright
                ) {

                    alpha *=
                        1.45;

                }


                /*
                 * 普通光粒
                 */

                if (
                    !this.star
                ) {

                    ctx.beginPath();


                    ctx.arc(
                        this.x,
                        this.y,
                        this.radius,
                        0,
                        Math.PI * 2
                    );


                    ctx.fillStyle =
                        `
                            rgba(
                                255,
                                255,
                                255,
                                ${alpha}
                            )
                        `;


                    if (
                        this.bright
                    ) {

                        ctx.shadowBlur =
                            8 *
                            this.depth;


                        ctx.shadowColor =
                            "rgba(255,255,255,.65)";

                    } else {

                        ctx.shadowBlur =
                            0;

                    }


                    ctx.fill();


                    ctx.shadowBlur =
                        0;


                    return;

                }


                /*
                 * 星芒
                 */

                const length =
                    this.radius *
                    4.5;


                ctx.save();


                ctx.translate(
                    this.x,
                    this.y
                );


                ctx.globalAlpha =
                    alpha;


                ctx.shadowBlur =
                    10 *
                    this.depth;


                ctx.shadowColor =
                    "rgba(255,255,255,.8)";


                ctx.fillStyle =
                    "rgba(255,255,255,.9)";


                ctx.beginPath();


                ctx.moveTo(
                    0,
                    -length
                );


                ctx.lineTo(
                    this.radius *
                    .35,
                    0
                );


                ctx.lineTo(
                    0,
                    length
                );


                ctx.lineTo(
                    -this.radius *
                    .35,
                    0
                );


                ctx.closePath();


                ctx.fill();


                ctx.restore();

            }

        }


        /* =========================================================
           PARTICLES
        ========================================================= */

        const backgroundParticles =
            [];


        const foregroundParticles =
            [];


        for (
            let i = 0;
            i < 72;
            i++
        ) {

            backgroundParticles.push(
                new Particle(
                    "back"
                )
            );

        }


        for (
            let i = 0;
            i < 32;
            i++
        ) {

            foregroundParticles.push(
                new Particle(
                    "front"
                )
            );

        }


        /* =========================================================
           CLICK HALO
        ========================================================= */

        const clickEffects =
            [];


        document.addEventListener(
            "pointerdown",
            event => {

                /*
                 * 開機時也允許 click FX。
                 */

                clickEffects.push({

                    x:
                        event.clientX,

                    y:
                        event.clientY,

                    start:
                        performance.now(),

                    duration:
                        720,

                    particles:
                        Array.from(
                            {
                                length:
                                    8
                            },
                            () => ({

                                angle:
                                    Math.random()
                                    *
                                    Math.PI
                                    *
                                    2,

                                speed:
                                    Math.random()
                                    *
                                    1.2
                                    +
                                    .7,

                                radius:
                                    Math.random()
                                    *
                                    1.6
                                    +
                                    .7

                            })
                        )

                });

            }
        );


        function drawClickEffects() {

            const now =
                performance.now();


            for (
                let i =
                    clickEffects.length - 1;
                i >= 0;
                i--
            ) {

                const effect =
                    clickEffects[i];


                const progress =
                    (
                        now -
                        effect.start
                    )
                    /
                    effect.duration;


                if (
                    progress >=
                    1
                ) {

                    clickEffects.splice(
                        i,
                        1
                    );

                    continue;

                }


                const alpha =
                    1 -
                    progress;


                const radius =
                    10 +
                    progress *
                    92;


                /*
                 * 外圈
                 */

                frontCtx.beginPath();


                frontCtx.arc(
                    effect.x,
                    effect.y,
                    radius,
                    0,
                    Math.PI * 2
                );


                frontCtx.strokeStyle =
                    `
                        rgba(
                            255,
                            255,
                            255,
                            ${alpha * .68}
                        )
                    `;


                frontCtx.lineWidth =
                    1.6;


                frontCtx.stroke();


                /*
                 * 內圈
                 */

                frontCtx.beginPath();


                frontCtx.arc(
                    effect.x,
                    effect.y,
                    radius * .58,
                    0,
                    Math.PI * 2
                );


                frontCtx.strokeStyle =
                    `
                        rgba(
                            99,
                            210,
                            250,
                            ${alpha * .55}
                        )
                    `;


                frontCtx.lineWidth =
                    1;


                frontCtx.stroke();


                /*
                 * 爆開粒子
                 */

                effect.particles.forEach(
                    particle => {

                        const distance =
                            progress *
                            80 *
                            particle.speed;


                        const x =
                            effect.x
                            +
                            Math.cos(
                                particle.angle
                            )
                            *
                            distance;


                        const y =
                            effect.y
                            +
                            Math.sin(
                                particle.angle
                            )
                            *
                            distance;


                        frontCtx.beginPath();


                        frontCtx.arc(
                            x,
                            y,
                            particle.radius,
                            0,
                            Math.PI * 2
                        );


                        frontCtx.fillStyle =
                            `
                                rgba(
                                    255,
                                    255,
                                    255,
                                    ${alpha}
                                )
                            `;


                        frontCtx.fill();

                    }
                );

            }

        }


        /* =========================================================
           PARTICLE LOOP
        ========================================================= */

        function particleLoop(
            time
        ) {

            backCtx.clearRect(
                0,
                0,
                width,
                height
            );


            frontCtx.clearRect(
                0,
                0,
                width,
                height
            );


            backgroundParticles.forEach(
                particle => {

                    particle.update(
                        time
                    );


                    particle.draw(
                        backCtx,
                        time
                    );

                }
            );


            foregroundParticles.forEach(
                particle => {

                    particle.update(
                        time
                    );


                    particle.draw(
                        frontCtx,
                        time
                    );

                }
            );


            drawClickEffects();


            requestAnimationFrame(
                particleLoop
            );

        }


        requestAnimationFrame(
            particleLoop
        );


        /* =========================================================
           INITIAL PAGE
        ========================================================= */

        renderPage(
            0
        );


        /* =========================================================
           BOOT
        ========================================================= */

        const boot =
            document.getElementById(
                "boot"
            );


        const bootSystem =
            document.getElementById(
                "boot-system"
            );


        const bootCore =
            document.getElementById(
                "boot-core"
            );


        const enterPrompt =
            document.getElementById(
                "enter-prompt"
            );


        let entered =
            false;


        /*
         * 開機完成一段時間後顯示提示。
         */

        setTimeout(
            () => {

                if (
                    !entered
                ) {

                    enterPrompt.classList.add(
                        "show"
                    );

                }

            },
            2200
        );


        /* =========================================================
           ENTER SITE
        ========================================================= */

        function enterSite() {

            if (
                entered
            )
                return;


            entered =
                true;


            /*
             * =================================================
             * 最重要：
             *
             * 不管 music_module.js 是否已經 Ready，
             * 先記住音樂播放意圖。
             * =================================================
             */

            window.__WND_START_MUSIC_REQUESTED =
                true;


            /*
             * AudioContext
             */

            if (
                window.resumeInterfaceAudio
            ) {

                try {

                    window.resumeInterfaceAudio();

                } catch (
                    error
                ) {

                    console.warn(
                        "AudioContext failed:",
                        error
                    );

                }

            }


            /*
             * 嘗試立即叫 music module。
             *
             * 如果還不存在，
             * 它之後會透過 flag 自動接手。
             */

            if (
                window.startMusic
            ) {

                try {

                    window.startMusic();

                } catch (
                    error
                ) {

                    console.warn(
                        "Music start failed:",
                        error
                    );

                }

            }


            /*
             * Boot SFX
             */

            if (
                window.playInterfaceSfx
            ) {

                try {

                    window.playInterfaceSfx(
                        "boot"
                    );

                } catch (
                    error
                ) {}

            }


            /*
             * Core 爆發
             */

            boot.classList.add(
                "complete"
            );


            /*
             * 提示消失
             */

            enterPrompt.classList.remove(
                "show"
            );


            /*
             * Boot 退場
             */

            setTimeout(
                () => {

                    boot.classList.add(
                        "hide"
                    );


                    document.body.classList.add(
                        "entered"
                    );

                },
                600
            );


            /*
             * 完全刪除 Boot。
             */

            setTimeout(
                () => {

                    if (
                        boot &&
                        boot.parentNode
                    ) {

                        boot.remove();

                    }

                },
                1700
            );

        }


        /* =========================================================
           BOOT POINTER INPUT
        ========================================================= */

        /*
         * 不再只監聽 document。
         *
         * 直接讓 #boot 接收。
         *
         * 所以：
         *
         * 點球
         * 點 Halo
         * 點 Boot 空白
         * 點文字附近
         *
         * 都可以進入。
         */

        boot.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();

                event.stopPropagation();


                if (
                    !entered
                ) {

                    enterSite();

                }

            },
            {
                passive:
                    false
            }
        );


        /*
         * Click 作為第二層保險。
         */

        boot.addEventListener(
            "click",
            event => {

                event.preventDefault();

                event.stopPropagation();


                if (
                    !entered
                ) {

                    enterSite();

                }

            }
        );


        /*
         * 鍵盤 Enter / Space
         */

        boot.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter" ||
                    event.key ===
                    " "
                ) {

                    event.preventDefault();


                    if (
                        !entered
                    ) {

                        enterSite();

                    }

                }

            }
        );


        /*
         * 明確設定 Boot 狀態。
         */

        boot.style.pointerEvents =
            "auto";


        bootSystem.style.pointerEvents =
            "auto";


        bootCore.style.pointerEvents =
            "auto";

    </script>


    <!-- =========================================================
         MUSIC MODULE
    ========================================================= -->

    <script src="music_module.js"></script>

</body>

</html>
