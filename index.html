<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCHALE TERMINAL // WND</title>
  <style>
    :root {
      --ba-blue: #00A3FF;
      --ba-blue-dark: #0077CC;
      --ba-navy: #0A1D37;
      --ba-bg: #EAF4FD;
      --ba-pink: #FF5C8D;
      --ba-yellow: #FFC700;
      --ba-border: rgba(0, 163, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--ba-bg);
      background-image: 
        repeating-linear-gradient(-45deg, rgba(0, 163, 255, 0.03) 0, rgba(0, 163, 255, 0.03) 15px, transparent 15px, transparent 30px),
        linear-gradient(rgba(0, 163, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 163, 255, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
      display: flex;
      flex-direction: column;
      color: var(--ba-navy);
    }

    /* ==========================================
       1. 蔚藍檔案開機動畫 (Boot Screen) 樣式
       ========================================== */
    #boot-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #FFFFFF 0%, #D8EDFF 100%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* 點擊啟動後的消失動畫 */
    #boot-screen.fade-out {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    .boot-halo-container {
      position: relative;
      margin-bottom: 24px;
    }

    /* 開機頁面巨大的阿羅娜天使光環 */
    .boot-halo {
      width: 120px;
      height: 30px;
      border: 5px solid var(--ba-blue);
      border-radius: 50%;
      box-shadow: 0 0 20px var(--ba-blue), inset 0 0 10px var(--ba-blue);
      animation: boot-halo-spin 4s ease-in-out infinite;
    }

    @keyframes boot-halo-spin {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(5deg); }
    }

    .boot-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--ba-navy);
      text-align: center;
      margin-bottom: 8px;
    }

    .boot-subtitle {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--ba-blue);
      margin-bottom: 48px;
    }

    .touch-to-start {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--ba-blue-dark);
      padding: 12px 32px;
      border: 2px solid var(--ba-blue);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 15px rgba(0, 163, 255, 0.2);
      animation: touch-pulse 1.5s ease-in-out infinite;
    }

    @keyframes touch-pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    /* ==========================================
       2. 夏萊主面板 (Main UI)
       ========================================== */
    .ba-header {
      width: 100%;
      height: 52px;
      background: var(--ba-navy);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      border-bottom: 3px solid var(--ba-blue);
      color: white;
      z-index: 100;
    }

    .schale-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 16px;
    }

    .schale-icon {
      width: 24px; height: 24px;
      background: var(--ba-blue);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      display: flex; justify-content: center; align-items: center;
    }

    .schale-icon::after {
      content: '';
      width: 10px; height: 10px;
      background: var(--ba-yellow);
      transform: rotate(45deg);
    }

    .top-resources {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .res-item {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 4px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: bold;
    }

    .main-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .terminal-card {
      width: 900px;
      max-width: 95vw;
      height: 540px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      border: 2px solid var(--ba-border);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 163, 255, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .tab-bar {
      display: flex;
      background: #F0F6FA;
      border-bottom: 2px solid rgba(0, 163, 255, 0.15);
      padding: 0 16px;
    }

    .tab-item {
      padding: 14px 32px;
      font-weight: 800;
      color: #7A8CA8;
      cursor: pointer;
      position: relative;
      font-size: 14px;
    }

    .tab-item.active {
      color: var(--ba-navy);
      background: white;
    }

    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 0;
      width: 100%; height: 3px;
      background: var(--ba-blue);
    }

    .content-body {
      flex: 1;
      position: relative;
      padding: 32px;
    }

    .page {
      position: absolute;
      top: 32px; left: 32px; right: 32px; bottom: 32px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      display: flex;
      gap: 32px;
    }

    .page.active {
      opacity: 1;
      visibility: visible;
    }

    .sensei-id-card {
      width: 240px;
      background: linear-gradient(135deg, #FFFFFF 0%, #F4F8FC 100%);
      border: 2px solid var(--ba-blue);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
    }

    .avatar-box {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: #D9EFFF;
      display: flex; justify-content: center; align-items: center;
      font-size: 20px; font-weight: 900;
      color: var(--ba-blue);
      margin-bottom: 12px;
    }

    .detail-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .placeholder-box {
      background: white;
      border: 2px dashed rgba(0, 163, 255, 0.4);
      border-radius: 8px;
      padding: 16px;
      color: #8A9BB3;
      font-size: 14px;
    }

    .ba-button {
      background: var(--ba-blue);
      color: white;
      border: none;
      padding: 10px 24px;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
      display: flex; align-items: center; gap: 8px;
    }
  </style>
</head>
<body>

  <!-- 1. 開機動畫畫面 (取代光之種子) -->
  <div id="boot-screen" onclick="startTerminal()">
    <div class="boot-halo-container">
      <div class="boot-halo"></div>
    </div>
    <div class="boot-title">BLUE ARCHIVE</div>
    <div class="boot-subtitle">SCHALE OS // WND SYSTEM CONNECTING</div>
    <div class="touch-to-start">- TOUCH TO START -</div>
  </div>

  <!-- 2. 主畫面區域 -->
  <header class="ba-header">
    <div class="schale-brand">
      <div class="schale-icon"></div>
      SCHALE OS // OFFICE TERMINAL
    </div>
    
    <div class="top-resources">
      <div class="res-item"><span style="color: #FFD15C;">AP</span> 120 / 120</div>
      <div class="res-item">💰 9,999,999</div>
      <div class="res-item"><span style="color: #66C8FF;">💎</span> 24,000</div>
    </div>
  </header>

  <main class="main-viewport">
    <div class="terminal-card">
      <nav class="tab-bar">
        <div class="tab-item active" onclick="switchTab(0)">01 PROFILE</div>
        <div class="tab-item" onclick="switchTab(1)">02 MOMOTALK</div>
        <div class="tab-item" onclick="switchTab(2)">03 ARCHIVE</div>
      </nav>

      <div class="content-body">
        <div class="page active">
          <div class="sensei-id-card">
            <div class="avatar-box">WND</div>
            <strong style="font-size: 18px;">WND 老師</strong>
            <span style="font-size: 11px; color: #8A9BB3;">SCHALE</span>
          </div>
          <div class="detail-container">
            <div class="placeholder-box">
              <strong style="color: var(--ba-blue);">[ 個人簡介 / PROFILE ]</strong><br>
              請在此填寫 WND 的簡介...
            </div>
          </div>
        </div>

        <div class="page">
          <div class="detail-container">
            <div class="placeholder-box">MOMOTALK 訊息預留位置...</div>
          </div>
        </div>

        <div class="page">
          <div class="detail-container">
            <div class="placeholder-box">作品歸檔預留位置...</div>
          </div>
        </div>
      </div>

      <div style="position: absolute; bottom: 20px; right: 20px;">
        <button class="ba-button" onclick="toggleBgm()">
          <span id="bgm-icon">♪</span> BGM SYSTEM
        </button>
      </div>
    </div>
  </main>

  <script>
    let audioCtx = null;
    let bgmAudio = null;
    let isBgmPlaying = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // 啟動音效 (阿羅娜開機啟動音)
    function playStartSound() {
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      
      // 合成遊戲啟動時的高音閃爍聲 (Arpeggio Sparkle)
      const freqs = [1046.5, 1318.5, 1567.98, 2093.0]; // C6, E6, G6, C7
      freqs.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.06);

        gain.gain.setValueAtTime(0.12, now + idx * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.3);

        osc.start(now + idx * 0.06);
        osc.stop(now + idx * 0.06 + 0.3);
      });
    }

    // 按鍵 UI 音效
    function playSfx() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.type = 'sine';
      osc.frequency.setValueAtTime(1400, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.04);

      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

      osc.start(now);
      osc.stop(now + 0.04);
    }

    // 點擊「TOUCH TO START」觸發動畫與音樂
    function startTerminal() {
      playStartSound();

      // 載入並自動播放 BGM
      if (!bgmAudio) {
        bgmAudio = new Audio('https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3');
        bgmAudio.loop = true;
        bgmAudio.volume = 0.25;
      }
      bgmAudio.play();
      isBgmPlaying = true;
      document.getElementById('bgm-icon').innerText = '❚❚';

      // 淡出開機動畫畫面
      const bootScreen = document.getElementById('boot-screen');
      bootScreen.classList.add('fade-out');
      setTimeout(() => {
        bootScreen.style.display = 'none';
      }, 800);
    }

    function switchTab(index) {
      playSfx();
      const tabs = document.querySelectorAll('.tab-item');
      const pages = document.querySelectorAll('.page');
      tabs.forEach((t, i) => t.classList.toggle('active', i === index));
      pages.forEach((p, i) => p.classList.toggle('active', i === index));
    }

    function toggleBgm() {
      playSfx();
      if (!bgmAudio) return;

      if (isBgmPlaying) {
        bgmAudio.pause();
        isBgmPlaying = false;
        document.getElementById('bgm-icon').innerText = '♪';
      } else {
        bgmAudio.play();
        isBgmPlaying = true;
        document.getElementById('bgm-icon').innerText = '❚❚';
      }
    }
  </script>
</body>
</html>
