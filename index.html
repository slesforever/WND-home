<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>WND</title>

    <link
        rel="icon"
        href="https://i.imgur.com/2horI5Gm.png"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {

            --blue: #63d2fa;
            --blue2: #9ce9ff;
            --blue-dark: #378eaf;

            --white: #ffffff;

            --text: #3c5968;
            --muted: #7e99a8;

            --mx: 50%;
            --my: 50%;

        }


        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

        }


        body {

            overflow: hidden;

            background:
                #bcecff;

            color:
                var(--text);

            font-family:
                "Barlow",
                "Noto Sans TC",
                sans-serif;

            user-select: none;

            -webkit-tap-highlight-color: transparent;

        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .background {

            position: fixed;

            /*
             * 保持很大的安全邊界。
             * 滑鼠視差和漂移都不會露出背景外。
             */

            inset: -11%;

            z-index: 0;

            background-image:
                linear-gradient(
                    rgba(220,247,255,0.035),
                    rgba(210,243,255,0.14)
                ),
                url("maxresdefault.jpg");

            background-size:
                cover;

            background-position:
                center center;

            transform:
                scale(1.18);

            will-change:
                transform;

        }


        .background-overlay {

            position: fixed;

            inset: 0;

            z-index: 1;

            pointer-events: none;

            background:

                radial-gradient(
                    ellipse at center,
                    rgba(255,255,255,0.00) 20%,
                    rgba(65,128,153,0.14) 100%
                );

        }


        .mouse-light {

            position: fixed;

            inset: 0;

            z-index: 2;

            pointer-events: none;

            background:

                radial-gradient(
                    circle 430px at var(--mx) var(--my),
                    rgba(255,255,255,0.18),
                    transparent 70%
                );

        }


        .grid {

            position: fixed;

            inset: 0;

            z-index: 3;

            pointer-events: none;

            opacity: 0.10;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.24) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.24) 1px,
                    transparent 1px
                );

            background-size:
                68px 68px;

            mask-image:
                radial-gradient(
                    ellipse at center,
                    black,
                    transparent 82%
                );

            -webkit-mask-image:
                radial-gradient(
                    ellipse at center,
                    black,
                    transparent 82%
                );

        }


        /* =====================================================
           VFX
        ===================================================== */

        #vfx {

            position: fixed;

            inset: 0;

            z-index: 5;

            width: 100%;
            height: 100%;

            pointer-events: none;

        }


        /* =====================================================
           TOP HUD
        ===================================================== */

        .top-ui {

            position: fixed;

            top: 23px;

            left: 30px;
            right: 30px;

            z-index: 30;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            pointer-events:
                none;

        }


        .brand {

            display:
                flex;

            align-items:
                center;

            gap:
                11px;

            color:
                rgba(39,87,108,.76);

            font-size:
                11px;

            font-weight:
                800;

            letter-spacing:
                3px;

        }


        .brand-dot {

            width:
                9px;

            height:
                9px;

            border-radius:
                50%;

            background:
                white;

            border:
                2px solid
                var(--blue);

            box-shadow:
                0 0 14px
                rgba(99,210,250,.9);

            animation:
                brandPulse
                2.6s
                ease-in-out
                infinite;

        }


        @keyframes brandPulse {

            0%,
            100% {
                transform:
                    scale(.82);

                opacity:
                    .65;
            }

            50% {
                transform:
                    scale(1.15);

                opacity:
                    1;
            }

        }


        .system-info {

            display:
                flex;

            flex-direction:
                column;

            align-items:
                flex-end;

            gap:
                4px;

            color:
                rgba(43,91,111,.50);

            font-size:
                9px;

            font-weight:
                600;

            letter-spacing:
                2px;

        }


        /* =====================================================
           SIDE HUD
        ===================================================== */

        .side-hud {

            position: fixed;

            left:
                27px;

            top:
                50%;

            transform:
                translateY(-50%);

            z-index:
                25;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            gap:
                12px;

            opacity:
                .52;

        }


        .side-line {

            width:
                1px;

            height:
                68px;

            background:

                linear-gradient(
                    to bottom,
                    transparent,
                    var(--blue),
                    transparent
                );

        }


        .side-text {

            writing-mode:
                vertical-rl;

            color:
                #528ea6;

            font-size:
                8px;

            letter-spacing:
                3px;

        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            position:
                relative;

            width:
                100%;

            height:
                100%;

            z-index:
                10;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

        }


        /* =====================================================
           PROFILE
        ===================================================== */

        .profile {

            position:
                relative;

            width:
                min(730px, 88vw);

            min-height:
                465px;

            padding:
                39px 44px 48px;

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,.84),
                    rgba(246,252,255,.64)
                );

            border:
                1px solid
                rgba(255,255,255,.96);

            box-shadow:

                0 32px 90px
                rgba(45,109,139,.24),

                0 5px 20px
                rgba(45,109,139,.10);

            backdrop-filter:
                blur(20px)
                saturate(125%);

            -webkit-backdrop-filter:
                blur(20px)
                saturate(125%);

            overflow:
                hidden;

            opacity:
                0;

            transform:
                translateY(20px)
                scale(.975);

            transition:

                opacity
                .9s
                cubic-bezier(.22,1,.36,1),

                transform
                .9s
                cubic-bezier(.22,1,.36,1);

        }


        body.entered .profile {

            opacity:
                1;

            transform:
                translateY(0)
                scale(1);

        }


        .profile::before {

            content:
                "";

            position:
                absolute;

            left:
                0;

            top:
                0;

            width:
                100%;

            height:
                4px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    #75ddff 20%,
                    white 50%,
                    #75ddff 80%,
                    transparent
                );

            animation:
                profileShine
                4s
                ease-in-out
                infinite;

        }


        @keyframes profileShine {

            0%,
            100% {
                opacity:
                    .52;
            }

            50% {
                opacity:
                    1;
            }

        }


        .profile-light {

            position:
                absolute;

            inset:
                0;

            pointer-events:
                none;

            z-index:
                1;

            background:

                radial-gradient(
                    circle 400px at var(--mx) var(--my),
                    rgba(255,255,255,.22),
                    transparent 70%
                );

        }


        /* =====================================================
           CORNERS
        ===================================================== */

        .corner {

            position:
                absolute;

            width:
                23px;

            height:
                23px;

            z-index:
                10;

            opacity:
                .60;

        }


        .corner::before,
        .corner::after {

            content:
                "";

            position:
                absolute;

            background:
                var(--blue);

        }


        .corner::before {

            width:
                100%;

            height:
                1px;

        }


        .corner::after {

            width:
                1px;

            height:
                100%;

        }


        .corner-tl {

            top:
                16px;

            left:
                16px;

        }


        .corner-tr {

            top:
                16px;

            right:
                16px;

            transform:
                rotate(90deg);

        }


        .corner-bl {

            bottom:
                16px;

            left:
                16px;

            transform:
                rotate(-90deg);

        }


        .corner-br {

            bottom:
                16px;

            right:
                16px;

            transform:
                rotate(180deg);

        }


        /* =====================================================
           ALL PAGE CONTENT
        ===================================================== */

        .page-content {

            position:
                relative;

            z-index:
                5;

        }


        /* =====================================================
           PROFILE HEADER
        ===================================================== */

        .section-header {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

        }


        .section-point {

            width:
                7px;

            height:
                7px;

            border-radius:
                50%;

            background:
                var(--blue);

            box-shadow:
                0 0 12px
                rgba(99,210,250,.85);

        }


        .section-line {

            width:
                36px;

            height:
                1px;

            background:
                var(--blue);

        }


        .section-name {

            color:
                var(--blue-dark);

            font-size:
                10px;

            font-weight:
                800;

            letter-spacing:
                2.5px;

        }


        .name-row {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                flex-end;

            margin-top:
                16px;

        }


        .name {

            color:
                #ffffff;

            font-size:
                clamp(53px, 9vw, 77px);

            line-height:
                .87;

            font-weight:
                800;

            letter-spacing:
                -3px;

            text-shadow:
                0 4px 18px
                rgba(49,113,143,.29);

        }


        .identity-tag {

            padding:
                7px 11px;

            margin-bottom:
                4px;

            border:
                1px solid
                rgba(99,210,250,.28);

            background:
                rgba(255,255,255,.44);

            color:
                #7291a0;

            font-size:
                9px;

            font-weight:
                700;

            letter-spacing:
                1.4px;

        }


        /* =====================================================
           PAGE 1
        ===================================================== */

        .page-layout {

            margin-top:
                29px;

        }


        .mini-stats {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                10px;

        }


        .stat {

            min-height:
                70px;

            padding:
                13px 15px;

            background:
                rgba(255,255,255,.53);

            border:
                1px solid
                rgba(255,255,255,.9);

            position:
                relative;

            overflow:
                hidden;

        }


        .stat::before {

            content:
                "";

            position:
                absolute;

            left:
                0;

            top:
                0;

            width:
                3px;

            height:
                100%;

            background:
                var(--blue);

            transform:
                scaleY(.35);

            transform-origin:
                center;

            transition:
                transform
                .25s
                ease;

        }


        .stat:hover::before {

            transform:
                scaleY(1);

        }


        .stat-label {

            color:
                #7e9ba9;

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1.5px;

            margin-bottom:
                6px;

        }


        .stat-value {

            color:
                #425e6c;

            font-size:
                14px;

            font-weight:
                600;

        }


        .description {

            margin-top:
                10px;

            min-height:
                94px;

            padding:
                15px 17px;

            background:
                rgba(255,255,255,.48);

            border:
                1px solid
                rgba(255,255,255,.90);

        }


        .description-label {

            color:
                #7d99a7;

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1.5px;

            margin-bottom:
                10px;

        }


        .description-value {

            color:
                #5b7583;

            font-size:
                12px;

            line-height:
                1.5;

        }


        /* =====================================================
           PAGE 2 FAVORITES
        ===================================================== */

        .favorite-layout {

            margin-top:
                30px;

            display:
                grid;

            grid-template-columns:
                1.05fr .95fr;

            gap:
                12px;

        }


        .favorite-card {

            position:
                relative;

            min-height:
                133px;

            padding:
                18px;

            background:
                rgba(255,255,255,.55);

            border:
                1px solid
                rgba(255,255,255,.92);

            overflow:
                hidden;

            transition:
                transform
                .2s
                ease,
                background
                .2s
                ease;

        }


        .favorite-card:hover {

            transform:
                translateY(-3px);

            background:
                rgba(255,255,255,.76);

        }


        .favorite-symbol {

            width:
                28px;

            height:
                28px;

            margin-bottom:
                14px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border:
                1px solid
                rgba(99,210,250,.38);

            color:
                var(--blue-dark);

            background:
                rgba(255,255,255,.48);

            font-size:
                12px;

        }


        .favorite-label {

            color:
                #7895a4;

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1.5px;

        }


        .favorite-value {

            margin-top:
                7px;

            color:
                #405c6b;

            font-size:
                15px;

            font-weight:
                700;

        }


        .favorite-sub {

            margin-top:
                5px;

            color:
                #8ca0ac;

            font-size:
                10px;

        }


        .favorite-wide {

            grid-column:
                1 / -1;

            min-height:
                77px;

        }


        .favorite-wide .favorite-symbol {

            float:
                left;

            margin-right:
                13px;

            margin-bottom:
                0;

        }


        /* =====================================================
           PAGE 3 WORKS
        ===================================================== */

        .works-layout {

            margin-top:
                29px;

            display:
                flex;

            flex-direction:
                column;

            gap:
                9px;

        }


        .work-item {

            position:
                relative;

            display:
                grid;

            grid-template-columns:
                40px 1fr auto;

            align-items:
                center;

            min-height:
                67px;

            padding:
                10px 14px;

            background:
                rgba(255,255,255,.54);

            border:
                1px solid
                rgba(255,255,255,.91);

            transition:
                transform
                .2s
                ease,
                background
                .2s
                ease;

        }


        .work-item:hover {

            transform:
                translateX(4px);

            background:
                rgba(255,255,255,.80);

        }


        .work-index {

            color:
                var(--blue-dark);

            font-size:
                9px;

            font-weight:
                800;

            letter-spacing:
                1px;

        }


        .work-title {

            color:
                #425f6e;

            font-size:
                13px;

            font-weight:
                700;

        }


        .work-description {

            margin-top:
                3px;

            color:
                #8aa0ad;

            font-size:
                9px;

        }


        .work-state {

            padding:
                5px 8px;

            background:
                rgba(99,210,250,.10);

            border:
                1px solid
                rgba(99,210,250,.22);

            color:
                #5793aa;

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1px;

        }


        /* =====================================================
           PAGE FOOTER
        ===================================================== */

        .page-number {

            position:
                absolute;

            right:
                28px;

            bottom:
                19px;

            z-index:
                10;

            color:
                #7997a6;

            font-size:
                9px;

            font-weight:
                700;

            letter-spacing:
                2px;

        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .nav {

            position:
                fixed;

            top:
                50%;

            z-index:
                40;

            width:
                53px;

            height:
                53px;

            transform:
                translateY(-50%);

            border:
                1px solid
                rgba(255,255,255,.94);

            background:
                rgba(255,255,255,.65);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            box-shadow:
                0 12px 32px
                rgba(50,113,142,.17);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            cursor:
                pointer;

            opacity:
                0;

            transition:
                opacity
                .8s
                ease,
                transform
                .2s
                ease,
                background
                .2s
                ease;

        }


        body.entered .nav {

            opacity:
                1;

        }


        .nav:hover {

            background:
                rgba(255,255,255,.93);

        }


        .nav:active {

            transform:
                translateY(-50%)
                scale(.89);

        }


        .nav-left {

            left:
                25px;

        }


        .nav-right {

            right:
                25px;

        }


        .arrow {

            width:
                10px;

            height:
                10px;

            border-top:
                2px solid
                var(--blue-dark);

            border-right:
                2px solid
                var(--blue-dark);

        }


        .arrow-left {

            transform:
                rotate(-135deg);

            margin-left:
                4px;

        }


        .arrow-right {

            transform:
                rotate(45deg);

            margin-right:
                4px;

        }


        /* =====================================================
           MUSIC BUTTON
        ===================================================== */

        .music-button {

            position:
                fixed;

            right:
                27px;

            bottom:
                24px;

            z-index:
                110;

            width:
                48px;

            height:
                48px;

            border:
                1px solid
                rgba(255,255,255,.95);

            background:
                rgba(255,255,255,.80);

            color:
                var(--blue-dark);

            cursor:
                pointer;

            font-size:
                17px;

            box-shadow:
                0 10px 30px
                rgba(50,113,142,.18);

            transition:
                all
                .2s
                ease;

        }


        .music-button:hover {

            transform:
                translateY(-3px);

            background:
                white;

        }


        .music-button.playing {

            color:
                white;

            background:
                var(--blue);

            box-shadow:

                0 0 0 5px
                rgba(99,210,250,.11),

                0 10px 30px
                rgba(50,113,142,.22);

        }


        /* =====================================================
           MUSIC PLAYER
        ===================================================== */

        .music-panel {

            position:
                fixed;

            right:
                27px;

            bottom:
                82px;

            z-index:
                105;

            width:
                375px;

            max-width:
                calc(100vw - 30px);

            background:

                linear-gradient(
                    145deg,
                    rgba(246,253,255,.94),
                    rgba(224,245,253,.90)
                );

            border:
                1px solid
                rgba(255,255,255,.98);

            box-shadow:

                0 25px 70px
                rgba(48,108,136,.25);

            backdrop-filter:
                blur(22px);

            -webkit-backdrop-filter:
                blur(22px);

            display:
                none;

            overflow:
                hidden;

        }


        .music-panel.open {

            display:
                block;

            animation:
                musicOpen
                .25s
                cubic-bezier(.22,1,.36,1);

        }


        @keyframes musicOpen {

            from {

                opacity:
                    0;

                transform:
                    translateY(12px)
                    scale(.97);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        .music-top {

            padding:
                15px 16px 13px;

            border-bottom:
                1px solid
                rgba(83,187,224,.15);

        }


        .music-top-line {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

        }


        .music-title {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            color:
                var(--blue-dark);

            font-size:
                10px;

            font-weight:
                800;

            letter-spacing:
                2px;

        }


        .music-title-dot {

            width:
                6px;

            height:
                6px;

            border-radius:
                50%;

            background:
                var(--blue);

            box-shadow:
                0 0 9px
                rgba(99,210,250,.75);

        }


        .music-state {

            display:
                flex;

            align-items:
                center;

            gap:
                5px;

            color:
                #7993a1;

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1px;

        }


        .state-light {

            width:
                6px;

            height:
                6px;

            border-radius:
                50%;

            background:
                #9eb1b9;

        }


        .music-panel.playing .state-light {

            background:
                #62d4fa;

            box-shadow:
                0 0 8px
                rgba(98,212,250,.8);

        }


        .now-playing {

            margin-top:
                13px;

            color:
                #455f6d;

            font-size:
                13px;

            font-weight:
                700;

            overflow:
                hidden;

            white-space:
                nowrap;

            text-overflow:
                ellipsis;

        }


        .now-playing-label {

            margin-bottom:
                4px;

            color:
                #8ba0ac;

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1.4px;

        }


        /* =====================================================
           EQUALIZER
        ===================================================== */

        .equalizer {

            height:
                23px;

            margin-top:

                .24s;

                .48s;

                1.7s
                linear
                infinite;

        }

            }

            to {

                    scale(1);

            }

        @keyframes spinReverse {

                    rotate(-360deg);
            }

        }


        .core {

            position:
                relative;

            width:
                71px;

            height:
                71px;

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle at 32% 28%,

            transform:
                scale(0);

            animation:

                coreIn
                1.05s
                .18s
                cubic-bezier(.22,1,.36,1)
                forwards,

                corePulse
                2.7s
                1.2s
                ease-in-out
                infinite;

            z-index:
                5;

        }


        .core::after {

            content:
                "";

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                17px;

            height:
                17px;

            transform:
                translate(-50%,-50%);

            border-radius:
                50%;

            background:
                white;

            box-shadow:
                0 0 23px
                white;

        }


        @keyframes coreIn {

            0% {

                transform:
                    scale(0)
                    rotate(-25deg);

            }

            75% {

                transform:
                    scale(1.16)
                    rotate(6deg);

            }

            100% {

                transform:
                    scale(1)
                    rotate(0);

            }

        }


        @keyframes corePulse {

            0%,
            100% {

                box-shadow:

                    0 0 22px
                    white,

                    0 0 55px
                    rgba(255,255,255,.87),

                    0 0 95px
                    rgba(99,210,250,.58);

                    1;

            }

        #boot.complete .core {

                .78s

                forwards;

        }


        @keyframes coreBurst {

                transform:
                    scale(1);
            }

            35% {
                transform:
                    scale(1.8);
            }

                    scale(28);

                        class="section-line"
                    ></span>

                    <span class="section-name">
                        ${data.header}
                    </span>

                </div>


                <div class="name-row">

                    <div class="name">
                        ${data.name}
                    </div>

                    <div class="identity-tag">
                        ${data.tag}
                    </div>

                </div>

            `;


            pageContent.appendChild(
                header
            );


            /* =================================================
               PROFILE PAGE
            ================================================= */

            if (
                data.type ===
                "profile"
            ) {

                const layout =
                    document.createElement(
                        "div"
                    );


                layout.className =
                    "page-layout";


                const stats =
                    document.createElement(
                        "div"
                    );


                stats.className =
                    "mini-stats";


                data.stats.forEach(
                    stat => {

                        const element =
                            document.createElement(
                                "div"
                            );


                        element.className =
                            "stat";


                        element.innerHTML = `

                            <div class="stat-label">
                                ${stat.label}
                            </div>

                            <div class="stat-value">
                                ${stat.value}
                            </div>

                        `;


                        stats.appendChild(
                            element
                        );

                    }
                );


                const description =
                    document.createElement(
                        "div"
                    );


                description.className =
                    "description";


                description.innerHTML = `

                    <div class="description-label">
                        DESCRIPTION
                    </div>

                    <div class="description-value">
                        ${data.description}
                    </div>

                `;


                layout.appendChild(
                    stats
                );


                layout.appendChild(
                    description
                );


                pageContent.appendChild(
                    layout
                );

            }


            /* =================================================
               FAVORITES PAGE
            ================================================= */

            if (
                data.type ===
                "favorites"
            ) {

                const layout =
                    document.createElement(
                        "div"
                    );


                layout.className =
                    "favorite-layout";


                data.cards.forEach(
                    card => {

                        const element =
                            document.createElement(
                                "div"
                            );


                        element.className =
                            "favorite-card";


                        if (
                            card.wide
                        ) {

                            element.classList.add(
                                "favorite-wide"
                            );

                        }


                        element.innerHTML = `

                            <div class="favorite-symbol">
                                ${card.symbol}
                            </div>

                            <div class="favorite-label">
                                ${card.label}
                            </div>

                            <div class="favorite-value">
                                ${card.value}
                            </div>

                            <div class="favorite-sub">
                                ${card.sub}
                            </div>

                        `;


                        layout.appendChild(
                            element
                        );

                    }
                );


                pageContent.appendChild(
                    layout
                );

            }


            /* =================================================
               WORKS PAGE
            ================================================= */

            if (
                data.type ===
                "works"
            ) {

                const layout =
                    document.createElement(
                        "div"
                    );


                layout.className =
                    "works-layout";


                data.works.forEach(
                    work => {

                        const element =
                            document.createElement(
                                "div"
                            );


                        element.className =
                            "work-item";


                        element.innerHTML = `

                            <div class="work-index">
                                ${work.index}
                            </div>


                            <div>

                                <div class="work-title">
                                    ${work.title}
                                </div>

                                <div class="work-description">
                                    ${work.description}
                                </div>

                            </div>


                            <div class="work-state">
                                ${work.state}
                            </div>

                        `;


                        layout.appendChild(
                            element
                        );

                    }
                );


                pageContent.appendChild(
                    layout
                );

            }


            pageNumber.textContent =
                `${String(index + 1).padStart(2,"0")} / ${String(pages.length).padStart(2,"0")}`;

        }


        /* =====================================================
           PAGE SWITCH
        ===================================================== */

        function switchPage(
            direction
        ) {

            if (
                pageChanging
            )
                return;


            pageChanging =
                true;


            if (
                window.playInterfaceSfx
            ) {

                window.playInterfaceSfx(
                    "page"
                );

            }


            const outgoing =
                direction === "next"
                    ? -65
                    : 65;


            const incoming =
                direction === "next"
                    ? 65
                    : -65;


            profile.style.transition =
                `
                    opacity .24s ease,
                    transform .34s cubic-bezier(.22,1,.36,1),
                    filter .24s ease
                `;


            profile.style.opacity =
                "0";


            profile.style.transform =
                `
                    translateX(${outgoing}px)
                    scale(.965)
                `;


            profile.style.filter =
                "blur(6px)";


            setTimeout(
                () => {

                    if (
                        direction === "next"
                    ) {

                        currentPage =
                            (
                                currentPage +
                                1
                            )
                            %
                            pages.length;

                    } else {

                        currentPage =
                            (
                                currentPage -
                                1 +
                                pages.length
                            )
                            %
                            pages.length;

                    }


                    renderPage(
                        currentPage
                    );


                    profile.style.transition =
                        "none";


                    profile.style.opacity =
                        "0";


                    profile.style.filter =
                        "blur(6px)";


                    profile.style.transform =
                        `
                            translateX(${incoming}px)
                            scale(.965)
                        `;


                    requestAnimationFrame(
                        () => {

                            requestAnimationFrame(
                                () => {

                                    profile.style.transition =
                                        `
                                            opacity .44s ease,
                                            transform .58s cubic-bezier(.22,1,.36,1),
                                            filter .44s ease
                                        `;


                                    profile.style.opacity =
                                        "1";


                                    profile.style.filter =
                                        "blur(0)";


                                    profile.style.transform =
                                        `
                                            translateX(0)
                                            scale(1)
                                        `;

                                }
                            );

                        }
                    );


                    setTimeout(
                        () => {

                            pageChanging =
                                false;

                        },
                        580
                    );

                },
                240
            );

        }


        /* =====================================================
           NAV
        ===================================================== */

        document
            .getElementById(
                "btn-next"
            )
            .addEventListener(
                "click",
                () => {

                    switchPage(
                        "next"
                    );

                }
            );


        document
            .getElementById(
                "btn-prev"
            )
            .addEventListener(
                "click",
                () => {

                    switchPage(
                        "prev"
                    );

                }
            );


        /* =====================================================
           KEYBOARD
        ===================================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "ArrowRight" ||
                    event.key.toLowerCase() ===
                    "d"
                ) {

                    switchPage(
                        "next"
                    );

                }


                if (
                    event.key ===
                    "ArrowLeft" ||
                    event.key.toLowerCase() ===
                    "a"
                ) {

                    switchPage(
                        "prev"
                    );

                }

            }
        );


        /* =====================================================
           TOUCH
        ===================================================== */

        let touchStartX =
            0;


        profile.addEventListener(
            "touchstart",
            event => {

                touchStartX =
                    event.changedTouches[0]
                        .screenX;

            },
            {
                passive:
                    true
            }
        );


        profile.addEventListener(
            "touchend",
            event => {

                const endX =
                    event.changedTouches[0]
                        .screenX;


                const distance =
                    endX -
                    touchStartX;


                if (
                    Math.abs(distance) <
                    50
                )
                    return;


                if (
                    distance < 0
                ) {

                    switchPage(
                        "next"
                    );

                } else {

                    switchPage(
                        "prev"
                    );

                }

            },
            {
                passive:
                    true
            }
        );


        /* =====================================================
           MOUSE PARALLAX
        ===================================================== */

        const background =
            document.getElementById(
                "background"
            );


        let mouseX =
            0;

        let mouseY =
            0;


        let smoothX =
            0;

        let smoothY =
            0;


        document.addEventListener(
            "mousemove",
            event => {

                mouseX =
                    event.clientX /
                    window.innerWidth
                    -
                    .5;


                mouseY =
                    event.clientY /
                    window.innerHeight
                    -
                    .5;


                document.documentElement
                    .style.setProperty(
                        "--mx",
                        `${event.clientX / window.innerWidth * 100}%`
                    );


                document.documentElement
                    .style.setProperty(
                        "--my",
                        `${event.clientY / window.innerHeight * 100}%`
                    );

            }
        );


        function parallaxLoop() {

            smoothX +=
                (
                    mouseX -
                    smoothX
                )
                * .025;


            smoothY +=
                (
                    mouseY -
                    smoothY
                )
                * .025;


            background.style.transform =
                `
                    scale(1.18)
                    translate3d(
                        ${smoothX * 3.4}%,
                        ${smoothY * 2.6}%,
                        0
                    )
                `;


            requestAnimationFrame(
                parallaxLoop
            );

        }


        parallaxLoop();


        /* =====================================================
           SLOW BACKGROUND DRIFT
        ===================================================== */

        let driftX =
            0;

        let driftY =
            0;

        let targetDriftX =
            0;

        let targetDriftY =
            0;


        function chooseDrift() {

            targetDriftX =
                (
                    Math.random()
                    -
                    .5
                )
                * .35;


            targetDriftY =
                (
                    Math.random()
                    -
                    .5
                )
                * .30;

        }


        function driftLoop() {

            driftX +=
                (
                    targetDriftX -
                    driftX
                )
                * .0018;


            driftY +=
                (
                    targetDriftY -
                    driftY
                )
                * .0018;


            requestAnimationFrame(
                driftLoop
            );

        }


        chooseDrift();

        driftLoop();


        setInterval(
            chooseDrift,
            9000 +
            Math.random() * 4000
        );


        /* =====================================================
           VFX
        ===================================================== */

        const canvas =
            document.getElementById(
                "vfx"
            );


        const ctx =
            canvas.getContext(
                "2d"
            );


        let width =
            window.innerWidth;


        let height =
            window.innerHeight;


        function resizeCanvas() {

            width =
                canvas.width =
                window.innerWidth;


            height =
                canvas.height =
                window.innerHeight;

        }


        resizeCanvas();


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        /* =====================================================
           PARTICLES
        ===================================================== */

        const particles =
            [];


        class Particle {

            constructor() {

                this.reset(
                    true
                );

            }


            reset(
                initial = false
            ) {

                this.x =
                    Math.random()
                    *
                    width;


                this.y =
                    initial
                        ? Math.random()
                            * height
                        : height + 20;


                this.size =
                    Math.random()
                    * 1.4
                    +
                    .35;


                this.speed =
                    Math.random()
                    * .16
                    +
                    .035;


                this.alpha =
                    Math.random()
                    * .32
                    +
                    .06;


                this.phase =
                    Math.random()
                    *
                    Math.PI
                    *
                    2;

            }


            update(time) {

                this.y -=
                    this.speed;


                this.x +=
                    Math.sin(
                        time *
                        .0003 +
                        this.phase
                    )
                    *
                    .018;


                if (
                    this.y <
                    -20
                ) {

                    this.reset();

                }

            }


            draw() {

                ctx.beginPath();


                ctx.arc(
                    this.x,
                    this.y,
                    this.size,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    `
                        rgba(
                            255,
                            255,
                            255,
                            ${this.alpha}
                        )
                    `;


                ctx.fill();

            }

        }


        for (
            let i = 0;
            i < 45;
            i++
        ) {

            particles.push(
                new Particle()
            );

        }


        /* =====================================================
           CLICK HALOS
        ===================================================== */

        const bursts =
            [];


        document.addEventListener(
            "pointerdown",
            event => {

                bursts.push({

                    x:
                        event.clientX,

                    y:
                        event.clientY,

                    start:
                        performance.now(),

                    duration:
                        700

                });

            }
        );


        function drawBursts() {

            const now =
                performance.now();


            for (
                let i =
                    bursts.length - 1;
                i >= 0;
                i--
            ) {

                const burst =
                    bursts[i];


                const progress =
                    (
                        now -
                        burst.start
                    )
                    /
                    burst.duration;


                if (
                    progress >= 1
                ) {

                    bursts.splice(
                        i,
                        1
                    );

                    continue;

                }


                const alpha =
                    1 -
                    progress;


                const radius =
                    12 +
                    progress *
                    92;


                ctx.beginPath();


                ctx.arc(
                    burst.x,
                    burst.y,
                    radius,
                    0,
                    Math.PI * 2
                );


                ctx.strokeStyle =
                    `
                        rgba(
                            255,
                            255,
                            255,
                            ${alpha * .70}
                        )
                    `;


                ctx.lineWidth =
                    1.5;


                ctx.stroke();


                ctx.beginPath();


                ctx.arc(
                    burst.x,
                    burst.y,
                    radius * .58,
                    0,
                    Math.PI * 2
                );


                ctx.strokeStyle =
                    `
                        rgba(
                            99,
                            210,
                            250,
                            ${alpha * .56}
                        )
                    `;


                ctx.lineWidth =
                    1;


                ctx.stroke();


                /*
                 * Halo 四角光點
                 */

                for (
                    let j = 0;
                    j < 4;
                    j++
                ) {

                    const angle =
                        Math.PI *
                        .5 *
                        j;


                    const x =
                        burst.x +
                        Math.cos(angle)
                        *
                        radius;


                    const y =
                        burst.y +
                        Math.sin(angle)
                        *
                        radius;


                    ctx.beginPath();


                    ctx.arc(
                        x,
                        y,
                        1.8,
                        0,
                        Math.PI * 2
                    );


                    ctx.fillStyle =
                        `
                            rgba(
                                255,
                                255,
                                255,
                                ${alpha}
                            )
                        `;


                    ctx.fill();

                }

            }

        }


        function vfxLoop(
            time
        ) {

            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            particles.forEach(
                particle => {

                    particle.update(
                        time
                    );

                    particle.draw();

                }
            );


            drawBursts();


            requestAnimationFrame(
                vfxLoop
            );

        }


        requestAnimationFrame(
            vfxLoop
        );


        /* =====================================================
           INITIAL
        ===================================================== */

        renderPage(
            0
        );


        /* =====================================================
           BOOT
        ===================================================== */

        const boot =
            document.getElementById(
                "boot"
            );


        const enterPrompt =
            document.getElementById(
                "enter-prompt"
            );


        let entered =
            false;


        /*
         * 開機動畫先跑完
         */

        setTimeout(
            () => {

                enterPrompt.classList.add(
                    "show"
                );

            },
            2200
        );


        function enterSite() {

            if (
                entered
            )
                return;


            entered =
                true;


            if (
                window.resumeInterfaceAudio
            ) {

                window.resumeInterfaceAudio();

            }


            if (
                window.startMusic
            ) {

                window.startMusic();

            }


            if (
                window.playInterfaceSfx
            ) {

                window.playInterfaceSfx(
                    "boot"
                );

            }


            boot.classList.add(
                "complete"
            );


            enterPrompt.classList.remove(
                "show"
            );


            setTimeout(
                () => {

                    boot.classList.add(
                        "hide"
                    );

                    document.body.classList.add(
                        "entered"
                    );

                },
                600
            );


            setTimeout(
                () => {

                    boot.remove();

                },
                1700
            );

        }


        document.addEventListener(
            "pointerdown",
            () => {

                if (
                    !entered
                ) {

                    enterSite();

                }

            },
            {
                passive:
                    true
            }
        );

    </script>


    <script src="music_module.js"></script>

</body>

</html>
