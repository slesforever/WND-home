<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>WND</title>

    <link
        rel="icon"
        href="https://shared.fastly.steamstatic.com/community_assets/images/apps/1256670/6aae1f276e95e65de99d6ffea75f010167d5d0c6.jpg"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================================
           ROOT
        ========================================================= */

        :root {

            --blue: #63d2fa;
            --blue-bright: #b9efff;
            --blue-dark: #388faf;

            --white: #ffffff;

            --text: #3e5b69;
            --muted: #7894a3;

            --mx: 50%;
            --my: 50%;

        }


        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

        }


        body {

            overflow: hidden;

            position: relative;

            background:
                #bcecff;

            color:
                var(--text);

            font-family:
                "Barlow",
                "Noto Sans TC",
                sans-serif;

            user-select:
                none;

            -webkit-tap-highlight-color:
                transparent;

        }


        /* =========================================================
           BACKGROUND IMAGE
        ========================================================= */

        .background {

            position: fixed;

            /*
             * 大幅安全邊界。
             *
             * 即使背景做滑鼠視差，
             * 也不會露出白邊。
             */

            inset: -12%;

            z-index: 0;

            background-image:

                linear-gradient(
                    rgba(220,247,255,0.035),
                    rgba(210,243,255,0.15)
                ),

                url("maxresdefault.jpg");

            background-size:
                cover;

            background-position:
                center center;

            transform:
                scale(1.18)
                translate3d(0,0,0);

            will-change:
                transform;

        }


        /* =========================================================
           BACKGROUND VIGNETTE
        ========================================================= */

        .background-vignette {

            position: fixed;

            inset: 0;

            z-index: 1;

            pointer-events: none;

            background:

                radial-gradient(
                    ellipse at center,
                    transparent 15%,
                    rgba(47,108,134,.16) 100%
                );

        }


        /* =========================================================
           MOUSE LIGHT
        ========================================================= */

        .mouse-light {

            position: fixed;

            inset: 0;

            z-index: 2;

            pointer-events: none;

            background:

                radial-gradient(
                    circle 430px at var(--mx) var(--my),
                    rgba(255,255,255,.20),
                    rgba(255,255,255,.035) 42%,
                    transparent 72%
                );

        }


        /* =========================================================
           GRID
        ========================================================= */

        .grid {

            position: fixed;

            inset: 0;

            z-index: 3;

            pointer-events: none;

            opacity:
                .105;

            background-image:

                linear-gradient(
                    rgba(255,255,255,.24) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,.24) 1px,
                    transparent 1px
                );

            background-size:
                70px 70px;

            mask-image:
                radial-gradient(
                    ellipse at center,
                    black,
                    transparent 82%
                );

            -webkit-mask-image:
                radial-gradient(
                    ellipse at center,
                    black,
                    transparent 82%
                );

        }


        /* =========================================================
           BACK PARTICLES
        ========================================================= */

        #particles-back {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index:
                4;

            pointer-events:
                none;

        }


        /* =========================================================
           MAIN UI
        ========================================================= */

        .main {

            position: relative;

            width: 100%;
            height: 100%;

            z-index:
                10;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

        }


        /* =========================================================
           PROFILE PANEL
        ========================================================= */

        .profile {

            position: relative;

            width:
                min(730px, 88vw);

            min-height:
                465px;

            padding:
                40px 45px 48px;

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,.84),
                    rgba(246,252,255,.64)
                );

            border:
                1px solid
                rgba(255,255,255,.96);

            box-shadow:

                0 32px 90px
                rgba(45,109,139,.25),

                0 5px 20px
                rgba(45,109,139,.12);

            backdrop-filter:
                blur(20px)
                saturate(125%);

            -webkit-backdrop-filter:
                blur(20px)
                saturate(125%);

            overflow:
                hidden;

            opacity:
                0;

            transform:
                translateY(20px)
                scale(.975);

            transition:

                opacity
                .9s
                cubic-bezier(.22,1,.36,1),

                transform
                .9s
                cubic-bezier(.22,1,.36,1);

        }


        body.entered .profile {

            opacity:
                1;

            transform:
                translateY(0)
                scale(1);

        }


        /* =========================================================
           PROFILE SHINE
        ========================================================= */

        .profile::before {

            content:
                "";

            position:
                absolute;

            left:
                0;

            top:
                0;

            width:
                100%;

            height:
                4px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    #73ddff 20%,
                    #ffffff 50%,
                    #73ddff 80%,
                    transparent
                );

            animation:
                profileShine
                4.2s
                ease-in-out
                infinite;

        }


        @keyframes profileShine {

            0%,
            100% {
                opacity:
                    .50;
            }

            50% {
                opacity:
                    1;
            }

        }


        /* =========================================================
           PROFILE LOCAL LIGHT
        ========================================================= */

        .profile-light {

            position:
                absolute;

            inset:
                0;

            z-index:
                1;

            pointer-events:
                none;

            background:

                radial-gradient(
                    circle 400px at var(--mx) var(--my),
                    rgba(255,255,255,.22),
                    transparent 70%
                );

        }


        /* =========================================================
           CORNERS
        ========================================================= */

        .corner {

            position:
                absolute;

            width:
                23px;

            height:
                23px;

            z-index:
                10;

            opacity:
                .62;

        }


        .corner::before,
        .corner::after {

            content:
                "";

            position:
                absolute;

            background:
                var(--blue);

        }


        .corner::before {

            width:
                100%;

            height:
                1px;

        }


        .corner::after {

            width:
                1px;

            height:
                100%;

        }


        .corner-tl {

            top:
                16px;

            left:
                16px;

        }


        .corner-tr {

            top:
                16px;

            right:
                16px;

            transform:
                rotate(90deg);

        }


        .corner-bl {

            bottom:
                16px;

            left:
                16px;

            transform:
                rotate(-90deg);

        }


        .corner-br {

            bottom:
                16px;

            right:
                16px;

            transform:
                rotate(180deg);

        }


        /* =========================================================
           PAGE CONTENT
        ========================================================= */

        .page-content {

            position:
                relative;

            z-index:
                5;

        }


        /* =========================================================
           HEADER
        ========================================================= */

        .section-header {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

        }


        .section-point {

            width:
                7px;

            height:
                7px;

            border-radius:
                50%;

            background:
                var(--blue);

            box-shadow:
                0 0 12px
                rgba(99,210,250,.9);

            animation:
                sectionPulse
                2.2s
                ease-in-out
                infinite;

        }


        @keyframes sectionPulse {

            0%,
            100% {
                opacity:
                    .55;
            }

            50% {
                opacity:
                    1;
            }

        }


        .section-line {

            width:
                36px;

            height:
                1px;

            background:
                var(--blue);

        }


        .section-name {

            color:
                var(--blue-dark);

            font-size:
                10px;

            font-weight:
                800;

            letter-spacing:
                2.5px;

        }


        /* =========================================================
           NAME
        ========================================================= */

        .name-row {

            margin-top:
                16px;

            display:
                flex;

            align-items:
                flex-end;

            justify-content:
                space-between;

        }


        .name {

            color:
                #ffffff;

            font-size:
                clamp(
                    54px,
                    9vw,
                    78px
                );

            line-height:
                .88;

            font-weight:
                800;

            letter-spacing:
                -3px;

            text-shadow:

                0 4px 18px
                rgba(47,111,140,.31);

        }


        .page-tag {

            padding:
                7px 11px;

            margin-bottom:
                5px;

            color:
                #71909f;

            font-size:
                8px;

            font-weight:
                800;

            letter-spacing:
                1.6px;

            border:
                1px solid
                rgba(99,210,250,.30);

            background:
                rgba(255,255,255,.45);

        }


        /* =========================================================
           PAGE 1 : PROFILE
        ========================================================= */

        .profile-layout {

            margin-top:
                30px;

        }


        .stat-grid {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                10px;

        }


        .stat {

            position:
                relative;

            min-height:
                73px;

            padding:
                13px 15px;

            background:
                rgba(255,255,255,.55);

            border:
                1px solid
                rgba(255,255,255,.92);

            overflow:
                hidden;

            transition:

                transform
                .22s
                ease,

                background
                .22s
                ease,

                border-color
                .22s
                ease;

        }


        .stat:hover {

            transform:
                translateY(-3px);

            background:
                rgba(255,255,255,.80);

            border-color:
                rgba(99,210,250,.36);

        }


        .stat::before {

            content:
                "";

            position:
                absolute;

            left:
                0;

            top:
                0;

            width:
                3px;

            height:
                100%;

            background:
                var(--blue);

            transform:
                scaleY(.25);

            transition:
                transform
                .22s
                ease;

        }


        .stat:hover::before {

            transform:
                scaleY(1);

        }


        .stat-label {

            color:
                #7f9ba8;

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1.5px;

            margin-bottom:
                6px;

        }


        .stat-value {

            color:
                #415d6d;

            font-size:
                14px;

            font-weight:
                600;

        }


        .description {

            margin-top:
                10px;

            min-height:
                94px;

            padding:
                15px 17px;

            background:
                rgba(255,255,255,.47);

            border:
                1px solid
                rgba(255,255,255,.90);

        }


        .description-label {

            color:
                #7f9aa8;

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1.5px;

            margin-bottom:
                9px;

        }


        .description-value {

            color:
                #5d7785;

            font-size:
                12px;

            line-height:
                1.55;

        }


        /* =========================================================
           PAGE 2 : FAVORITES
        ========================================================= */

        .favorite-layout {

            margin-top:
                30px;

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                10px;

        }


        .favorite-card {

            min-height:
                115px;

            padding:
                16px;

            background:
                rgba(255,255,255,.55);

            border:
                1px solid
                rgba(255,255,255,.92);

            transition:

                transform
                .22s
                ease,

                background
                .22s
                ease;

        }


        .favorite-card:hover {

            transform:
                translateY(-3px);

            background:
                rgba(255,255,255,.80);

        }


        .favorite-card.wide {

            grid-column:
                1 / -1;

            min-height:
                72px;

        }


        .favorite-symbol {

            width:
                28px;

            height:
                28px;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            margin-bottom:
                11px;

            color:
                var(--blue-dark);

            border:
                1px solid
                rgba(99,210,250,.30);

            background:
                rgba(255,255,255,.45);

            font-size:
                12px;

        }


        .favorite-card.wide
        .favorite-symbol {

            float:
                left;

            margin-right:
                12px;

            margin-bottom:
                0;

        }


        .favorite-label {

            color:
                #819ba8;

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1.5px;

        }


        .favorite-value {

            margin-top:
                6px;

            color:
                #425e6d;

            font-size:
                14px;

            font-weight:
                700;

        }


        .favorite-sub {

            margin-top:
                4px;

            color:
                #8ba0ac;

            font-size:
                9px;

        }


        /* =========================================================
           PAGE 3 : WORKS
        ========================================================= */

        .works-layout {

            margin-top:
                29px;

            display:
                flex;

            flex-direction:
                column;

            gap:
                8px;

        }


        .work {

            display:
                grid;

            grid-template-columns:
                35px 1fr auto;

            align-items:
                center;

            min-height:
                63px;

            padding:
                9px 13px;

            background:
                rgba(255,255,255,.54);

            border:
                1px solid
                rgba(255,255,255,.91);

            transition:

                transform
                .22s
                ease,

                background
                .22s
                ease;

        }


        .work:hover {

            transform:
                translateX(5px);

            background:
                rgba(255,255,255,.80);

        }


        .work-index {

            color:
                var(--blue-dark);

            font-size:
                9px;

            font-weight:
                800;

        }


        .work-name {

            color:
                #445f6e;

            font-size:
                13px;

            font-weight:
                700;

        }


        .work-description {

            color:
                #8aa0ac;

            font-size:
                9px;

            margin-top:
                3px;

        }


        .work-state {

            padding:
                5px 8px;

            color:
                #6192a7;

            background:
                rgba(99,210,250,.10);

            border:
                1px solid
                rgba(99,210,250,.22);

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1px;

        }


        /* =========================================================
           PAGE NUMBER
        ========================================================= */

        .page-number {

            position:
                absolute;

            right:
                27px;

            bottom:
                19px;

            color:
                #7996a5;

            font-size:
                9px;

            font-weight:
                700;

            letter-spacing:
                2px;

            z-index:
                20;

        }


        /* =========================================================
           PAGE SCAN LINE
        ========================================================= */

        .page-scan {

            position:
                absolute;

            left:
                0;

            top:
                0;

            width:
                2px;

            height:
                100%;

            background:
                linear-gradient(
                    to bottom,
                    transparent,
                    rgba(105,220,255,.90),
                    transparent
                );

            opacity:
                0;

            pointer-events:
                none;

            z-index:
                30;

        }


        .page-scan.active {

            animation:
                scanAcross
                .55s
                ease-out
                forwards;

        }


        @keyframes scanAcross {

            from {

                left:
                    0;

                opacity:
                    0;

            }

            15% {

                opacity:
                    .9;

            }

            to {

                left:
                    100%;

                opacity:
                    0;

            }

        }


        /* =========================================================
           NAV
        ========================================================= */

        .nav {

            position:
                fixed;

            top:
                50%;

            z-index:
                50;

            width:
                53px;

            height:
                53px;

            transform:
                translateY(-50%);

            border:
                1px solid
                rgba(255,255,255,.95);

            background:
                rgba(255,255,255,.64);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            box-shadow:
                0 12px 32px
                rgba(50,114,143,.17);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            color:
                var(--blue-dark);

            cursor:
                pointer;

            opacity:
                0;

            transition:

                opacity
                .8s
                ease,

                transform
                .20s
                ease,

                background
                .20s
                ease;

        }


        body.entered .nav {

            opacity:
                1;

        }


        .nav:hover {

            background:
                rgba(255,255,255,.94);

        }


        .nav:active {

            transform:
                translateY(-50%)
                scale(.88);

        }


        .nav-left {

            left:
                24px;

        }


        .nav-right {

            right:
                24px;

        }


        .arrow {

            width:
                10px;

            height:
                10px;

            border-top:
                2px solid
                currentColor;

            border-right:
                2px solid
                currentColor;

        }


        .arrow-left {

            transform:
                rotate(-135deg);

            margin-left:
                4px;

        }


        .arrow-right {

            transform:
                rotate(45deg);

            margin-right:
                4px;

        }


        /* =========================================================
           MUSIC BUTTON
        ========================================================= */

        .music-button {

            position:
                fixed;

            right:
                27px;

            bottom:
                24px;

            z-index:
                120;

            width:
                48px;

            height:
                48px;

            border:
                1px solid
                rgba(255,255,255,.96);

            background:
                rgba(255,255,255,.80);

            color:
                var(--blue-dark);

            box-shadow:
                0 10px 30px
                rgba(50,114,143,.17);

            cursor:
                pointer;

            font-size:
                17px;

            transition:
                all
                .20s
                ease;

        }


        .music-button:hover {

            transform:
                translateY(-3px);

            background:
                white;

        }


        .music-button.playing {

            color:
                white;

            background:
                var(--blue);

            box-shadow:

                0 0 0 5px
                rgba(99,210,250,.11),

                0 10px 30px
                rgba(50,114,143,.22);

        }


        /* =========================================================
           MUSIC PANEL
        ========================================================= */

        .music-panel {

            position:
                fixed;

            right:
                27px;

            bottom:
                82px;

            width:
                375px;

            max-width:
                calc(100vw - 30px);

            z-index:
                119;

            overflow:
                hidden;

            background:

                linear-gradient(
                    145deg,
                    rgba(247,253,255,.95),
                    rgba(226,246,254,.91)
                );

            border:
                1px solid
                rgba(255,255,255,.98);

            box-shadow:

                0 25px 70px
                rgba(45,108,137,.24),

                0 4px 20px
                rgba(45,108,137,.10);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            display:
                none;

        }


        .music-panel.open {

            display:
                block;

            animation:
                musicPanelIn
                .25s
                cubic-bezier(.22,1,.36,1);

        }


        @keyframes musicPanelIn {

            from {

                opacity:
                    0;

                transform:
                    translateY(12px)
                    scale(.97);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* =========================================================
           MUSIC HEADER
        ========================================================= */

        .music-header {

            padding:
                15px 16px 12px;

            border-bottom:
                1px solid
                rgba(84,190,225,.16);

        }


        .music-header-line {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

        }


        .music-title {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            color:
                var(--blue-dark);

            font-size:
                10px;

            font-weight:
                800;

            letter-spacing:
                2px;

        }


        .music-dot {

            width:
                6px;

            height:
                6px;

            border-radius:
                50%;

            background:
                var(--blue);

            box-shadow:
                0 0 10px
                rgba(99,210,250,.75);

        }


        .music-status {

            display:
                flex;

            align-items:
                center;

            gap:
                5px;

            color:
                #7b95a2;

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1px;

        }


        .status-dot {

            width:
                6px;

            height:
                6px;

            border-radius:
                50%;

            background:
                #a7b9c1;

        }


        .music-panel.playing
        .status-dot {

            background:
                var(--blue);

            box-shadow:
                0 0 8px
                rgba(99,210,250,.85);

        }


        .now-label {

            margin-top:
                12px;

            color:
                #8ca1ad;

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                1.4px;

        }


        .now-playing {

            margin-top:
                4px;

            color:
                #476473;

            font-size:
                13px;

            font-weight:
                700;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        /* =========================================================
           EQUALIZER
        ========================================================= */

        .equalizer {

            height:
                23px;

            margin-top:
                8px;

            display:
                flex;

            align-items:
                flex-end;

            gap:
                3px;

        }


        .equalizer span {

            width:
                3px;

            height:
                4px;

            border-radius:

        ========================================================= */

        function renderPage(
            index
        ) {

            const data =
                pages[index];


            pageContent.innerHTML =
                "";


            /*
             * 共用標頭
             */

            const header =
                document.createElement(
                    "div"
                );


            header.innerHTML = `

                <div class="section-header">

                    <span class="section-point"></span>

                    <span class="section-line"></span>

                    <span class="section-name">
                        ${data.header}
                    </span>

                </div>


                <div class="name-row">

                    <div class="name">
                        ${data.name}
                    </div>

                    <div class="page-tag">
                        ${data.tag}
                    </div>

                </div>

            `;


            pageContent.appendChild(
                header
            );


            /* =====================================================
               PROFILE
            ===================================================== */

            if (
                data.type ===
                "profile"
            ) {

                const layout =
                    document.createElement(
                        "div"
                    );


                layout.className =
                    "profile-layout";


                const stats =
                    document.createElement(
                        "div"
                    );


                stats.className =
                    "stat-grid";


                data.stats.forEach(
                    stat => {

                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "stat";


                        item.innerHTML = `

                            <div class="stat-label">
                                ${stat.label}
                            </div>

                            <div class="stat-value">
                                ${stat.value}
                            </div>

                        `;


                        stats.appendChild(
                            item
                        );

                    }
                );


                const description =
                    document.createElement(
                        "div"
                    );


                description.className =
                    "description";


                description.innerHTML = `

                    <div class="description-label">
                        DESCRIPTION
                    </div>

                    <div class="description-value">
                        ${data.description}
                    </div>

                `;


                layout.appendChild(
                    stats
                );


                layout.appendChild(
                    description
                );


                pageContent.appendChild(
                    layout
                );

            }


            /* =====================================================
               FAVORITES
            ===================================================== */

            if (
                data.type ===
                "favorites"
            ) {

                const layout =
                    document.createElement(
                        "div"
                    );


                layout.className =
                    "favorite-layout";


                data.cards.forEach(
                    card => {

                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "favorite-card";


                        if (
                            card.wide
                        ) {

                            item.classList.add(
                                "wide"
                            );

                        }


                        item.innerHTML = `

                            <div class="favorite-symbol">
                                ${card.symbol}
                            </div>

                            <div class="favorite-label">
                                ${card.label}
                            </div>

                            <div class="favorite-value">
                                ${card.value}
                            </div>

                            <div class="favorite-sub">
                                ${card.sub}
                            </div>

                        `;


                        layout.appendChild(
                            item
                        );

                    }
                );


                pageContent.appendChild(
                    layout
                );

            }


            /* =====================================================
               WORKS
            ===================================================== */

            if (
                data.type ===
                "works"
            ) {

                const layout =
                    document.createElement(
                        "div"
                    );


                layout.className =
                    "works-layout";


                data.works.forEach(
                    work => {

                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "work";


                        item.innerHTML = `

                            <div class="work-index">
                                ${work.index}
                            </div>

                            <div>

                                <div class="work-name">
                                    ${work.title}
                                </div>

                                <div class="work-description">
                                    ${work.description}
                                </div>

                            </div>

                            <div class="work-state">
                                ${work.state}
                            </div>

                        `;


                        layout.appendChild(
                            item
                        );

                    }
                );


                pageContent.appendChild(
                    layout
                );

            }


            pageNumber.textContent =
                `${String(index + 1).padStart(2,"0")} / ${String(pages.length).padStart(2,"0")}`;

        }


        /* =========================================================
           PAGE TRANSITION
        ========================================================= */

        function switchPage(
            direction
        ) {

            if (
                changingPage
            )
                return;


            changingPage =
                true;


            if (
                window.playInterfaceSfx
            ) {

                window.playInterfaceSfx(
                    "page"
                );

            }


            pageScan.classList.remove(
                "active"
            );


            requestAnimationFrame(
                () => {

                    pageScan.classList.add(
                        "active"
                    );

                }
            );


            const outX =
                direction === "next"
                    ? -70
                    : 70;


            const inX =
                direction === "next"
                    ? 70
                    : -70;


            profile.style.transition =
                `
                    opacity .24s ease,
                    transform .34s cubic-bezier(.22,1,.36,1),
                    filter .24s ease
                `;


            profile.style.opacity =
                "0";


            profile.style.filter =
                "blur(6px)";


            profile.style.transform =
                `
                    translateX(${outX}px)
                    scale(.96)
                `;


            setTimeout(
                () => {

                    if (
                        direction === "next"
                    ) {

                        currentPage =
                            (
                                currentPage +
                                1
                            )
                            %
                            pages.length;

                    } else {

                        currentPage =
                            (
                                currentPage -
                                1 +
                                pages.length
                            )
                            %
                            pages.length;

                    }


                    renderPage(
                        currentPage
                    );


                    profile.style.transition =
                        "none";


                    profile.style.opacity =
                        "0";


                    profile.style.filter =
                        "blur(6px)";


                    profile.style.transform =
                        `
                            translateX(${inX}px)
                            scale(.96)
                        `;


                    requestAnimationFrame(
                        () => {

                            requestAnimationFrame(
                                () => {

                                    profile.style.transition =
                                        `
                                            opacity .45s ease,
                                            transform .58s cubic-bezier(.22,1,.36,1),
                                            filter .45s ease
                                        `;


                                    profile.style.opacity =
                                        "1";


                                    profile.style.filter =
                                        "blur(0)";


                                    profile.style.transform =
                                        `
                                            translateX(0)
                                            scale(1)
                                        `;

                                }
                            );

                        }
                    );


                    setTimeout(
                        () => {

                            changingPage =
                                false;

                        },
                        600
                    );

                },
                230
            );

        }


        /* =========================================================
           NAVIGATION
        ========================================================= */

        document
            .getElementById(
                "btn-next"
            )
            .addEventListener(
                "click",
                () => {

                    switchPage(
                        "next"
                    );

                }
            );


        document
            .getElementById(
                "btn-prev"
            )
            .addEventListener(
                "click",
                () => {

                    switchPage(
                        "prev"
                    );

                }
            );


        /* =========================================================
           KEYBOARD
        ========================================================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "ArrowRight" ||
                    event.key.toLowerCase() ===
                    "d"
                ) {

                    switchPage(
                        "next"
                    );

                }


                if (
                    event.key ===
                    "ArrowLeft" ||
                    event.key.toLowerCase() ===
                    "a"
                ) {

                    switchPage(
                        "prev"
                    );

                }

            }
        );


        /* =========================================================
           TOUCH
        ========================================================= */

        let touchStartX =
            0;


        profile.addEventListener(
            "touchstart",
            event => {

                touchStartX =
                    event.changedTouches[0]
                        .screenX;

            },
            {
                passive:
                    true
            }
        );


        profile.addEventListener(
            "touchend",
            event => {

                const touchEndX =
                    event.changedTouches[0]
                        .screenX;


                const distance =
                    touchEndX -
                    touchStartX;


                if (
                    Math.abs(distance) <
                    50
                )
                    return;


                if (
                    distance < 0
                ) {

                    switchPage(
                        "next"
                    );

                } else {

                    switchPage(
                        "prev"
                    );

                }

            },
            {
                passive:
                    true
            }
        );


        /* =========================================================
           MOUSE POSITION
        ========================================================= */

        let mouseX =
            0;


        let mouseY =
            0;


        let smoothMouseX =
            0;


        let smoothMouseY =
            0;


        document.addEventListener(
            "mousemove",
            event => {

                mouseX =
                    (
                        event.clientX /
                        window.innerWidth
                    )
                    -
                    .5;


                mouseY =
                    (
                        event.clientY /
                        window.innerHeight
                    )
                    -
                    .5;


                document.documentElement
                    .style.setProperty(
                        "--mx",
                        `${event.clientX / window.innerWidth * 100}%`
                    );


                document.documentElement
                    .style.setProperty(
                        "--my",
                        `${event.clientY / window.innerHeight * 100}%`
                    );

            }
        );


        /* =========================================================
           BACKGROUND DRIFT
        ========================================================= */

        let driftX =
            0;


        let driftY =
            0;


        let targetDriftX =
            0;


        let targetDriftY =
            0;


        function chooseDrift() {

            targetDriftX =
                (
                    Math.random()
                    -
                    .5
                )
                *
                .45;


            targetDriftY =
                (
                    Math.random()
                    -
                    .5
                )
                *
                .35;

        }


        function animateBackground() {

            smoothMouseX +=
                (
                    mouseX -
                    smoothMouseX
                )
                *
                .025;


            smoothMouseY +=
                (
                    mouseY -
                    smoothMouseY
                )
                *
                .025;


            driftX +=
                (
                    targetDriftX -
                    driftX
                )
                *
                .0016;


            driftY +=
                (
                    targetDriftY -
                    driftY
                )
                *
                .0016;


            const x =
                smoothMouseX *
                3.2
                +
                driftX;


            const y =
                smoothMouseY *
                2.5
                +
                driftY;


            background.style.transform =
                `
                    scale(1.18)
                    translate3d(
                        ${x}%,
                        ${y}%,
                        0
                    )
                `;


            requestAnimationFrame(
                animateBackground
            );

        }


        chooseDrift();

        setInterval(
            chooseDrift,
            8500 +
            Math.random() * 5000
        );


        animateBackground();


        /* =========================================================
           PARTICLE ENGINE
        ========================================================= */

        const backCanvas =
            document.getElementById(
                "particles-back"
            );


        const frontCanvas =
            document.getElementById(
                "particles-front"
            );


        const backCtx =
            backCanvas.getContext(
                "2d"
            );


        const frontCtx =
            frontCanvas.getContext(
                "2d"
            );


        let width =
            window.innerWidth;


        let height =
            window.innerHeight;


        function resizeParticles() {

            width =
                window.innerWidth;

            height =
                window.innerHeight;


            backCanvas.width =
                width;

            backCanvas.height =
                height;


            frontCanvas.width =
                width;

            frontCanvas.height =
                height;

        }


        resizeParticles();


        window.addEventListener(
            "resize",
            resizeParticles
        );


        /* =========================================================
           PARTICLE CLASS
        ========================================================= */

        class Particle {

            constructor(
                layer
            ) {

                this.layer =
                    layer;

                this.reset(
                    true
                );

            }


            reset(
                initial = false
            ) {

                this.x =
                    Math.random()
                    *
                    width;


                this.y =
                    initial
                        ? Math.random()
                            * height
                        : height + 30;


                /*
                 * 深度
                 */

                if (
                    this.layer ===
                    "back"
                ) {

                    /*
                     * 遠景
                     */

                    this.depth =
                        Math.random()
                        *
                        .35
                        +
                        .10;

                } else {

                    /*
                     * 近景
                     */

                    this.depth =
                        Math.random()
                        *
                        .40
                        +
                        .60;

                }


                this.size =
                    this.layer ===
                    "back"

                        ? Math.random()
                            * 1.0
                            +
                            .25

                        : Math.random()
                            * 1.9
                            +
                            .45;


                this.speed =
                    this.layer ===
                    "back"

                        ? Math.random()
                            * .10
                            +
                            .025

                        : Math.random()
                            * .23
                            +
                            .07;


                this.alpha =
                    this.layer ===
                    "back"

                        ? Math.random()
                            * .16
                            +
                            .035

                        : Math.random()
                            * .30
                            +
                            .07;


                this.horizontal =
                    (
                        Math.random()
                        -
                        .5
                    )
                    *
                    .13;


                this.phase =
                    Math.random()
                    *
                    Math.PI
                    *
                    2;


                /*
                 * 少量粒子變成星芒
                 */

                this.star =
                    Math.random()
                    <
                    (
                        this.layer ===
                        "front"
                            ? .08
                            : .025
                    );

            }


            update(
                time
            ) {

                /*
                 * 向上
                 */

                this.y -=
                    this.speed;


                /*
                 * 非直線漂移
                 */

                this.x +=
                    this.horizontal;


                this.x +=
                    Math.sin(
                        time
                        *
                        .00035
                        +
                        this.phase
                    )
                    *
                    (
                        .015 *
                        this.depth
                    );


                /*
                 * 滑鼠微弱排斥 / 引導
                 */

                const dx =
                    (
                        mouseX *
                        width
                    )
                    -
                    (
                        this.x -
                        width / 2
                    );


                const dy =
                    (
                        mouseY *
                        height
                    )
                    -
                    (
                        this.y -
                        height / 2
                    );


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (
                    distance <
                    180
                ) {

                    const strength =
                        (
                            1 -
                            distance /
                            180
                        )
                        *
                        .006
                        *
                        this.depth;


                    this.x -=
                        dx *
                        strength;

                    this.y -=
                        dy *
                        strength;

                }


                /*
                 * 螢幕左側出去
                 */

                if (
                    this.x <
                    -30
                ) {

                    this.x =
                        width +
                        30;

                }


                if (
                    this.x >
                    width + 30
                ) {

                    this.x =
                        -30;

                }


                /*
                 * 頂部出去 → 重生
                 */

                if (
                    this.y <
                    -30
                ) {

                    this.reset(
                        false
                    );

                }

            }


            draw(
                ctx,
                time
            ) {

                /*
                 * 呼吸亮度
                 */

                const breathing =
                    1
                    +
                    Math.sin(
                        time
                        *
                        .001
                        +
                        this.phase
                    )
                    *
                    .16;


                const alpha =
                    this.alpha *
                    breathing;


                /*
                 * 普通圓點
                 */

                if (
                    !this.star
                ) {

                    ctx.beginPath();


                    ctx.arc(
                        this.x,
                        this.y,
                        this.size,
                        0,
                        Math.PI * 2
                    );


                    ctx.fillStyle =
                        `
                            rgba(
                                255,
                                255,
                                255,
                                ${alpha}
                            )
                        `;


                    ctx.fill();


                    return;

                }


                /*
                 * 星芒粒子
                 */

                const length =
                    this.size *
                    4.5;


                ctx.save();


                ctx.globalAlpha =
                    alpha;


                ctx.translate(
                    this.x,
                    this.y
                );


                /*
                 * 柔光
                 */

                ctx.shadowBlur =
                    10;

                ctx.shadowColor =
                    "rgba(255,255,255,.75)";


                ctx.beginPath();


                ctx.moveTo(
                    0,
                    -length
                );


                ctx.lineTo(
                    this.size *
                    .35,
                    0
                );


                ctx.lineTo(
                    0,
                    length
                );


                ctx.lineTo(
                    -this.size *
                    .35,
                    0
                );


                ctx.closePath();


                ctx.fillStyle =
                    "rgba(255,255,255,.80)";


                ctx.fill();


                ctx.restore();

            }

        }


        /* =========================================================
           CREATE PARTICLES
        ========================================================= */

        const backParticles =
            [];


        const frontParticles =
            [];


        for (
            let i = 0;
            i < 65;
            i++
        ) {

            backParticles.push(
                new Particle(
                    "back"
                )
            );

        }


        for (
            let i = 0;
            i < 30;
            i++
        ) {

            frontParticles.push(
                new Particle(
                    "front"
                )
            );

        }


        /* =========================================================
           CLICK PARTICLE BURSTS
        ========================================================= */

        const clickBursts =
            [];


        document.addEventListener(
            "pointerdown",
            event => {

                const x =
                    event.clientX;


                const y =
                    event.clientY;


                const burst =
                    {

                        x:
                            x,

                        y:
                            y,

                        start:
                            performance.now(),

                        duration:
                            850,

                        particles:
                            []

                    };


                /*
                 * 8 個向外飛的小光粒
                 */

                for (
                    let i = 0;
                    i < 8;
                    i++
                ) {

                    const angle =
                        (
                            Math.PI *
                            2
                            /
                            8
                        )
                        *
                        i
                        +
                        Math.random()
                        *
                        .3;


                    burst.particles.push({

                        angle:
                            angle,

                        speed:
                            Math.random()
                            *
                            1.2
                            +
                            .8,

                        size:
                            Math.random()
                            *
                            1.6
                            +
                            .7

                    });

                }


                clickBursts.push(
                    burst
                );

            }
        );


        function drawClickBursts() {

            const now =
                performance.now();


            for (
                let i =
                    clickBursts.length - 1;
                i >= 0;
                i--
            ) {

                const burst =
                    clickBursts[i];


                const progress =
                    (
                        now -
                        burst.start
                    )
                    /
                    burst.duration;


                if (
                    progress >= 1
                ) {

                    clickBursts.splice(
                        i,
                        1
                    );

                    continue;

                }


                const alpha =
                    1 -
                    progress;


                /*
                 * 外圍 Halo
                 */

                const radius =
                    10 +
                    progress *
                    95;


                frontCtx.beginPath();


                frontCtx.arc(
                    burst.x,
                    burst.y,
                    radius,
                    0,
                    Math.PI * 2
                );


                frontCtx.strokeStyle =
                    `
                        rgba(
                            255,
                            255,
                            255,
                            ${alpha * .70}
                        )
                    `;


                frontCtx.lineWidth =
                    1.6;


                frontCtx.stroke();


                /*
                 * 第二圈藍色 Halo
                 */

                frontCtx.beginPath();


                frontCtx.arc(
                    burst.x,
                    burst.y,
                    radius * .58,
                    0,
                    Math.PI * 2
                );


                frontCtx.strokeStyle =
                    `
                        rgba(
                            99,
                            210,
                            250,
                            ${alpha * .58}
                        )
                    `;


                frontCtx.lineWidth =
                    1;


                frontCtx.stroke();


                /*
                 * 外飛粒子
                 */

                burst.particles.forEach(
                    particle => {

                        const distance =
                            progress *
                            75 *
                            particle.speed;


                        const px =
                            burst.x
                            +
                            Math.cos(
                                particle.angle
                            )
                            *
                            distance;


                        const py =
                            burst.y
                            +
                            Math.sin(
                                particle.angle
                            )
                            *
                            distance;


                        frontCtx.beginPath();


                        frontCtx.arc(
                            px,
                            py,
                            particle.size,
                            0,
                            Math.PI * 2
                        );


                        frontCtx.fillStyle =
                            `
                                rgba(
                                    255,
                                    255,
                                    255,
                                    ${alpha}
                                )
                            `;


                        frontCtx.fill();

                    }
                );

            }

        }


        /* =========================================================
           PARTICLE LOOP
        ========================================================= */

        function particleLoop(
            time
        ) {

            backCtx.clearRect(
                0,
                0,
                width,
                height
            );


            frontCtx.clearRect(
                0,
                0,
                width,
                height
            );


            /*
             * 背景粒子
             */

            backParticles.forEach(
                particle => {

                    particle.update(
                        time
                    );

                    particle.draw(
                        backCtx,
                        time
                    );

                }
            );


            /*
             * 前景粒子
             */

            frontParticles.forEach(
                particle => {

                    particle.update(
                        time
                    );

                    particle.draw(
                        frontCtx,
                        time
                    );

                }
            );


            /*
             * 點擊 FX
             */

            drawClickBursts();


            requestAnimationFrame(
                particleLoop
            );

        }


        requestAnimationFrame(
            particleLoop
        );


        /* =========================================================
           INITIAL PAGE
        ========================================================= */

        renderPage(
            0
        );


        /* =========================================================
           BOOT
        ========================================================= */

        const boot =
            document.getElementById(
                "boot"
            );


        const enterPrompt =
            document.getElementById(
                "enter-prompt"
            );


        let entered =
            false;


        /*
         * 啟動提示
         */

        setTimeout(
            () => {

                if (
                    !entered
                ) {

                    enterPrompt.classList.add(
                        "show"
                    );

                }

            },
            2200
        );


        /* =========================================================
           ENTER SITE
        ========================================================= */

        function enterSite() {

            if (
                entered
            )
                return;


            entered =
                true;


            /*
             * Web Audio 授權
             */

            if (
                window.resumeInterfaceAudio
            ) {

                window.resumeInterfaceAudio();

            }


            /*
             * 音樂
             */

            if (
                window.startMusic
            ) {

                window.startMusic();

            }


            /*
             * 開機音效
             */

            if (
                window.playInterfaceSfx
            ) {

                window.playInterfaceSfx(
                    "boot"
                );

            }


            /*
             * Core 爆發
             */

            boot.classList.add(
                "complete"
            );


            enterPrompt.classList.remove(
                "show"
            );


            /*
             * UI 進場
             */

            setTimeout(
                () => {

                    boot.classList.add(
                        "hide"
                    );


                    document.body.classList.add(
                        "entered"
                    );

                },
                600
            );


            /*
             * 移除 Boot
             */

            setTimeout(
                () => {

                    boot.remove();

                },
                1700
            );

        }


        document.addEventListener(
            "pointerdown",
            () => {

                if (
                    !entered
                ) {

                    enterSite();

                }

            },
            {
                passive:
                    true
            }
        );

    </script>


    <!-- =========================================================
         MUSIC MODULE
    ========================================================= -->

    <script src="music_module.js"></script>
