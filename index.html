<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE SYSTEM - Commercial HUD Boot Screen</title>
  <style>
    :root {
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.4);
      --bg-dark: #030712;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--bg-dark);
      color: #fff;
      font-family: 'Consolas', 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
    }

    /* 隱藏 YouTube 播放器 */
    #youtube-player {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* 全螢幕開機動畫容器 */
    #boot-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #0a192f 0%, #020611 100%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    /* 背景戰術網格與掃描線 */
    .hud-grid {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .scanlines {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }

    /* 中央幾何菱形 Core */
    .core-container {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 2.5rem;
    }
    .diamond-outer {
      position: absolute;
      width: 110px;
      height: 110px;
      border: 2px solid var(--cyan);
      transform: rotate(45deg);
      box-shadow: 0 0 15px var(--cyan-glow), inset 0 0 15px var(--cyan-glow);
      animation: rotateOuter 10s linear infinite;
    }
    .diamond-inner {
      position: absolute;
      width: 70px;
      height: 70px;
      border: 1px dashed var(--cyan);
      transform: rotate(45deg);
      animation: rotateInner 5s linear infinite reverse;
    }
    .diamond-center {
      width: 20px;
      height: 20px;
      background: var(--cyan);
      transform: rotate(45deg);
      box-shadow: 0 0 20px var(--cyan);
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes rotateOuter { 0% { transform: rotate(45deg); } 100% { transform: rotate(405deg); } }
    @keyframes rotateInner { 0% { transform: rotate(45deg); } 100% { transform: rotate(405deg); } }
    @keyframes pulse { 0% { opacity: 0.4; transform: rotate(45deg) scale(0.8); } 100% { opacity: 1; transform: rotate(45deg) scale(1.2); } }

    /* 進度面板 */
    .progress-box {
      width: 360px;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .status-log {
      font-size: 12px;
      color: rgba(0, 240, 255, 0.85);
      height: 22px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--cyan);
      margin: 12px 0;
      position: relative;
      box-shadow: 0 0 8px var(--cyan-glow);
    }
    .bar-fill {
      width: 0%;
      height: 100%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      transition: width 0.08s linear;
    }
    .percent-text {
      color: var(--cyan);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* 商業級進入按鈕 */
    .start-btn {
      display: none;
      margin-top: 15px;
      padding: 14px 36px;
      background: rgba(0, 240, 255, 0.1);
      border: 2px solid var(--cyan);
      color: var(--cyan);
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 3px;
      cursor: pointer;
      text-shadow: 0 0 8px var(--cyan);
      box-shadow: 0 0 20px var(--cyan-glow);
      clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
      transition: all 0.25s ease;
    }
    .start-btn:hover {
      background: var(--cyan);
      color: #000;
      box-shadow: 0 0 30px var(--cyan);
      text-shadow: none;
    }
  </style>
</head>
<body>

  <!-- 音樂播放器載入區 (Unwelcome School) -->
  <div id="youtube-player"></div>

  <!-- 開機動畫遮罩 -->
  <div id="boot-screen">
    <div class="hud-grid"></div>
    <div class="scanlines"></div>

    <div class="core-container">
      <div class="diamond-outer"></div>
      <div class="diamond-inner"></div>
      <div class="diamond-center"></div>
    </div>

    <div class="progress-box">
      <div class="status-log" id="status-text">SYSTEM INITIATING...</div>
      <div class="bar-bg">
        <div class="bar-fill" id="bar-fill"></div>
      </div>
      <div class="percent-text" id="percent-text">0%</div>
      <button id="start-btn" class="start-btn">INITIALIZE SYSTEM [ENTER]</button>
    </div>
  </div>

  <script>
    // 1. YouTube Iframe API 載入設定
    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        videoId: 'eMqWJDP28p8', // Unwelcome School
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'loop': 1,
          'playlist': 'eMqWJDP28p8'
        }
      });
    }

    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // 2. 模擬高階系統診斷 Log 載入動畫
    let percent = 0;
    const barFill = document.getElementById('bar-fill');
    const percentText = document.getElementById('percent-text');
    const statusText = document.getElementById('status-text');
    const startBtn = document.getElementById('start-btn');
    const bootScreen = document.getElementById('boot-screen');

    const logs = [
      "AUTHENTICATING CREDENTIALS...",
      "ALLOCATING HUD GRAPHICS...",
      "MOUNTING AUDIO CORE [Unwelcome School]...",
      "DECRYPTING ARCHIVE DATA...",
      "SYSTEM CHECK COMPLETED."
    ];

    const timer = setInterval(() => {
      percent += Math.floor(Math.random() * 5) + 1;
      if (percent >= 100) {
        percent = 100;
        clearInterval(timer);
        barFill.style.width = '100%';
        statusText.innerText = "SYSTEM READY - CLICK TO START";
        percentText.style.display = 'none';
        startBtn.style.display = 'inline-block';
      } else {
        barFill.style.width = percent + '%';
        percentText.innerText = percent + '%';
        let logIndex = Math.floor((percent / 100) * logs.length);
        statusText.innerText = logs[Math.min(logIndex, logs.length - 1)];
      }
    }, 40);

    // 3. 點擊進入時播放音樂並解鎖頁面
    startBtn.addEventListener('click', () => {
      if (player && typeof player.playVideo === 'function') {
        player.unMute();
        player.setVolume(80);
        player.playVideo();
      }
      bootScreen.style.opacity = '0';
      bootScreen.style.transform = 'scale(1.05)';
      setTimeout(() => {
        bootScreen.style.display = 'none';
      }, 800);
    });
  </script>
</body>
</html>
