<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERMINAL // WND</title>
  <style>
    :root {
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.4);
      --dark-navy: #09111e;
      --card-bg: rgba(13, 22, 38, 0.65);
      --card-border: rgba(255, 255, 255, 0.18);
      --text-main: #ffffff;
      --text-sub: #8da3c0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: url('maxresdefault.jpg') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      color: var(--text-main);
      position: relative;
    }

    /* 背景質感微暗化與網格濾鏡 */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(8, 12, 20, 0.35);
      backdrop-filter: brightness(0.9) contrast(1.05);
      z-index: 0;
    }

    /* ==========================================
       1. 酷炫科技風開機畫面 (Boot Screen)
       ========================================== */
    #boot-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(13, 22, 38, 0.85) 0%, rgba(5, 9, 15, 0.96) 100%);
      backdrop-filter: blur(25px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #boot-screen.fade-out {
      opacity: 0;
      transform: scale(1.12);
      pointer-events: none;
    }

    /* 掃描線與中央光環效果 */
    .scanline {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 240, 255, 0.03) 51%);
      background-size: 100% 4px;
      pointer-events: none;
    }

    .tech-core {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: all 0.5s ease;
    }

    .ring-outer {
      inset: 0;
      border-top-color: var(--cyan);
      border-bottom-color: var(--cyan);
      box-shadow: 0 0 20px var(--cyan-glow);
      animation: spin 6s linear infinite;
    }

    .ring-inner {
      inset: 15px;
      border-left-color: rgba(255, 255, 255, 0.6);
      border-right-color: rgba(255, 255, 255, 0.6);
      animation: spin-reverse 4s linear infinite;
    }

    .core-dot {
      width: 16px;
      height: 16px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 15px var(--cyan);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(0.85); opacity: 0.6; } 50% { transform: scale(1.2); opacity: 1; } }

    .boot-text-container {
      text-align: center;
      z-index: 2;
    }

    .boot-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 8px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #8da3c0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .boot-status {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--cyan);
      opacity: 0.8;
      margin-bottom: 40px;
      font-family: monospace;
    }

    .start-btn {
      padding: 12px 36px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #ffffff;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid var(--cyan);
      border-radius: 4px;
      box-shadow: 0 0 15px var(--cyan-glow);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    #boot-screen:hover .start-btn {
      background: var(--cyan);
      color: var(--dark-navy);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
    }

    /* ==========================================
       2. 主面板介面 (Main UI)
       ========================================== */
    .top-bar {
      width: 100%;
      height: 48px;
      background: rgba(9, 17, 30, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      z-index: 10;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title::before {
      content: '';
      width: 6px; height: 6px;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      border-radius: 50%;
    }

    .sys-info {
      font-size: 11px;
      font-family: monospace;
      color: var(--text-sub);
    }

    .main-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 10;
    }

    .glass-card {
      width: 880px;
      max-width: 95vw;
      height: 520px;
      background: var(--card-bg);
      backdrop-filter: blur(24px) saturate(140%);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .tab-bar {
      display: flex;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 12px;
    }

    .tab-item {
      padding: 16px 28px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-sub);
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .tab-item:hover { color: #ffffff; }

    .tab-item.active {
      color: var(--cyan);
    }

    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 2px;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    .content-body {
      flex: 1;
      position: relative;
      padding: 28px;
    }

    .page {
      position: absolute;
      inset: 28px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      display: flex;
      gap: 28px;
    }

    .page.active {
      opacity: 1;
      visibility: visible;
    }

    /* 個人資料面板 */
    .user-profile-box {
      width: 220px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-ring {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 15px var(--cyan-glow);
      display: flex; justify-content: center; align-items: center;
      font-size: 20px; font-weight: 800;
      color: #ffffff;
      margin-bottom: 16px;
      background: rgba(0, 240, 255, 0.05);
    }

    .user-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .user-role {
      font-size: 11px;
      color: var(--cyan);
      font-family: monospace;
      letter-spacing: 1px;
    }

    .detail-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .placeholder-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 16px;
      color: var(--text-sub);
      font-size: 13px;
      line-height: 1.6;
    }

    /* 音樂控制鈕 */
    .audio-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--cyan);
      color: #ffffff;
      padding: 8px 18px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .audio-btn:hover {
      background: var(--cyan);
      color: var(--dark-navy);
    }

    #yt-player-container {
      position: absolute;
      width: 0; height: 0;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- YouTube 播放器容器 -->
  <div id="yt-player-container">
    <div id="yt-player"></div>
  </div>

  <!-- 1. 酷炫開機動畫 -->
  <div id="boot-screen">
    <div class="scanline"></div>
    <div class="tech-core">
      <div class="ring ring-outer"></div>
      <div class="ring ring-inner"></div>
      <div class="core-dot"></div>
    </div>
    <div class="boot-text-container">
      <div class="boot-title">TERMINAL OS</div>
      <div class="boot-status">[ USER: WND // SYSTEM READY ]</div>
      <button class="start-btn" onclick="startSystem()">INITIALIZE</button>
    </div>
  </div>

  <!-- 2. 頂部資訊列 -->
  <header class="top-bar">
    <div class="brand-title">TERMINAL // WND</div>
    <div class="sys-info">STATUS: ONLINE</div>
  </header>

  <!-- 3. 主面板 -->
  <main class="main-viewport">
    <div class="glass-card">
      <nav class="tab-bar">
        <div class="tab-item active" onclick="switchTab(0)">01 PROFILE</div>
        <div class="tab-item" onclick="switchTab(1)">02 MESSAGES</div>
        <div class="tab-item" onclick="switchTab(2)">03 ARCHIVE</div>
      </nav>

      <div class="content-body">
        <!-- 頁面 1: 個人檔案 -->
        <div class="page active">
          <div class="user-profile-box">
            <div class="avatar-ring">WND</div>
            <div class="user-name">WND</div>
            <div class="user-role">// USER PROFILE</div>
          </div>
          <div class="detail-container">
            <div class="placeholder-box">
              <strong style="color: var(--cyan);">[ 個人簡介 / OVERVIEW ]</strong><br>
              請在此處填寫 WND 的個人介紹...
            </div>
            <div class="placeholder-box">
              <strong style="color: var(--cyan);">[ 專長領域 / SKILLS ]</strong><br>
              預留技能專長介紹位置...
            </div>
          </div>
        </div>

        <!-- 頁面 2: 訊息區 -->
        <div class="page">
          <div class="detail-container" style="width: 100%;">
            <div class="placeholder-box">
              <strong style="color: var(--cyan);">[ 訊息與留言 / MESSAGES ]</strong><br>
              預留訊息與對話內容區塊...
            </div>
          </div>
        </div>

        <!-- 頁面 3: 作品庫 -->
        <div class="page">
          <div class="detail-container" style="width: 100%;">
            <div class="placeholder-box">
              <strong style="color: var(--cyan);">[ 專案歸檔 / WORK ARCHIVE ]</strong><br>
              預留作品與專案紀錄位置...
            </div>
          </div>
        </div>
      </div>

      <button class="audio-btn" onclick="toggleBgm()">
        <span id="bgm-icon">♪</span> BGM CONTROL
      </button>
    </div>
  </main>

  <!-- 引用外部腳本 -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
